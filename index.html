<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مذاكرة CMA – شرح وتدريب وحالات CBQ للجزئين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --sunk:#ECEEE8; --text:#1C2422; --muted:#5D6864; --rule:#D6DBD4;
  --ink:#173F38; --ink-soft:#E1ECE8;
  --p1:#1D6B74; --p1-soft:#DDEEF0; --p2:#7A3E6E; --p2-soft:#F3E4EF;
  --pc:var(--p1); --pc-soft:var(--p1-soft);
  --ok:#1B7651; --ok-soft:#E2F2EA; --no:#B13C2C; --no-soft:#F9E6E2; --amber:#99650F; --amber-soft:#FBF0DA;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#16211F; --sunk:#1C2A27; --text:#E3EBE8; --muted:#9CABA6; --rule:#2B3B37;
  --ink:#9FD3C5; --ink-soft:#1C332E; --p1:#6CC3CC; --p1-soft:#16343A; --p2:#D69BC8; --p2-soft:#3A2236;
  --ok:#5CC79A; --ok-soft:#153328; --no:#EB8273; --no-soft:#3A1F1B; --amber:#E5BC67; --amber-soft:#33291A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#16211F; --sunk:#1C2A27; --text:#E3EBE8; --muted:#9CABA6; --rule:#2B3B37;
  --ink:#9FD3C5; --ink-soft:#1C332E; --p1:#6CC3CC; --p1-soft:#16343A; --p2:#D69BC8; --p2-soft:#3A2236;
  --ok:#5CC79A; --ok-soft:#153328; --no:#EB8273; --no-soft:#3A1F1B; --amber:#E5BC67; --amber-soft:#33291A; color-scheme:dark;}
body[data-part="2"]{--pc:var(--p2);--pc-soft:var(--p2-soft)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.85}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4,.disp{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);line-height:1.5;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pc);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--pc)}
.bar{display:flex;align-items:center;gap:14px;max-width:1300px;margin:0 auto;padding:9px 18px}
.brand{font-family:"Readex Pro",Tahoma,sans-serif;font-weight:700;color:var(--ink);font-size:19px;white-space:nowrap;background:none;border:0;padding:0;text-align:right}
.brand small{display:block;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:500;font-size:12px;color:var(--muted);line-height:1.2}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:15px}
.seg button[aria-pressed="true"][data-part="1"]{background:var(--p1);color:var(--surface)}
.seg button[aria-pressed="true"][data-part="2"]{background:var(--p2);color:var(--surface)}
nav.tabs{display:flex;gap:2px;margin-inline-start:auto;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 11px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--pc);background:var(--pc-soft)}
#menuBtn{display:none;background:var(--sunk);border:0;border-radius:8px;padding:6px 10px;color:var(--ink);font-weight:600}

.wrap{display:grid;grid-template-columns:310px minmax(0,1fr);max-width:1300px;margin:0 auto}
aside.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);height:calc(100vh - 60px);overflow:auto;border-inline-end:1px solid var(--rule);padding:16px 14px 40px;background:var(--bg)}
.toc .ph{font-size:13px;color:var(--muted);padding:0 8px 6px}
.dom{margin:14px 0 4px;padding:0 8px}
.dom .dt{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px;color:var(--pc)}
.dom .wt{height:4px;background:var(--sunk);border-radius:2px;margin-top:4px}
.dom .wt i{display:block;height:100%;background:var(--pc);border-radius:2px}
.toc button.ls{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:right;background:none;border:0;padding:5px 8px;border-radius:7px;color:var(--text);font-size:14.5px;line-height:1.6}
.toc button.ls:hover{background:var(--sunk)}
.toc button.ls.on{background:var(--pc-soft);color:var(--pc);font-weight:600}
.toc .tick{flex:none;width:15px;height:15px;margin-top:5px;border:1.5px solid var(--rule);border-radius:50%}
.toc .done .tick{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--bg)}
main{padding:28px clamp(16px,4vw,48px) 120px;min-width:0}
.col{max-width:800px}

.crumb{color:var(--pc);font-size:14px;font-weight:600;margin-bottom:4px}
.lesson-title{font-size:clamp(24px,3.4vw,32px);font-weight:700;margin-bottom:18px}
main h3{font-size:20px;margin:28px 0 10px}
main p{margin:0 0 14px}
main ul,main ol{margin:0 0 16px;padding-inline-start:24px}
main li{margin-bottom:6px}
main li::marker{color:var(--pc);font-weight:700}
.tbl{overflow-x:auto;margin:6px 0 20px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.7}
th{background:var(--ink);color:var(--surface);text-align:right;padding:9px 12px;font-weight:600}
td{padding:8px 12px;border-top:1px solid var(--rule);vertical-align:top}
.box{border-radius:10px;padding:14px 18px;margin:8px 0 22px;border-inline-start:4px solid}
.box .bt{font-weight:700;margin-bottom:6px}
.box p{margin:0 0 6px}
.box.ex{background:var(--amber-soft);border-color:var(--amber)} .box.ex .bt{color:var(--amber)}
.box.exam{background:var(--pc-soft);border-color:var(--pc)} .box.exam .bt{color:var(--pc)}
.box.note{background:var(--no-soft);border-color:var(--no)} .box.note .bt{color:var(--no)}

.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--pc)}
.btn.primary{background:var(--pc);color:var(--surface);border-color:var(--pc)}
.btn.good{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ai-only[hidden]{display:none!important}

/* home blueprint */
.hero h1{font-size:clamp(26px,4vw,40px);font-weight:700;line-height:1.35;max-width:17em}
.hero p{color:var(--muted);max-width:40em;margin:12px 0 0}
.bp{margin:30px 0 8px}
.bp .bph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.bp .bph b{font-family:"Readex Pro",Tahoma,sans-serif;font-size:20px}
.bp .bph span{color:var(--muted);font-size:14px}
.strip{display:flex;height:64px;border-radius:10px;overflow:hidden;gap:3px}
.strip button{border:0;padding:6px 8px;color:var(--surface);text-align:right;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:filter .15s}
.strip button:hover{filter:brightness(1.12)}
.strip .c{font-family:"Readex Pro",Tahoma,sans-serif;font-weight:700;font-size:15px}
.strip .w{font-size:13px;opacity:.92}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px;margin:10px 0 0;font-size:14.5px}
.legend button{background:none;border:0;padding:4px 0;text-align:right;color:var(--text);display:flex;gap:8px;align-items:baseline}
.legend button b{font-family:"Readex Pro",Tahoma,sans-serif;min-width:26px}
.legend button:hover span{color:var(--pc)}
.fmt{display:grid;grid-template-columns:3fr 1fr;gap:3px;margin:34px 0 6px;border-radius:10px;overflow:hidden}
.fmt div{padding:14px 16px;background:var(--surface);border:1px solid var(--rule)}
.fmt b{display:block;font-family:"Readex Pro",Tahoma,sans-serif;font-size:22px;color:var(--ink)}
.fmt span{font-size:14px;color:var(--muted)}
.fmt .gate{grid-column:1/-1;background:var(--sunk);font-size:14.5px;color:var(--text)}
.stats{display:flex;flex-wrap:wrap;gap:26px;margin:24px 0;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stats div{font-size:14px;color:var(--muted)} .stats b{display:block;font-size:26px;color:var(--ink);font-family:"Readex Pro",Tahoma,sans-serif}

/* quiz */
.q{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.q .qt{font-weight:600;margin-bottom:10px}
.q .tag{font-size:13px;color:var(--muted);margin-top:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:right;width:100%;background:var(--bg);border:1.5px solid var(--rule);border-radius:9px;padding:9px 12px;color:var(--text);line-height:1.6}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--pc)}
.opt.sel{border-color:var(--pc);background:var(--pc-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)} .opt.wrong .k{background:var(--no);color:var(--surface)}
.opt:disabled{cursor:default}
.multi .opt .k{border-radius:5px}
.why{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:15.5px}
.why b.ok{color:var(--ok)} .why b.no{color:var(--no)}
.runner-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i.r{background:var(--ok)} .dots i.w{background:var(--no)} .dots i.c{background:var(--pc)}
.clock{font-variant-numeric:tabular-nums;font-weight:600}
.clock.slow{color:var(--no)}
.score{font-family:"Readex Pro",Tahoma,sans-serif;font-size:54px;font-weight:700;color:var(--pc);line-height:1.2}
select,textarea,input[type=text],input[inputmode]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:8px 10px}
label{display:inline-flex;gap:6px;align-items:center}

/* CBQ */
.clist{list-style:none;padding:0;margin:0}
.clist button{display:flex;gap:14px;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 4px;color:var(--text);align-items:baseline}
.clist .en{font-family:"Readex Pro",Tahoma,sans-serif;font-weight:700;color:var(--pc);min-width:28px}
.clist .et{font-weight:600} .clist .es{font-size:13px;color:var(--muted);display:block}
.clist .st{margin-inline-start:auto;font-size:13px;color:var(--ok);white-space:nowrap}
.cbq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.case{position:sticky;top:80px;background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--pc);border-radius:10px;padding:16px 18px;max-height:calc(100vh - 100px);overflow:auto}
.case .lab{font-size:13px;color:var(--pc);font-weight:700;margin-bottom:6px}
.case p{font-size:16px;margin:0 0 10px}
.task .qt .n{color:var(--pc);font-family:"Readex Pro",Tahoma,sans-serif;margin-inline-end:6px}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:180px;text-align:left;direction:ltr}
.numrow input.right{border-color:var(--ok);background:var(--ok-soft)} .numrow input.wrong{border-color:var(--no);background:var(--no-soft)}

.ai-out{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 18px;margin:12px 0 18px}
.ai-out .lab{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.ai-out h4{font-size:16px;margin:12px 0 6px}
.thinking{color:var(--muted)}
.thinking::after{content:"…";animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}}

#tutorFab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--pc);color:var(--surface);border:0;border-radius:28px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#tutor{position:fixed;left:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:min(420px,calc(100vw - 36px));height:min(620px,calc(100vh - 160px));background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
#tutor[hidden]{display:none}
#tutor .th{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
#tutor .th b{font-family:"Readex Pro",Tahoma,sans-serif;color:var(--pc)}
#tutor .ctx{font-size:12.5px;color:var(--muted)}
#chat{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 13px;border-radius:12px;font-size:15.5px;line-height:1.75}
.msg.u{align-self:flex-start;background:var(--pc);color:var(--surface);border-end-start-radius:4px}
.msg.a{align-self:flex-end;background:var(--sunk);border-end-end-radius:4px}
.msg p{margin:0 0 6px}.msg ul,.msg ol{margin:0 0 6px;padding-inline-start:20px}
.msg table{font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.chips button{background:var(--sunk);border:0;border-radius:14px;padding:4px 10px;font-size:13px;color:var(--ink)}
#tutor form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--rule)}
#tutor form input{flex:1;min-width:0}


/* bilingual */
.lang{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.lang button{border:0;background:none;padding:5px 10px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.bi{display:block}
.bi > .e{display:block}
.bi > .a{display:block;direction:rtl;text-align:right;color:var(--muted);font-size:.92em;margin-top:2px;padding-top:2px;border-top:1px dashed var(--rule)}
th .bi > .a{color:inherit;opacity:.85;border-top-color:rgba(255,255,255,.3)}
[dir="ltr"] .bi > .e, [dir="ltr"]{text-align:left}
[dir="ltr"] ul,[dir="ltr"] ol{padding-inline-start:24px}
[dir="ltr"] th{text-align:left}
[dir="ltr"] .box{border-inline-start:4px solid;border-inline-end:0}
[dir="ltr"] .opt{text-align:left}
[dir="ltr"] .numrow input{text-align:left}
.lesson-title .sub{display:block;font-size:.6em;color:var(--muted);font-weight:600;direction:rtl;text-align:right;margin-top:4px}
.toc .ls .tt{display:flex;flex-direction:column}
.toc .ls .tt small{color:var(--muted);font-size:12.5px}
.glossary{font-size:14px;color:var(--muted)}

@media (max-width:960px){
  .wrap{grid-template-columns:1fr}
  #menuBtn{display:inline-block}
  aside.toc{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);height:auto;z-index:40;transform:translateX(105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
  aside.toc.open{transform:none}
  .bar{flex-wrap:wrap}
  nav.tabs{order:3;width:100%;margin:0}
  .cbq{grid-template-columns:1fr}
  .bp .bph span{display:none}
  .case{position:static;max-height:none}
  .strip{height:auto;flex-wrap:wrap}
  .strip button{flex-basis:30%!important;flex-grow:1;min-height:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-part="1">
<header class="top">
  <div class="bar">
    <button id="menuBtn" aria-controls="toc">الفهرس</button>
    <button class="brand" data-go="home">مذاكرة CMA<small>منهج IMA الحالي + نظام CBQ 2026</small></button>
    <div class="seg" role="group" aria-label="اختار الجزء">
      <button data-part="1" aria-pressed="true">الجزء الأول</button>
      <button data-part="2" aria-pressed="false">الجزء الثاني</button>
    </div>
    <div class="lang" role="group" aria-label="لغة الشرح">
      <button data-lang="en" aria-pressed="false">English</button>
      <button data-lang="both" aria-pressed="true">الاتنين</button>
      <button data-lang="ar" aria-pressed="false">عربي</button>
    </div>
    <nav class="tabs" aria-label="الأقسام">
      <button data-go="home">الرئيسية</button>
      <button data-go="lessons">الدروس</button>
      <button data-go="practice">أسئلة اختيار</button>
      <button data-go="cbq">حالات CBQ</button>
      <button data-go="plan">خطة المذاكرة</button>
    </nav>
  </div>
</header>
<div class="wrap">
  <aside class="toc" id="toc" aria-label="فهرس الدروس"></aside>
  <main id="main" tabindex="-1"></main>
</div>

<button id="tutorFab" class="ai-only" hidden>اسأل المدرس</button>
<section id="tutor" hidden aria-label="المدرس">
  <div class="th"><div><b>مدرس CMA</b><div class="ctx" id="tutorCtx"></div></div><button class="btn" id="tutorClose">قفل</button></div>
  <div id="chat"></div>
  <div class="chips" id="chips"></div>

<script id="data" type="application/json">{"parts":[{"id":1,"title":"الجزء الأول","enT":"Part 1","en":"Financial Planning, Performance, and Analytics","ar":"التخطيط المالي والأداء والتحليلات","domains":[{"code":"1A","title":"قرارات التقرير المالي الخارجي","en":"External Financial Reporting Decisions","weight":15,"lessons":[{"title":"القوائم المالية والفروق بين US GAAP و IFRS","blocks":[["p","الـ CMA مبني على **US GAAP** في الأساس، لكن الامتحان بيسأل عن أهم الفروق مع **IFRS**. المطلوب منك تفهم القوائم الأربعة وإزاي القرار المحاسبي بيأثر عليها، مش تبقى محاسب مالي متخصص."],["t",["القائمة","بتوريك إيه","معادلتها"],[["الميزانية (Balance Sheet)","المركز المالي في لحظة","الأصول = الالتزامات + حقوق الملكية"],["قائمة الدخل (Income Statement)","الأداء خلال فترة","الإيرادات − المصروفات = صافي الدخل"],["قائمة التغير في حقوق الملكية","حركة رأس المال والأرباح المحتجزة","رصيد أول + صافي دخل − توزيعات ± أخرى"],["قائمة التدفقات النقدية","مصادر واستخدامات النقدية","تشغيلي + استثماري + تمويلي = التغير في النقدية"]],[2800,3200,3638]],["h3","أهم الفروق اللي بتتسأل"],["t",["البند","US GAAP","IFRS"],[["طريقة LIFO للمخزون","مسموحة","ممنوعة"],["رد تخفيض المخزون","ممنوع","مسموح في حدود التخفيض الأصلي"],["إعادة تقييم الأصول الثابتة","ممنوعة (تكلفة فقط)","مسموحة (نموذج إعادة التقييم)"],["تكاليف التطوير","مصروف (غالبًا)","تُرسمل لو استوفت الشروط"],["اختبار الاضمحلال","خطوتين: اختبار الاسترداد بالتدفقات غير المخصومة ثم القياس بالقيمة العادلة","خطوة واحدة: القيمة القابلة للاسترداد (الأعلى من القيمة العادلة ناقص تكاليف البيع وقيمة الاستخدام)"],["رد خسارة الاضمحلال","ممنوع للأصول المحتفظ بها للاستخدام","مسموح (عدا الشهرة)"],["الإيجار عند المستأجر","نموذجين: تمويلي وتشغيلي (الاتنين في الميزانية)","نموذج واحد (IFRS 16)"],["الفوائد المدفوعة في التدفقات النقدية","تشغيلي","حسب IFRS 18 للشركة العادية: تمويلي"]],[2600,3500,3538]],["exam","نقطة امتحان",["سؤال الاختيار المتكرر: \"أي معالجة مسموحة في IFRS وممنوعة في US GAAP؟\" الإجابة غالبًا: إعادة التقييم أو رد تخفيض المخزون أو رسملة التطوير. وسؤال العكس: LIFO."]]],"en":{"title":"Financial Statements and US GAAP vs IFRS","blocks":[["p","The CMA exam is based mainly on **US GAAP**, but it also tests the key differences from **IFRS**. You need to understand the four statements and how accounting choices affect them; you are not expected to be a specialist financial accountant."],["t",["Statement","What it shows","Equation"],[["Balance Sheet","Financial position at a point in time","Assets = Liabilities + Equity"],["Income Statement","Performance over a period","Revenues − Expenses = Net Income"],["Statement of Changes in Equity","Movements in capital and retained earnings","Opening + Net income − Dividends ± Other"],["Statement of Cash Flows","Sources and uses of cash","Operating + Investing + Financing = Change in cash"]]],["h3","Key differences that are tested"],["t",["Item","US GAAP","IFRS"],[["LIFO inventory method","Permitted","Prohibited"],["Reversal of inventory write-downs","Prohibited","Permitted up to the original write-down"],["Revaluation of PP&E","Prohibited (cost model only)","Permitted (revaluation model)"],["Development costs","Expensed (generally)","Capitalized if criteria are met"],["Impairment test","Two steps: recoverability test using undiscounted cash flows, then measure at fair value","One step: recoverable amount (higher of fair value less costs to sell and value in use)"],["Reversal of impairment losses","Prohibited for assets held for use","Permitted (except goodwill)"],["Lessee accounting","Two models: finance and operating (both on the balance sheet)","Single model (IFRS 16)"],["Interest paid in the cash flow statement","Operating","Under IFRS 18, financing for a general entity"]]],["exam","Exam point",["A common MCQ: \"Which treatment is allowed under IFRS but not under US GAAP?\" The answer is usually revaluation, reversal of inventory write-downs, or capitalizing development costs. The reverse question points to LIFO."]]]}},{"title":"الاعتراف والقياس: الذمم، المخزون، الاستثمارات","blocks":[["h3","الذمم المدينة (Receivables)"],["b","**طريقة المخصص (Allowance method)** هي المقبولة: نقدّر الديون المشكوك فيها في نفس فترة البيع (مبدأ المقابلة). طريقة الشطب المباشر مش مقبولة إلا لو الأثر غير جوهري."],["b","**CECL (ASC 326):** الخسائر الائتمانية المتوقعة على مدى العمر للذمم والقروض بالتكلفة المستهلكة."],["b","**التخصيم (Factoring):** بيع الذمم. لو بدون حق رجوع (without recourse) يبقى بيع، ولو بحق رجوع ممكن يبقى بيع أو قرض حسب انتقال السيطرة."],["h3","المخزون (Inventory)"],["b","القياس في US GAAP: **FIFO أو المتوسط** ← الأقل من التكلفة وصافي القيمة البيعية (LCNRV). **LIFO أو التجزئة** ← الأقل من التكلفة والسوق (LCM)، والسوق = تكلفة الإحلال في حدود سقف (NRV) وأرضية (NRV − هامش ربح عادي)."],["ex","مثال: طرق تسعير المخزون (نظام جرد دوري)",["أول المدة 100 وحدة × 10 | شراء 200 × 12 | شراء 100 × 15 | المباع 250 وحدة.","**FIFO:** تكلفة المبيعات = 100×10 + 150×12 = **2,800** | آخر المدة = 50×12 + 100×15 = **2,100**.","**LIFO:** تكلفة المبيعات = 100×15 + 150×12 = **3,300** | آخر المدة = 100×10 + 50×12 = **1,600**.","**المتوسط المرجح:** 4,900 ÷ 400 = 12.25 ← تكلفة المبيعات **3,062.5** | آخر المدة **1,837.5**.","في فترة ارتفاع الأسعار: LIFO بيدي أعلى تكلفة مبيعات وأقل ربح وأقل ضريبة، وأقل قيمة مخزون في الميزانية."]],["h3","الاستثمارات (Investments)"],["t",["النوع","القياس","أرباح وخسائر غير المحققة"],[["سندات محتفظ بها حتى الاستحقاق (HTM)","التكلفة المستهلكة","لا تُعترف"],["سندات متاحة للبيع (AFS)","القيمة العادلة","الدخل الشامل الآخر (OCI)"],["سندات للمتاجرة (Trading)","القيمة العادلة","صافي الدخل"],["أسهم بدون نفوذ مؤثر (أقل من 20%)","القيمة العادلة","صافي الدخل"],["أسهم بنفوذ مؤثر (20–50%)","طريقة حقوق الملكية","نصيبك من ربح الشركة يزود الاستثمار، والتوزيعات تقلله"],["سيطرة (أكثر من 50%)","تجميع القوائم","—"]],[3400,2700,3538]]],"en":{"title":"Recognition and Measurement: Receivables, Inventory, Investments","blocks":[["h3","Receivables"],["b","**The allowance method** is required: estimate uncollectible accounts in the same period as the sale (matching principle). The direct write-off method is acceptable only if the effect is immaterial."],["b","**CECL (ASC 326):** lifetime expected credit losses on receivables and loans carried at amortized cost."],["b","**Factoring:** selling receivables. Without recourse it is a sale; with recourse it may be a sale or a secured borrowing depending on whether control transfers."],["h3","Inventory"],["b","US GAAP measurement: **FIFO or average cost** → lower of cost and net realizable value (LCNRV). **LIFO or retail** → lower of cost or market (LCM), where market = replacement cost, bounded by a ceiling (NRV) and a floor (NRV − normal profit margin)."],["ex","Example: inventory cost flow methods (periodic system)",["Beginning 100 units × 10 | Purchase 200 × 12 | Purchase 100 × 15 | Units sold 250.","**FIFO:** COGS = 100×10 + 150×12 = **2,800** | Ending inventory = 50×12 + 100×15 = **2,100**.","**LIFO:** COGS = 100×15 + 150×12 = **3,300** | Ending inventory = 100×10 + 50×12 = **1,600**.","**Weighted average:** 4,900 ÷ 400 = 12.25 → COGS **3,062.5** | Ending inventory **1,837.5**.","When prices are rising, LIFO gives the highest COGS, lowest profit, lowest tax, and lowest inventory value on the balance sheet."]],["h3","Investments"],["t",["Type","Measurement","Unrealized gains and losses"],[["Held-to-maturity debt (HTM)","Amortized cost","Not recognized"],["Available-for-sale debt (AFS)","Fair value","Other comprehensive income (OCI)"],["Trading debt securities","Fair value","Net income"],["Equity without significant influence (<20%)","Fair value","Net income"],["Equity with significant influence (20–50%)","Equity method","Your share of investee income increases the investment; dividends reduce it"],["Control (>50%)","Consolidation","—"]]]]}},{"title":"الأصول الثابتة والإهلاك والأصول غير الملموسة","blocks":[["b","التكلفة = كل اللي اتصرف علشان الأصل يبقى جاهز للاستخدام (سعر + شحن + تركيب + اختبار). الفوائد على إنشاء أصل ذاتي تُرسمل."],["b","المصروفات اللاحقة: لو بتطول العمر أو بتزود الطاقة ← تُرسمل. صيانة عادية ← مصروف."],["ex","مثال: طرق الإهلاك",["أصل تكلفته 100,000، قيمة تخريدية 10,000، عمر 5 سنين.","**القسط الثابت:** (100,000 − 10,000) ÷ 5 = **18,000** سنويًا.","**القسط المتناقص المضاعف (DDB):** المعدل = 2 ÷ 5 = 40% على القيمة الدفترية بدون طرح التخريد: سنة 1 = **40,000**، سنة 2 = 60,000 × 40% = **24,000**، سنة 3 = 14,400، وتقف لما توصل للتخريد.","**مجموع أرقام السنين (SYD):** المجموع = 15. سنة 1 = 90,000 × 5/15 = **30,000**، سنة 2 = 90,000 × 4/15 = **24,000**.","**وحدات الإنتاج:** لو الطاقة الكلية 45,000 وحدة وأنتج 9,000 ← 90,000 × 9,000/45,000 = **18,000**."]],["h3","الأصول غير الملموسة والشهرة"],["b","عمر محدد ← استهلاك. عمر غير محدد (زي الشهرة والعلامات المسجلة القابلة للتجديد) ← لا استهلاك، اختبار اضمحلال سنوي."],["b","البحث والتطوير في US GAAP: مصروف، مع استثناء برامج الكمبيوتر بعد ثبوت الجدوى الفنية."],["b","الشهرة = ثمن الاستحواذ (+ القيمة العادلة لحقوق غير المسيطرين) − القيمة العادلة لصافي الأصول المقتناة."]],"en":{"title":"PP&E, Depreciation, and Intangibles","blocks":[["b","Cost = everything spent to get the asset ready for its intended use (price + freight + installation + testing). Interest on self-constructed assets is capitalized."],["b","Subsequent costs: if they extend useful life or increase capacity → capitalize. Ordinary maintenance → expense."],["ex","Example: depreciation methods",["Asset cost 100,000, salvage value 10,000, useful life 5 years.","**Straight-line:** (100,000 − 10,000) ÷ 5 = **18,000** per year.","**Double-declining balance (DDB):** rate = 2 ÷ 5 = 40% of book value, ignoring salvage: Year 1 = **40,000**, Year 2 = 60,000 × 40% = **24,000**, Year 3 = 14,400, and it stops at salvage value.","**Sum-of-the-years’-digits (SYD):** sum = 15. Year 1 = 90,000 × 5/15 = **30,000**, Year 2 = 90,000 × 4/15 = **24,000**.","**Units of production:** if total capacity is 45,000 units and 9,000 are produced → 90,000 × 9,000/45,000 = **18,000**."]],["h3","Intangible assets and goodwill"],["b","Finite life → amortize. Indefinite life (such as goodwill and renewable trademarks) → no amortization; test for impairment annually."],["b","R&D under US GAAP: expensed, except software costs after technological feasibility is established."],["b","Goodwill = consideration paid (+ fair value of noncontrolling interest) − fair value of net identifiable assets acquired."]]}},{"title":"الإيراد والإيجار والضرائب المؤجلة","blocks":[["h3","الإيراد (ASC 606) - الخمس خطوات"],["n","تحديد العقد مع العميل."],["n","تحديد التزامات الأداء المنفصلة."],["n","تحديد سعر المعاملة (شاملًا العوض المتغير بحدود)."],["n","توزيع السعر على الالتزامات حسب أسعار البيع المنفردة."],["n","الاعتراف بالإيراد عند (أو على مدار) الوفاء بكل التزام."],["ex","مثال توزيع",["عقد بـ 1,200 فيه جهاز (سعره المنفرد 1,000) وصيانة سنة (سعرها المنفرد 500).","الجهاز: 1,200 × 1,000/1,500 = **800** يُعترف عند التسليم. الصيانة: **400** تُعترف على مدار السنة (33.3 شهريًا)."]],["h3","الإيجار عند المستأجر (ASC 842)"],["b","الاتنين (التمويلي والتشغيلي) بيظهروا في الميزانية: **أصل حق استخدام** و**التزام إيجار** = القيمة الحالية للدفعات."],["b","التمويلي: مصروف فائدة + مصروف استهلاك منفصلين (المصروف أعلى في الأول). التشغيلي: مصروف إيجار واحد بالقسط الثابت."],["b","معايير التمويلي (لو واحد منها اتحقق): نقل الملكية، خيار شراء مؤكد، مدة الإيجار جزء كبير من العمر (75% كدليل عملي)، القيمة الحالية للدفعات تقريبًا كل القيمة العادلة (90%)، أصل متخصص."],["h3","الضرائب المؤجلة"],["b","الفرق المؤقت بين القيمة الدفترية والأساس الضريبي بيولد أصل أو التزام ضريبي مؤجل."],["b","**التزام مؤجل:** الضريبة في المستقبل هتبقى أعلى، زي إهلاك ضريبي معجل. **أصل مؤجل:** الضريبة في المستقبل أقل، زي مخصص ضمان أو خسائر مرحلة."],["b","الفروق الدائمة (زي غرامات غير قابلة للخصم أو فوائد سندات حكومية معفاة) مالهاش ضرائب مؤجلة."],["ex","مثال",["إهلاك محاسبي 20,000 وإهلاك ضريبي 35,000 في السنة الأولى، ومعدل الضريبة 25%.","الفرق المؤقت 15,000 ← **التزام ضريبي مؤجل 3,750**."]]],"en":{"title":"Revenue, Leases, and Deferred Taxes","blocks":[["h3","Revenue (ASC 606): the five steps"],["n","Identify the contract with the customer."],["n","Identify the separate performance obligations."],["n","Determine the transaction price (including constrained variable consideration)."],["n","Allocate the price to the obligations based on standalone selling prices."],["n","Recognize revenue when (or as) each obligation is satisfied."],["ex","Allocation example",["A 1,200 contract includes equipment (standalone price 1,000) and one year of maintenance (standalone price 500).","Equipment: 1,200 × 1,000/1,500 = **800**, recognized on delivery. Maintenance: **400**, recognized over the year (33.3 per month)."]],["h3","Lessee accounting (ASC 842)"],["b","Both finance and operating leases go on the balance sheet: a **right-of-use asset** and a **lease liability** = present value of lease payments."],["b","Finance lease: separate interest expense and amortization expense (front-loaded). Operating lease: a single straight-line lease cost."],["b","Finance lease criteria (any one): transfer of ownership, purchase option reasonably certain to be exercised, lease term is a major part of economic life (75% as a guideline), PV of payments is substantially all of fair value (90%), specialized asset."],["h3","Deferred taxes"],["b","A temporary difference between book value and tax basis creates a deferred tax asset or liability."],["b","**Deferred tax liability:** future taxes will be higher, e.g., accelerated tax depreciation. **Deferred tax asset:** future taxes will be lower, e.g., warranty accruals or loss carryforwards."],["b","Permanent differences (such as nondeductible fines or tax-exempt municipal bond interest) create no deferred taxes."],["ex","Example",["Book depreciation 20,000 and tax depreciation 35,000 in year 1; tax rate 25%.","Temporary difference 15,000 → **deferred tax liability 3,750**."]]]}},{"title":"التقرير المتكامل وتقارير الاستدامة","blocks":[["p","الجزء ده اتضاف للمنهج علشان دور المحاسب الإداري بقى يشمل المعلومات غير المالية."],["b","**التقرير المتكامل <IR>:** بيوضح إزاي المنشأة بتخلق قيمة على المدى القصير والمتوسط والطويل باستخدام **ستة رؤوس أموال**: مالي، صناعي، فكري، بشري، اجتماعي وعلاقات، طبيعي."],["b","**مبادئه:** التركيز الاستراتيجي، ترابط المعلومات، علاقات أصحاب المصلحة، الأهمية النسبية، الإيجاز، الموثوقية والاكتمال، الثبات والقابلية للمقارنة."],["b","**معايير ISSB:** المعيار S1 للمتطلبات العامة لإفصاحات الاستدامة، والمعيار S2 للمناخ. الهيكل: الحوكمة، الاستراتيجية، إدارة المخاطر، المقاييس والأهداف. (معايير SASB الخاصة بكل صناعة بقت جزء من منظومة ISSB.)"],["b","**مزايا:** قرارات أفضل، ثقة المستثمرين، ربط الاستدامة بالاستراتيجية. **تحديات:** التكلفة، صعوبة القياس، غياب التأكيد المستقل أحيانًا، مخاطر التضليل البيئي (Greenwashing)."]],"en":{"title":"Integrated Reporting and Sustainability Reporting","blocks":[["p","This topic was added because the management accountant’s role now includes non-financial information."],["b","**Integrated Reporting <IR>:** explains how an organization creates value over the short, medium, and long term using **six capitals**: financial, manufactured, intellectual, human, social and relationship, and natural."],["b","**Guiding principles:** strategic focus, connectivity of information, stakeholder relationships, materiality, conciseness, reliability and completeness, consistency and comparability."],["b","**ISSB standards:** S1 for general requirements for sustainability-related disclosures, and S2 for climate. Structure: governance, strategy, risk management, metrics and targets. (SASB industry standards are now part of the ISSB framework.)"],["b","**Benefits:** better decisions, investor confidence, linking sustainability to strategy. **Challenges:** cost, measurement difficulty, sometimes no independent assurance, and greenwashing risk."]]}}],"mcqs":[{"q":"أي من التالي مسموح في US GAAP وممنوع في IFRS؟","opts":["إعادة تقييم الأصول الثابتة","رد تخفيض المخزون","طريقة LIFO","رسملة تكاليف التطوير"],"ans":2,"why":"LIFO ممنوعة في IFRS. باقي الاختيارات مسموحة في IFRS وممنوعة أو مقيدة في US GAAP.","en":{"q":"Which of the following is permitted under US GAAP but prohibited under IFRS?","opts":["Revaluation of PP&E","Reversal of inventory write-downs","LIFO","Capitalizing development costs"],"why":"LIFO is prohibited under IFRS. The other choices are allowed under IFRS and prohibited or restricted under US GAAP."}},{"q":"في فترة ارتفاع الأسعار، أي طريقة مخزون تعطي أعلى صافي دخل؟","opts":["LIFO","FIFO","المتوسط المرجح","كلهم نفس النتيجة"],"ans":1,"why":"FIFO بيحمّل تكلفة المبيعات بالأسعار القديمة الأرخص، فالربح أعلى (والضريبة أعلى).","en":{"q":"In a period of rising prices, which inventory method gives the highest net income?","opts":["LIFO","FIFO","Weighted average","All give the same result"],"why":"FIFO charges COGS at older, cheaper costs, so profit (and tax) is higher."}},{"q":"أصل تكلفته 50,000 وتخريده 5,000 وعمره 5 سنين. كم إهلاك السنة الثانية بطريقة القسط المتناقص المضاعف؟","opts":["18,000","12,000","10,800","20,000"],"ans":1,"why":"المعدل 40%. سنة 1 = 20,000، القيمة الدفترية 30,000. سنة 2 = 30,000 × 40% = 12,000.","en":{"q":"An asset costs 50,000, salvage value 5,000, life 5 years. What is year-2 depreciation under double-declining balance?","opts":["18,000","12,000","10,800","20,000"],"why":"Rate 40%. Year 1 = 20,000, book value 30,000. Year 2 = 30,000 × 40% = 12,000."}},{"q":"أرباح غير محققة على سندات مصنفة متاحة للبيع (AFS) تظهر في:","opts":["صافي الدخل","الدخل الشامل الآخر","لا تُعترف","الأرباح المحتجزة مباشرة"],"ans":1,"why":"AFS بالقيمة العادلة والتغير في OCI.","en":{"q":"Unrealized gains on available-for-sale (AFS) debt securities are reported in:","opts":["Net income","Other comprehensive income","Not recognized","Retained earnings directly"],"why":"AFS is measured at fair value with changes in OCI."}},{"q":"إهلاك ضريبي معجل أكبر من الإهلاك المحاسبي يؤدي إلى:","opts":["أصل ضريبي مؤجل","التزام ضريبي مؤجل","فرق دائم","لا أثر"],"ans":1,"why":"الربح الضريبي أقل دلوقتي وهيبقى أعلى بعدين، يعني ضريبة مؤجلة مستحقة (التزام).","en":{"q":"Accelerated tax depreciation that exceeds book depreciation results in:","opts":["A deferred tax asset","A deferred tax liability","A permanent difference","No effect"],"why":"Taxable income is lower now and will be higher later, so a deferred tax liability arises."}},{"q":"عقد بـ 900 يشمل جهاز (سعر منفرد 800) وتدريب (سعر منفرد 200). كم الإيراد المخصص للتدريب؟","opts":["200","180","100","225"],"ans":1,"why":"900 × 200/1,000 = 180.","en":{"q":"A 900 contract includes equipment (standalone price 800) and training (standalone price 200). How much revenue is allocated to training?","opts":["200","180","100","225"],"why":"900 × 200/1,000 = 180."}},{"q":"أي مما يلي ليس من رؤوس الأموال الستة في التقرير المتكامل؟","opts":["الفكري","الطبيعي","السوقي","الاجتماعي والعلاقات"],"ans":2,"why":"الستة: مالي، صناعي، فكري، بشري، اجتماعي وعلاقات، طبيعي.","en":{"q":"Which of the following is NOT one of the six capitals in Integrated Reporting?","opts":["Intellectual","Natural","Market","Social and relationship"],"why":"The six are financial, manufactured, intellectual, human, social and relationship, and natural."}},{"q":"في US GAAP، الاستثمار بنسبة 30% مع نفوذ مؤثر يُحاسب بطريقة:","opts":["القيمة العادلة","التكلفة","حقوق الملكية","التجميع"],"ans":2,"why":"نفوذ مؤثر (عادة 20–50%) يعني طريقة حقوق الملكية.","en":{"q":"Under US GAAP, a 30% investment with significant influence is accounted for using:","opts":["Fair value","Cost","The equity method","Consolidation"],"why":"Significant influence (usually 20–50%) means the equity method."}}]},{"code":"1B","title":"التخطيط والموازنات والتنبؤ","en":"Planning, Budgeting, and Forecasting","weight":20,"lessons":[{"title":"التخطيط الاستراتيجي","blocks":[["p","الموازنة مش رقم بيتعمل لوحده، هي ترجمة الخطة الاستراتيجية لأرقام سنوية. التسلسل: **الرسالة والرؤية ← الأهداف الاستراتيجية ← الخطة طويلة الأجل ← الموازنة السنوية ← المتابعة**."],["t",["الأداة","الاستخدام"],[["SWOT","نقاط القوة والضعف (داخلي) والفرص والتهديدات (خارجي)."],["PEST/PESTEL","تحليل البيئة الكلية: سياسي، اقتصادي، اجتماعي، تكنولوجي، بيئي، قانوني."],["قوى بورتر الخمس","شدة المنافسة، تهديد الداخلين الجدد، تهديد البدائل، قوة الموردين، قوة العملاء."],["خطط الطوارئ (Contingency)","سيناريوهات بديلة لو افتراض أساسي اتغير."],["تحليل السيناريو","متفائل، متوقع، متشائم."]],[2600,7038]],["b","**استراتيجيات بورتر العامة:** قيادة التكلفة، التميز، التركيز."],["b","**خصائص الموازنة الجيدة:** مرتبطة بالاستراتيجية، مشاركة المديرين (Participative) مع الحذر من **الحشو (Budgetary slack)**، أهداف صعبة لكن قابلة للتحقيق، دعم الإدارة العليا."]],"en":{"title":"Strategic Planning","blocks":[["p","A budget is not a number in isolation; it translates the strategic plan into annual figures. The sequence: **mission and vision → strategic goals → long-term plan → annual budget → monitoring**."],["t",["Tool","Use"],[["SWOT","Strengths and weaknesses (internal), opportunities and threats (external)."],["PEST/PESTEL","Macro-environment analysis: political, economic, social, technological, environmental, legal."],["Porter’s Five Forces","Competitive rivalry, threat of new entrants, threat of substitutes, supplier power, buyer power."],["Contingency planning","Alternative plans if a key assumption changes."],["Scenario analysis","Optimistic, expected, pessimistic."]]],["b","**Porter’s generic strategies:** cost leadership, differentiation, focus."],["b","**Characteristics of a good budget:** linked to strategy, participative with managers (watch for **budgetary slack**), challenging but achievable targets, top management support."]]}},{"title":"أساليب التنبؤ","blocks":[["h3","طريقة الحد الأعلى والأدنى (High-Low)"],["ex","مثال",["تكلفة 50,000 عند 10,000 وحدة، و 62,000 عند 14,000 وحدة.","التكلفة المتغيرة للوحدة = (62,000 − 50,000) ÷ (14,000 − 10,000) = **3**.","التكلفة الثابتة = 50,000 − 10,000 × 3 = **20,000**. المعادلة: Y = 20,000 + 3X."]],["h3","تحليل الانحدار (Regression)"],["b","المعادلة: **y = a + bx**. الـ a هو الجزء الثابت والـ b ميل الخط (التغير في y لكل وحدة من x)."],["b","**معامل التحديد R²:** نسبة التغير في المتغير التابع اللي بيفسرها المتغير المستقل (من 0 لـ 1). مثلًا 0.85 يعني 85% من تغير التكلفة يفسره حجم الإنتاج."],["b","**معامل الارتباط r:** من −1 لـ +1 ويقيس قوة واتجاه العلاقة الخطية. الارتباط مش معناه سببية."],["b","**الخطأ المعياري للتقدير:** كل ما قل كان التنبؤ أدق. **t-value** أكبر من 2 تقريبًا يعني المتغير مهم إحصائيًا."],["h3","منحنى التعلم (Learning curve)"],["ex","مثال: نموذج متوسط الوقت التراكمي 80%",["أول وحدة أخذت 100 ساعة. كل ما الإنتاج التراكمي يتضاعف، **المتوسط** ينزل لـ 80%.","2 وحدة: متوسط 80 ← إجمالي 160. 4 وحدات: متوسط 64 ← إجمالي 256. 8 وحدات: متوسط 51.2 ← إجمالي 409.6.","الوقت الإضافي للوحدات من 5 لـ 8 = 409.6 − 256 = **153.6 ساعة**.","في **نموذج الوقت الحدي (Incremental unit-time)**: وقت **الوحدة الأخيرة** هو اللي بينزل 80%، فالوحدة الثانية = 80 ساعة، والوحدة الرابعة = 64 ساعة."]],["h3","القيمة المتوقعة"],["ex","مثال",["المبيعات المتوقعة: 100,000 باحتمال 30%، 150,000 باحتمال 50%، 200,000 باحتمال 20%.","القيمة المتوقعة = 30,000 + 75,000 + 40,000 = **145,000**."]]],"en":{"title":"Forecasting Techniques","blocks":[["h3","High-low method"],["ex","Example",["Cost is 50,000 at 10,000 units and 62,000 at 14,000 units.","Variable cost per unit = (62,000 − 50,000) ÷ (14,000 − 10,000) = **3**.","Fixed cost = 50,000 − 10,000 × 3 = **20,000**. Equation: Y = 20,000 + 3X."]],["h3","Regression analysis"],["b","Equation: **y = a + bx**. a is the fixed (intercept) component and b is the slope (change in y per unit of x)."],["b","**Coefficient of determination R²:** the proportion of variation in the dependent variable explained by the independent variable (0 to 1). For example, 0.85 means 85% of the change in cost is explained by production volume."],["b","**Correlation coefficient r:** from −1 to +1; measures the strength and direction of a linear relationship. Correlation does not imply causation."],["b","**Standard error of the estimate:** the smaller it is, the more accurate the forecast. A **t-value** above about 2 means the variable is statistically significant."],["h3","Learning curve"],["ex","Example: 80% cumulative average-time model",["The first unit took 100 hours. Each time cumulative output doubles, the **average** time falls to 80%.","2 units: average 80 → total 160. 4 units: average 64 → total 256. 8 units: average 51.2 → total 409.6.","Incremental time for units 5 to 8 = 409.6 − 256 = **153.6 hours**.","Under the **incremental unit-time model**, the time for the **last unit** falls to 80%, so unit 2 = 80 hours and unit 4 = 64 hours."]],["h3","Expected value"],["ex","Example",["Expected sales: 100,000 with probability 30%, 150,000 with 50%, 200,000 with 20%.","Expected value = 30,000 + 75,000 + 40,000 = **145,000**."]]]}},{"title":"أنواع الموازنات ومنهجياتها","blocks":[["t",["النوع","الفكرة","متى يُستخدم / عيوبه"],[["الموازنة الثابتة (Static)","لمستوى نشاط واحد.","سيئة لتقييم الأداء لو النشاط اتغير."],["المرنة (Flexible)","تُعاد صياغتها حسب النشاط الفعلي.","الأفضل لتقييم الأداء."],["الصفرية (Zero-based)","كل بند يتبرر من الصفر.","بتقضي على الهدر لكنها مكلفة ومستهلكة للوقت."],["التزايدية (Incremental)","السنة اللي فاتت + نسبة.","سهلة، لكنها بتورث عدم الكفاءة."],["المستمرة/المتجددة (Rolling)","كل ما يخلص شهر يتضاف شهر جديد.","دايمًا فيه 12 شهر قدام."],["على أساس الأنشطة (ABB)","تبدأ من الأنشطة ومسبباتها.","أدق في تحديد الموارد المطلوبة."],["كايزن (Kaizen)","تفترض تحسين مستمر وتخفيض تكاليف.","مناسبة للشركات اللي بتطبق التحسين المستمر."],["دورة حياة المنتج","تغطي كل عمر المنتج من البحث للخروج.","تكشف إن معظم التكلفة بتتحدد في التصميم."],["المشروعات","لمشروع محدد بغض النظر عن السنة.","زي إنشاء مصنع."]],[2500,3500,3638]]],"en":{"title":"Budget Types and Methodologies","blocks":[["t",["Type","Idea","When used / drawbacks"],[["Static budget","Prepared for a single activity level.","Poor for performance evaluation if activity changes."],["Flexible budget","Restated for the actual activity level.","Best for performance evaluation."],["Zero-based budget","Every item is justified from zero.","Eliminates waste but is costly and time-consuming."],["Incremental budget","Last year + a percentage.","Easy, but carries forward inefficiencies."],["Continuous/rolling budget","Each month that ends is replaced by a new month.","Always 12 months ahead."],["Activity-based budget (ABB)","Starts from activities and their drivers.","More accurate identification of required resources."],["Kaizen budget","Assumes continuous improvement and cost reduction.","Suits companies practicing continuous improvement."],["Life-cycle budget","Covers the product’s entire life from R&D to exit.","Shows that most costs are locked in at design."],["Project budget","For a specific project regardless of fiscal year.","E.g., building a plant."]]]]}},{"title":"الموازنة الشاملة (Master budget) خطوة بخطوة","blocks":[["p","الترتيب ده مهم جدًا للامتحان: **موازنة المبيعات** هي نقطة البداية دايمًا، وبعدها:"],["n","المبيعات ← الإنتاج ← المواد المباشرة + العمالة المباشرة + التكاليف الصناعية غير المباشرة ← تكلفة المبيعات ← المصروفات البيعية والإدارية ← (الموازنة التشغيلية)."],["n","الموازنة الرأسمالية + الموازنة النقدية ← القوائم التقديرية (Pro forma) ← (الموازنة المالية)."],["ex","مثال: موازنة الإنتاج والمشتريات",["المبيعات المتوقعة 10,000 وحدة. مخزون تام آخر المدة المطلوب 2,000 وأول المدة 1,500.","**الإنتاج** = 10,000 + 2,000 − 1,500 = **10,500 وحدة**.","كل وحدة محتاجة 3 كجم مواد. مخزون مواد آخر المدة المطلوب 4,000 كجم وأول المدة 3,500.","**المواد المطلوبة للإنتاج** = 31,500 كجم ← **المشتريات** = 31,500 + 4,000 − 3,500 = **32,000 كجم**."]],["ex","مثال: المتحصلات النقدية",["المبيعات الآجلة: يناير 100,000، فبراير 120,000. التحصيل: 60% في نفس الشهر، 38% الشهر التالي، 2% ديون معدومة.","متحصلات فبراير = 120,000 × 60% + 100,000 × 38% = 72,000 + 38,000 = **110,000**."]],["exam","نقطة امتحان",["الإهلاك مش تدفق نقدي، فمش بيظهر في الموازنة النقدية. وموازنة الإنتاج بالوحدات مش بالفلوس. أسئلة الموازنة النقدية من أكثر الأسئلة الحسابية تكرارًا."]]],"en":{"title":"The Master Budget Step by Step","blocks":[["p","This order matters for the exam: the **sales budget** is always the starting point, followed by:"],["n","Sales → production → direct materials + direct labor + manufacturing overhead → cost of goods sold → selling and administrative expenses → (operating budget)."],["n","Capital budget + cash budget → pro forma statements → (financial budget)."],["ex","Example: production and purchases budgets",["Expected sales 10,000 units. Desired ending finished goods 2,000; beginning 1,500.","**Production** = 10,000 + 2,000 − 1,500 = **10,500 units**.","Each unit needs 3 kg of material. Desired ending materials 4,000 kg; beginning 3,500 kg.","**Materials needed for production** = 31,500 kg → **Purchases** = 31,500 + 4,000 − 3,500 = **32,000 kg**."]],["ex","Example: cash collections",["Credit sales: January 100,000, February 120,000. Collections: 60% in the month of sale, 38% the following month, 2% uncollectible.","February collections = 120,000 × 60% + 100,000 × 38% = 72,000 + 38,000 = **110,000**."]],["exam","Exam point",["Depreciation is not a cash flow, so it does not appear in the cash budget. The production budget is in units, not dollars. Cash budget questions are among the most frequently tested calculations."]]]}}],"mcqs":[{"q":"نقطة البداية لإعداد الموازنة الشاملة هي:","opts":["موازنة الإنتاج","موازنة المبيعات","الموازنة النقدية","الموازنة الرأسمالية"],"ans":1,"why":"كل الموازنات التشغيلية مبنية على حجم المبيعات المتوقع.","en":{"q":"The starting point for preparing the master budget is the:","opts":["Production budget","Sales budget","Cash budget","Capital budget"],"why":"All operating budgets are built on expected sales volume."}},{"q":"مبيعات متوقعة 20,000 وحدة، مخزون أول المدة 3,000 ومطلوب آخر المدة 4,500. كم وحدة يجب إنتاجها؟","opts":["18,500","21,500","20,000","23,000"],"ans":1,"why":"20,000 + 4,500 − 3,000 = 21,500.","en":{"q":"Expected sales 20,000 units, beginning inventory 3,000, desired ending inventory 4,500. How many units must be produced?","opts":["18,500","21,500","20,000","23,000"],"why":"20,000 + 4,500 − 3,000 = 21,500."}},{"q":"التكلفة 30,000 عند 5,000 ساعة و 42,000 عند 8,000 ساعة. ما التكلفة الثابتة بطريقة الحد الأعلى والأدنى؟","opts":["10,000","12,000","14,000","4,000"],"ans":0,"why":"المتغيرة = 12,000 ÷ 3,000 = 4 للساعة. الثابتة = 30,000 − 5,000 × 4 = 10,000.","en":{"q":"Cost is 30,000 at 5,000 hours and 42,000 at 8,000 hours. What is fixed cost using the high-low method?","opts":["10,000","12,000","14,000","4,000"],"why":"Variable = 12,000 ÷ 3,000 = 4 per hour. Fixed = 30,000 − 5,000 × 4 = 10,000."}},{"q":"معامل التحديد R² = 0.64 يعني:","opts":["الارتباط 0.64","64% من التغير في المتغير التابع يفسره المتغير المستقل","الميل 0.64","التنبؤ صحيح بنسبة 64%"],"ans":1,"why":"R² نسبة التباين المفسَّر. معامل الارتباط في الحالة دي 0.8.","en":{"q":"A coefficient of determination R² of 0.64 means:","opts":["The correlation is 0.64","64% of the variation in the dependent variable is explained by the independent variable","The slope is 0.64","The forecast is 64% accurate"],"why":"R² is the proportion of variance explained. The correlation coefficient here is 0.8."}},{"q":"منحنى تعلم 90% (متوسط تراكمي)، أول وحدة 200 ساعة. كم إجمالي ساعات أول 4 وحدات؟","opts":["648","720","800","729"],"ans":0,"why":"متوسط 2 = 180، متوسط 4 = 162 ← الإجمالي 4 × 162 = 648.","en":{"q":"A 90% learning curve (cumulative average), first unit 200 hours. Total hours for the first 4 units?","opts":["648","720","800","729"],"why":"Average for 2 = 180, average for 4 = 162 → total 4 × 162 = 648."}},{"q":"أي نوع موازنة يجبر كل مدير يبرر كل مصروف من الصفر؟","opts":["التزايدية","المرنة","الصفرية","المتجددة"],"ans":2,"why":"Zero-based budgeting.","en":{"q":"Which budget requires every manager to justify each expense from zero?","opts":["Incremental","Flexible","Zero-based","Rolling"],"why":"Zero-based budgeting."}},{"q":"تحديد الحشو في الموازنة (Budgetary slack) يعني:","opts":["تقدير الإيرادات أعلى والمصروفات أقل","تقدير الإيرادات أقل أو المصروفات أعلى علشان الهدف يبقى سهل","خطأ حسابي","موازنة لمستويات نشاط متعددة"],"ans":1,"why":"المديرين بيعملوا كده في الموازنة التشاركية علشان يضمنوا تحقيق الهدف.","en":{"q":"Budgetary slack means:","opts":["Overestimating revenue and underestimating expenses","Underestimating revenue or overestimating expenses to make the target easier","A calculation error","A budget for multiple activity levels"],"why":"Managers do this in participative budgeting to make sure they meet the target."}},{"q":"مبيعات مارس 200,000 وأبريل 250,000، التحصيل 70% في نفس الشهر و 30% الشهر التالي. متحصلات أبريل؟","opts":["235,000","250,000","175,000","215,000"],"ans":0,"why":"250,000 × 70% + 200,000 × 30% = 175,000 + 60,000 = 235,000.","en":{"q":"March sales 200,000 and April 250,000; 70% collected in the month of sale and 30% the following month. April collections?","opts":["235,000","250,000","175,000","215,000"],"why":"250,000 × 70% + 200,000 × 30% = 175,000 + 60,000 = 235,000."}}]},{"code":"1C","title":"إدارة الأداء","en":"Performance Management","weight":20,"lessons":[{"title":"الموازنة المرنة وتحليل الانحرافات","blocks":[["p","الفكرة: نقارن الفعلي بموازنة **مرنة** معدلة على حجم النشاط الفعلي، علشان نفصل أثر الحجم عن أثر الكفاءة والسعر."],["t",["الانحراف","المعادلة"],[["انحراف الموازنة الثابتة","الفعلي − الموازنة الثابتة = انحراف الموازنة المرنة + انحراف حجم المبيعات"],["انحراف حجم المبيعات","(الكمية الفعلية − المخططة) × هامش المساهمة المعياري للوحدة"],["انحراف سعر المواد","(السعر الفعلي − المعياري) × الكمية الفعلية **المشتراة**"],["انحراف كمية المواد","(الكمية الفعلية المستخدمة − المعيارية للإنتاج الفعلي) × السعر المعياري"],["انحراف معدل الأجور","(المعدل الفعلي − المعياري) × الساعات الفعلية"],["انحراف كفاءة الأجور","(الساعات الفعلية − المعيارية للإنتاج الفعلي) × المعدل المعياري"],["انحراف إنفاق غ.م.ص المتغيرة","الفعلي − (الساعات الفعلية × المعدل المعياري)"],["انحراف كفاءة غ.م.ص المتغيرة","(الساعات الفعلية − المعيارية) × المعدل المعياري"],["انحراف إنفاق غ.م.ص الثابتة","الفعلي − المخطط"],["انحراف حجم غ.م.ص الثابتة","المخطط − المحمّل (الساعات المعيارية × المعدل المعياري)"]],[3300,6338]],["ex","مثال: المواد والأجور",["المعيار: 2 كجم × 5 للوحدة، و 1.5 ساعة × 20 للوحدة. الإنتاج الفعلي 1,000 وحدة.","تم شراء 2,500 كجم بسعر 4.80، واستخدام 2,100 كجم. الساعات الفعلية 1,450 بمعدل 21.","**سعر المواد** = 2,500 × (4.80 − 5) = **500 ملائم (F)**.","**كمية المواد** = (2,100 − 2,000) × 5 = **500 غير ملائم (U)**.","**معدل الأجور** = 1,450 × (21 − 20) = **1,450 U**.","**كفاءة الأجور** = (1,450 − 1,500) × 20 = **1,000 F**.","التفسير المحتمل: مواد أرخص لكن جودتها أقل، فزاد الهالك (ترابط الانحرافات)."]],["h3","انحرافات المزيج والكمية في المبيعات"],["b","**انحراف مزيج المبيعات** = (نسبة المزيج الفعلية − المخططة) × إجمالي الوحدات الفعلية × هامش المساهمة المخطط للوحدة."],["b","**انحراف كمية المبيعات** = (إجمالي الوحدات الفعلية − المخططة) × نسبة المزيج المخططة × هامش المساهمة المخطط."]],"en":{"title":"Flexible Budgets and Variance Analysis","blocks":[["p","The idea: compare actual results to a **flexible** budget adjusted to actual activity, to separate the volume effect from efficiency and price effects."],["t",["Variance","Formula"],[["Static budget variance","Actual − static budget = flexible budget variance + sales volume variance"],["Sales volume variance","(Actual quantity − budgeted quantity) × standard contribution margin per unit"],["Materials price variance","(Actual price − standard price) × actual quantity **purchased**"],["Materials quantity (usage) variance","(Actual quantity used − standard quantity allowed for actual output) × standard price"],["Labor rate variance","(Actual rate − standard rate) × actual hours"],["Labor efficiency variance","(Actual hours − standard hours allowed for actual output) × standard rate"],["Variable overhead spending variance","Actual − (actual hours × standard rate)"],["Variable overhead efficiency variance","(Actual hours − standard hours) × standard rate"],["Fixed overhead spending variance","Actual − budgeted"],["Fixed overhead volume variance","Budgeted − applied (standard hours × standard rate)"]]],["ex","Example: materials and labor",["Standard: 2 kg × 5 per unit, and 1.5 hours × 20 per unit. Actual production 1,000 units.","Purchased 2,500 kg at 4.80 and used 2,100 kg. Actual hours 1,450 at a rate of 21.","**Materials price** = 2,500 × (4.80 − 5) = **500 favorable (F)**.","**Materials quantity** = (2,100 − 2,000) × 5 = **500 unfavorable (U)**.","**Labor rate** = 1,450 × (21 − 20) = **1,450 U**.","**Labor efficiency** = (1,450 − 1,500) × 20 = **1,000 F**.","A possible explanation: cheaper but lower-quality material increased waste (interrelated variances)."]],["h3","Sales mix and quantity variances"],["b","**Sales mix variance** = (actual mix % − budgeted mix %) × total actual units × budgeted contribution margin per unit."],["b","**Sales quantity variance** = (total actual units − total budgeted units) × budgeted mix % × budgeted contribution margin per unit."]]}},{"title":"مراكز المسؤولية وأسعار التحويل","blocks":[["t",["المركز","المدير مسؤول عن","مقياس الأداء"],[["مركز تكلفة","التكاليف","انحرافات التكلفة"],["مركز إيراد","الإيرادات","انحرافات المبيعات"],["مركز ربح","الإيرادات والتكاليف","هامش المساهمة القابل للتحكم، ربح القطاع"],["مركز استثمار","الربح والأصول المستثمرة","ROI، RI، EVA"]],[2400,3400,3838]],["b","**قائمة الدخل بهامش المساهمة للقطاعات:** المبيعات − المتغيرة = هامش المساهمة − ثابتة يتحكم فيها المدير = هامش المدير − ثابتة خاصة بالقطاع لا يتحكم فيها = **هامش القطاع** − تكاليف مشتركة موزعة = الربح. **يُقيّم المدير على الهامش القابل للتحكم، والقطاع على هامش القطاع.**"],["h3","أسعار التحويل (Transfer pricing)"],["b","الأساليب: سعر السوق، التكلفة (متغيرة أو كاملة أو + هامش)، التفاوض، السعر المزدوج."],["b","**الحد الأدنى للسعر عند البائع** = التكلفة المتغيرة + تكلفة الفرصة البديلة (هامش المساهمة الضائع لو عنده طاقة كاملة)."],["b","**الحد الأقصى عند المشتري** = سعر الشراء من السوق الخارجي."],["ex","مثال",["قسم A بيبيع للسوق بـ 50 وتكلفته المتغيرة 30. قسم B عاوز يشتري منه.","لو A عنده **طاقة عاطلة**: الحد الأدنى = **30**. لو A شغال **بكامل طاقته**: الحد الأدنى = 30 + 20 = **50**."]]],"en":{"title":"Responsibility Centers and Transfer Pricing","blocks":[["t",["Center","Manager is responsible for","Performance measure"],[["Cost center","Costs","Cost variances"],["Revenue center","Revenues","Sales variances"],["Profit center","Revenues and costs","Controllable contribution margin, segment margin"],["Investment center","Profit and invested assets","ROI, RI, EVA"]]],["b","**Segment contribution-margin income statement:** sales − variable costs = contribution margin − controllable fixed costs = manager’s controllable margin − traceable fixed costs the manager cannot control = **segment margin** − allocated common costs = profit. **Evaluate the manager on controllable margin and the segment on segment margin.**"],["h3","Transfer pricing"],["b","Methods: market price, cost (variable, full, or cost-plus), negotiated price, dual pricing."],["b","**Minimum transfer price for the seller** = variable cost + opportunity cost (lost contribution margin if at full capacity)."],["b","**Maximum for the buyer** = the price available from the outside market."],["ex","Example",["Division A sells externally at 50; its variable cost is 30. Division B wants to buy from it.","If A has **idle capacity**: minimum = **30**. If A is at **full capacity**: minimum = 30 + 20 = **50**."]]]}},{"title":"مقاييس الأداء: ROI و RI و EVA و Balanced Scorecard","blocks":[["t",["المقياس","المعادلة","ملاحظة"],[["العائد على الاستثمار ROI","الدخل التشغيلي ÷ الأصول المستثمرة = هامش الربح × معدل دوران الأصول","ممكن يخلي المدير يرفض مشروع مربح للشركة"],["الدخل المتبقي RI","الدخل − (معدل العائد المطلوب × الاستثمار)","بيحل مشكلة ROI، لكنه رقم مطلق يصعب مقارنته بين أقسام مختلفة الحجم"],["القيمة الاقتصادية المضافة EVA","صافي الربح التشغيلي بعد الضريبة NOPAT − (WACC × رأس المال المستثمر)","بيستخدم تكلفة رأس المال الفعلية"]],[2800,4000,2838]],["ex","مثال: تعارض ROI مع مصلحة الشركة",["قسم دخله 300,000 وأصوله 2,000,000، والعائد المطلوب 12% ← ROI = **15%**، RI = 300,000 − 240,000 = **60,000**.","مشروع جديد: استثمار 200,000 ودخل 26,000 (عائد 13%).","بعد المشروع: ROI = 326,000 ÷ 2,200,000 = **14.8%** (نزل، فالمدير هيرفض). RI = 326,000 − 264,000 = **62,000** (زاد 2,000، فالمشروع مفيد للشركة).","الخلاصة: RI بيحقق **توافق الأهداف (Goal congruence)** أحسن من ROI."]],["h3","بطاقة الأداء المتوازن (Balanced Scorecard)"],["t",["المنظور","أمثلة لمؤشرات"],[["المالي","ROI، نمو الإيراد، التدفق النقدي"],["العملاء","رضا العملاء، الحصة السوقية، الاحتفاظ بالعملاء"],["العمليات الداخلية","زمن الدورة، نسبة العيوب، الإنتاجية"],["التعلم والنمو","تدريب الموظفين، معدل دوران العاملين، أنظمة المعلومات"]],[2600,7038]],["b","الفكرة الأساسية: **علاقات السبب والنتيجة** بين المنظورات من التعلم لحد المالي، ومزيج بين مؤشرات قائدة (Leading) وتابعة (Lagging)."]],"en":{"title":"Performance Measures: ROI, RI, EVA, Balanced Scorecard","blocks":[["t",["Measure","Formula","Note"],[["Return on investment (ROI)","Operating income ÷ invested assets = profit margin × asset turnover","May cause a manager to reject a project that is profitable for the company"],["Residual income (RI)","Income − (required rate × investment)","Solves the ROI problem, but as an absolute amount it is hard to compare across divisions of different size"],["Economic value added (EVA)","NOPAT − (WACC × invested capital)","Uses the actual cost of capital"]]],["ex","Example: ROI conflicting with company interest",["A division with income 300,000 and assets 2,000,000; required return 12% → ROI = **15%**, RI = 300,000 − 240,000 = **60,000**.","New project: investment 200,000, income 26,000 (13% return).","After the project: ROI = 326,000 ÷ 2,200,000 = **14.8%** (falls, so the manager rejects it). RI = 326,000 − 264,000 = **62,000** (rises by 2,000, so the project benefits the company).","Conclusion: RI achieves **goal congruence** better than ROI."]],["h3","Balanced Scorecard"],["t",["Perspective","Example measures"],[["Financial","ROI, revenue growth, cash flow"],["Customer","Customer satisfaction, market share, retention"],["Internal business process","Cycle time, defect rate, productivity"],["Learning and growth","Employee training, employee turnover, information systems"]]],["b","The core idea: **cause-and-effect links** across perspectives from learning and growth up to financial, with a mix of leading and lagging indicators."]]}}],"mcqs":[{"q":"المعيار 3 كجم × 4 للوحدة. الإنتاج 2,000 وحدة استخدم 6,300 كجم. انحراف كمية المواد؟","opts":["1,200 U","1,200 F","300 U","1,260 U"],"ans":0,"why":"(6,300 − 6,000) × 4 = 1,200 غير ملائم.","en":{"q":"Standard is 3 kg × 4 per unit. Production of 2,000 units used 6,300 kg. Materials quantity variance?","opts":["1,200 U","1,200 F","300 U","1,260 U"],"why":"(6,300 − 6,000) × 4 = 1,200 unfavorable."}},{"q":"ساعات فعلية 5,200 بمعدل 18، والمعيار 5,000 ساعة بمعدل 17.5. انحراف معدل الأجور؟","opts":["2,600 U","2,500 U","3,500 U","2,600 F"],"ans":0,"why":"5,200 × (18 − 17.5) = 2,600 غير ملائم.","en":{"q":"Actual hours 5,200 at a rate of 18; standard 5,000 hours at 17.5. Labor rate variance?","opts":["2,600 U","2,500 U","3,500 U","2,600 F"],"why":"5,200 × (18 − 17.5) = 2,600 unfavorable."}},{"q":"قسم دخله 400,000 وأصوله 2,500,000 والمعدل المطلوب 14%. الدخل المتبقي؟","opts":["50,000","350,000","56,000","16%"],"ans":0,"why":"400,000 − 14% × 2,500,000 = 400,000 − 350,000 = 50,000.","en":{"q":"A division has income of 400,000, assets of 2,500,000, and a required rate of 14%. Residual income?","opts":["50,000","350,000","56,000","16%"],"why":"400,000 − 14% × 2,500,000 = 400,000 − 350,000 = 50,000."}},{"q":"قسم شغال بطاقة كاملة، يبيع بـ 80 وتكلفته المتغيرة 50. أقل سعر تحويل يقبله:","opts":["50","30","80","65"],"ans":2,"why":"التكلفة المتغيرة 50 + هامش ضائع 30 = 80.","en":{"q":"A division at full capacity sells at 80 with variable cost of 50. The minimum transfer price it will accept:","opts":["50","30","80","65"],"why":"Variable cost 50 + lost margin 30 = 80."}},{"q":"\"معدل دوران الموظفين\" مؤشر في أي منظور من بطاقة الأداء المتوازن؟","opts":["المالي","العملاء","العمليات الداخلية","التعلم والنمو"],"ans":3,"why":"متعلق بالقدرات البشرية والتنظيمية.","en":{"q":"\"Employee turnover rate\" belongs to which Balanced Scorecard perspective?","opts":["Financial","Customer","Internal business process","Learning and growth"],"why":"It relates to human and organizational capability."}},{"q":"لتقييم أداء مدير قسم، أنسب مقياس هو:","opts":["ربح القطاع بعد التكاليف المشتركة الموزعة","هامش المساهمة القابل للتحكم","صافي ربح الشركة","إجمالي المبيعات"],"ans":1,"why":"المدير يُحاسب على اللي يقدر يتحكم فيه فقط.","en":{"q":"The most appropriate measure for evaluating a division manager is:","opts":["Segment profit after allocated common costs","Controllable contribution margin","Company net income","Total sales"],"why":"Managers are held accountable only for what they can control."}},{"q":"ROI = 18% ومعدل دوران الأصول 1.5. ما هامش الربح؟","opts":["27%","12%","16.5%","10%"],"ans":1,"why":"ROI = هامش × دوران ← 18% ÷ 1.5 = 12%.","en":{"q":"ROI = 18% and asset turnover = 1.5. What is the profit margin?","opts":["27%","12%","16.5%","10%"],"why":"ROI = margin × turnover → 18% ÷ 1.5 = 12%."}},{"q":"سبب استخدام الموازنة المرنة في تقييم الأداء:","opts":["أسهل في الإعداد","تعزل أثر اختلاف حجم النشاط عن الكفاءة","تتجاهل التكاليف الثابتة","مطلوبة قانونًا"],"ans":1,"why":"المقارنة بتكون بين الفعلي واللي المفروض يتصرف عند نفس الحجم.","en":{"q":"The reason to use a flexible budget for performance evaluation is that it:","opts":["Is easier to prepare","Isolates the effect of activity-level differences from efficiency","Ignores fixed costs","Is legally required"],"why":"It compares actual results to what should have been spent at the same volume."}}]},{"code":"1D","title":"إدارة التكاليف","en":"Cost Management","weight":15,"lessons":[{"title":"التكاليف المتغيرة مقابل الكلية (Variable vs Absorption)","blocks":[["t",["","التكاليف الكلية (Absorption)","التكاليف المتغيرة (Variable)"],[["تكلفة المنتج","مواد + أجور + غ.م.ص متغيرة + **غ.م.ص ثابتة**","مواد + أجور + غ.م.ص متغيرة"],["غ.م.ص الثابتة","جزء من المخزون","مصروف فترة بالكامل"],["قائمة الدخل","مجمل الربح","هامش المساهمة"],["الاستخدام","التقارير الخارجية (GAAP) والضرائب","القرارات الداخلية"]],[2200,3700,3738]],["b","**فرق الربح** = التغير في المخزون (بالوحدات) × غ.م.ص الثابتة للوحدة."],["b","إنتاج > مبيعات ← الكلية أعلى ربح. إنتاج < مبيعات ← المتغيرة أعلى ربح. إنتاج = مبيعات ← نفس الربح."],["ex","مثال",["إنتاج 10,000 ومبيعات 8,000. غ.م.ص الثابتة 50,000 ← 5 للوحدة.","زيادة المخزون 2,000 وحدة ← ربح التكاليف الكلية أعلى بـ 2,000 × 5 = **10,000**.","ده سبب إن التكاليف الكلية ممكن تشجع المدير على **الإنتاج الزائد** لتحسين الربح."]]],"en":{"title":"Variable vs Absorption Costing","blocks":[["t",["","Absorption costing","Variable costing"],[["Product cost","DM + DL + variable MOH + **fixed MOH**","DM + DL + variable MOH"],["Fixed MOH","Part of inventory","Fully expensed as a period cost"],["Income statement","Gross margin","Contribution margin"],["Use","External reporting (GAAP) and taxes","Internal decision-making"]]],["b","**Profit difference** = change in inventory (units) × fixed MOH per unit."],["b","Production > sales → absorption gives higher profit. Production < sales → variable gives higher profit. Production = sales → same profit."],["ex","Example",["Production 10,000 and sales 8,000. Fixed MOH 50,000 → 5 per unit.","Inventory increases by 2,000 units → absorption profit is higher by 2,000 × 5 = **10,000**.","This is why absorption costing can encourage managers to **overproduce** to boost profit."]]]}},{"title":"التكاليف المشتركة والمنتجات العرضية","blocks":[["b","التكاليف المشتركة بتحصل قبل **نقطة الانفصال (Split-off point)**، وبتتوزع بالطرق دي: الكميات المادية، القيمة البيعية عند الانفصال، صافي القيمة القابلة للتحقق (NRV)، نسبة مجمل الربح الثابتة."],["ex","مثال: القيمة البيعية عند الانفصال",["تكاليف مشتركة 60,000. المنتج A: 4,000 وحدة × 30 = 120,000. المنتج B: 2,000 وحدة × 40 = 80,000. الإجمالي 200,000.","نصيب A = 60,000 × 120/200 = **36,000** | نصيب B = **24,000**."]],["ex","مثال: صافي القيمة القابلة للتحقق",["لو B محتاج تشغيل إضافي بـ 20,000 بعد الانفصال وبيتباع بـ 60 للوحدة: NRV للمنتج B = 120,000 − 20,000 = 100,000.","لو A بيتباع عند الانفصال (120,000) ← الإجمالي 220,000 ← A = 60,000 × 120/220 = **32,727**، B = **27,273**."]],["b","**قرار البيع أو التشغيل الإضافي:** التكاليف المشتركة غير ملائمة للقرار. شغّل لو الإيراد الإضافي > التكلفة الإضافية."],["b","**المنتج العرضي (By-product):** قيمته صغيرة، وإيراده إما يقلل تكلفة المنتج الرئيسي أو يتسجل كإيراد آخر."]],"en":{"title":"Joint Costs and By-products","blocks":[["b","Joint costs are incurred before the **split-off point** and are allocated using: physical units, relative sales value at split-off, net realizable value (NRV), or constant gross margin percentage."],["ex","Example: sales value at split-off",["Joint costs 60,000. Product A: 4,000 units × 30 = 120,000. Product B: 2,000 units × 40 = 80,000. Total 200,000.","A’s share = 60,000 × 120/200 = **36,000** | B’s share = **24,000**."]],["ex","Example: net realizable value",["If B needs 20,000 of further processing after split-off and sells for 60 per unit: B’s NRV = 120,000 − 20,000 = 100,000.","If A is sold at split-off (120,000) → total 220,000 → A = 60,000 × 120/220 = **32,727**, B = **27,273**."]],["b","**Sell or process further:** joint costs are irrelevant to the decision. Process further if incremental revenue > incremental cost."],["b","**By-product:** low value; its revenue either reduces the cost of the main product or is recorded as other income."]]}},{"title":"نظم التكاليف: الأوامر والمراحل و ABC","blocks":[["b","**تكاليف الأوامر (Job order):** منتجات مختلفة حسب الطلب (مقاولات، طباعة). كل أمر بيتسجل لوحده."],["b","**تكاليف المراحل (Process):** منتجات متجانسة بكميات كبيرة (أسمنت، مشروبات). بنحسب **الوحدات المعادلة (Equivalent units)**."],["ex","مثال: الوحدات المعادلة",["أول المدة 1,000 وحدة (تشغيل 40%)، بدأ 9,000، تم 8,000، آخر المدة 2,000 (تشغيل 60%). المواد بتضاف في بداية المرحلة.","**المتوسط المرجح:** مواد = 8,000 + 2,000 = **10,000** | تشغيل = 8,000 + 1,200 = **9,200**.","**FIFO:** مواد = 0 + 7,000 + 2,000 = **9,000** | تشغيل = (1,000 × 60%) + 7,000 + 1,200 = **8,800**.","الفرق بين الطريقتين = شغل أول المدة اللي اتعمل في الفترة اللي فاتت."]],["h3","التكاليف على أساس الأنشطة (ABC)"],["n","تحديد الأنشطة (تجهيز آلات، فحص جودة، استلام مواد)."],["n","تجميع تكاليف كل نشاط."],["n","تحديد مسبب التكلفة لكل نشاط (عدد مرات التجهيز، عدد الفحوصات)."],["n","معدل النشاط = تكلفة النشاط ÷ إجمالي المسبب."],["n","تحميل المنتجات حسب استهلاكها للمسببات."],["ex","مثال",["تكلفة التجهيز 100,000 لـ 50 مرة تجهيز ← 2,000 للمرة. المنتج X عمل 10 مرات تجهيز لإنتاج 1,000 وحدة.","تكلفة التجهيز على X = 20,000 ← **20 للوحدة**. لو كنا وزعنا على ساعات الآلات كان ممكن المنتجات الكبيرة تتحمل أكتر من نصيبها، والصغيرة المعقدة تبان أرخص من حقيقتها."]],["b","مستويات الأنشطة: الوحدة، الدفعة (Batch)، المنتج، المنشأة."],["b","مميزات ABC: تكلفة أدق، خصوصًا مع تنوع المنتجات وارتفاع التكاليف غير المباشرة. عيوبها: تكلفة التطبيق والصيانة."]],"en":{"title":"Costing Systems: Job Order, Process, and ABC","blocks":[["b","**Job order costing:** different, customized products (construction, printing). Each job is tracked separately."],["b","**Process costing:** homogeneous products in large volumes (cement, beverages). We calculate **equivalent units**."],["ex","Example: equivalent units",["Beginning WIP 1,000 units (40% converted), started 9,000, completed 8,000, ending WIP 2,000 (60% converted). Materials are added at the start of the process.","**Weighted average:** materials = 8,000 + 2,000 = **10,000** | conversion = 8,000 + 1,200 = **9,200**.","**FIFO:** materials = 0 + 7,000 + 2,000 = **9,000** | conversion = (1,000 × 60%) + 7,000 + 1,200 = **8,800**.","The difference between the methods = work on beginning inventory done in the prior period."]],["h3","Activity-based costing (ABC)"],["n","Identify activities (machine setups, quality inspections, receiving materials)."],["n","Accumulate the cost of each activity."],["n","Identify the cost driver for each activity (number of setups, number of inspections)."],["n","Activity rate = activity cost ÷ total driver quantity."],["n","Assign costs to products based on their consumption of drivers."],["ex","Example",["Setup cost 100,000 for 50 setups → 2,000 per setup. Product X required 10 setups to produce 1,000 units.","Setup cost for X = 20,000 → **20 per unit**. Allocating by machine hours could have overcosted high-volume products and made small, complex products look cheaper than they are."]],["b","Activity levels: unit, batch, product, facility."],["b","ABC advantages: more accurate costs, especially with diverse products and high overhead. Disadvantages: cost of implementation and maintenance."]]}},{"title":"تحميل التكاليف غير المباشرة وأقسام الخدمات","blocks":[["b","**المعدل المحدد مقدمًا** = التكاليف غير المباشرة المقدرة ÷ أساس التحميل المقدر."],["b","**المحمّل أقل (Under-applied):** الفعلي > المحمّل. **المحمّل أكثر (Over-applied):** المحمّل > الفعلي. الفرق يُقفل في تكلفة المبيعات لو غير جوهري، أو يتوزع على المخزون وتكلفة المبيعات لو جوهري."],["ex","مثال",["التقديرات: 400,000 تكاليف غير مباشرة و 20,000 ساعة آلة ← معدل 20 للساعة.","الفعلي: 21,000 ساعة وتكاليف 430,000. المحمّل = 420,000 ← **أقل من الفعلي بـ 10,000**."]],["h3","توزيع تكاليف أقسام الخدمات"],["t",["الطريقة","الفكرة"],[["المباشرة (Direct)","تتجاهل الخدمات المتبادلة بين أقسام الخدمات، وتوزع على أقسام الإنتاج فقط."],["التدريجية (Step-down)","تعترف بجزء من الخدمات المتبادلة؛ نبدأ بالقسم اللي بيخدم أكتر، وما يرجعلوش توزيع بعد كده."],["التبادلية (Reciprocal)","تعترف بكل الخدمات المتبادلة بمعادلات آنية. الأدق."]],[2600,7038]]],"en":{"title":"Overhead Allocation and Service Departments","blocks":[["b","**Predetermined overhead rate** = estimated overhead ÷ estimated allocation base."],["b","**Underapplied:** actual > applied. **Overapplied:** applied > actual. The difference is closed to COGS if immaterial, or prorated among inventories and COGS if material."],["ex","Example",["Estimates: overhead 400,000 and 20,000 machine hours → rate of 20 per hour.","Actual: 21,000 hours and overhead 430,000. Applied = 420,000 → **underapplied by 10,000**."]],["h3","Service department cost allocation"],["t",["Method","Idea"],[["Direct","Ignores services between service departments; allocates only to production departments."],["Step-down","Partially recognizes reciprocal services; start with the department that serves the most, and nothing is allocated back to it."],["Reciprocal","Fully recognizes reciprocal services using simultaneous equations. Most accurate."]]]]}},{"title":"تحسين العمليات وسلسلة التوريد","blocks":[["t",["المفهوم","الخلاصة"],[["الإنتاج الرشيق (Lean)","تقليل الهدر بأنواعه: إنتاج زائد، انتظار، نقل، مخزون، حركة، عيوب، تشغيل زائد."],["في الوقت المحدد (JIT)","الإنتاج حسب الطلب الفعلي (Pull)، مخزون قريب من الصفر، علاقة قوية مع موردين قليلين."],["MRP و ERP","MRP بيحسب احتياجات المواد من جدول الإنتاج (Push). ERP بيربط كل إدارات الشركة على قاعدة بيانات واحدة."],["نظرية القيود (TOC)","كل نظام فيه عنق زجاجة. **ربح الإنتاجية (Throughput)** = المبيعات − المواد المباشرة. الخطوات: حدد القيد ← استغله ← خضع كل حاجة ليه ← وسّعه ← كرر."],["سلسلة القيمة (Value chain)","الأنشطة الأساسية والمساندة اللي بتضيف قيمة للعميل."],["المقارنة المرجعية (Benchmarking)","مقارنة العمليات بأفضل الممارسات."],["Six Sigma","تقليل العيوب لـ 3.4 لكل مليون فرصة. منهجية DMAIC: تعريف، قياس، تحليل، تحسين، تحكم."],["إعادة هندسة العمليات (BPR)","إعادة تصميم جذرية مش تحسين تدريجي."],["التعهيد (Outsourcing)","الاستعانة بطرف خارجي؛ قرار شراء أو تصنيع على مستوى العمليات."]],[2600,7038]],["h3","تكلفة الجودة"],["t",["الفئة","أمثلة"],[["المنع (Prevention)","تدريب، تصميم المنتج، تقييم الموردين."],["التقييم (Appraisal)","فحص واختبار المواد والمنتجات."],["الفشل الداخلي","خردة، إعادة تشغيل، توقف بسبب العيوب (قبل ما المنتج يوصل للعميل)."],["الفشل الخارجي","ضمان، مرتجعات، قضايا، فقدان السمعة (بعد ما المنتج يوصل للعميل)."]],[2600,7038]],["b","زيادة الإنفاق على **المنع** غالبًا بتقلل إجمالي تكلفة الجودة."]],"en":{"title":"Supply Chain and Business Process Improvement","blocks":[["t",["Concept","Summary"],[["Lean manufacturing","Eliminate the forms of waste: overproduction, waiting, transportation, inventory, motion, defects, overprocessing."],["Just-in-time (JIT)","Produce to actual demand (pull), near-zero inventory, strong relationships with few suppliers."],["MRP and ERP","MRP computes material requirements from the production schedule (push). ERP integrates all departments on a single database."],["Theory of constraints (TOC)","Every system has a bottleneck. **Throughput contribution** = sales − direct materials. Steps: identify the constraint → exploit it → subordinate everything to it → elevate it → repeat."],["Value chain","Primary and support activities that add value for the customer."],["Benchmarking","Comparing processes to best practices."],["Six Sigma","Reduce defects to 3.4 per million opportunities. DMAIC: define, measure, analyze, improve, control."],["Business process reengineering (BPR)","Radical redesign, not incremental improvement."],["Outsourcing","Using an outside party; a make-or-buy decision at the process level."]]],["h3","Cost of quality"],["t",["Category","Examples"],[["Prevention","Training, product design, supplier evaluation."],["Appraisal","Inspecting and testing materials and products."],["Internal failure","Scrap, rework, downtime due to defects (before the product reaches the customer)."],["External failure","Warranty, returns, lawsuits, lost reputation (after the product reaches the customer)."]]],["b","Spending more on **prevention** usually lowers total cost of quality."]]}}],"mcqs":[{"q":"إنتاج 12,000 ومبيعات 15,000، وغ.م.ص الثابتة 6 للوحدة. أي طريقة تعطي ربح أعلى وبكام؟","opts":["الكلية بـ 18,000","المتغيرة بـ 18,000","الكلية بـ 90,000","نفس الربح"],"ans":1,"why":"المخزون نقص 3,000 وحدة، فالكلية بتحمّل تكلفة ثابتة أكتر من الفترة: الفرق 3,000 × 6 = 18,000 لصالح المتغيرة.","en":{"q":"Production 12,000, sales 15,000, fixed MOH 6 per unit. Which method shows higher profit and by how much?","opts":["Absorption by 18,000","Variable by 18,000","Absorption by 90,000","Same profit"],"why":"Inventory decreased by 3,000 units, so absorption expenses more fixed cost this period: 3,000 × 6 = 18,000 in favor of variable costing."}},{"q":"في قرار البيع عند الانفصال أو التشغيل الإضافي، التكاليف المشتركة:","opts":["ملائمة","غير ملائمة","تُضاف للتكلفة الإضافية","تُوزع بالكمية"],"ans":1,"why":"التكاليف المشتركة بتحصل في الحالتين.","en":{"q":"In a sell-at-split-off or process-further decision, joint costs are:","opts":["Relevant","Irrelevant","Added to incremental cost","Allocated by quantity"],"why":"Joint costs are incurred under both alternatives."}},{"q":"أول المدة 2,000 (تشغيل 50%)، تم 10,000، آخر المدة 3,000 (تشغيل 40%). الوحدات المعادلة للتشغيل بطريقة FIFO؟","opts":["11,200","10,200","12,200","9,200"],"ans":1,"why":"إتمام أول المدة 1,000 + بدأ وتم 8,000 + آخر المدة 1,200 = 10,200.","en":{"q":"Beginning WIP 2,000 (50% converted), completed 10,000, ending WIP 3,000 (40% converted). Equivalent units for conversion under FIFO?","opts":["11,200","10,200","12,200","9,200"],"why":"Completing beginning WIP 1,000 + started and completed 8,000 + ending WIP 1,200 = 10,200."}},{"q":"التكاليف غير المباشرة الفعلية 250,000، والمعدل 12 للساعة، والساعات الفعلية 20,000. النتيجة؟","opts":["محمّل أقل بـ 10,000","محمّل أكتر بـ 10,000","محمّل أقل بـ 2,000","لا فرق"],"ans":0,"why":"المحمّل 240,000 أقل من الفعلي 250,000.","en":{"q":"Actual overhead 250,000; rate 12 per hour; actual hours 20,000. The result?","opts":["Underapplied by 10,000","Overapplied by 10,000","Underapplied by 2,000","No difference"],"why":"Applied 240,000 is less than actual 250,000."}},{"q":"أي طريقة لتوزيع تكاليف أقسام الخدمات تعترف بالكامل بالخدمات المتبادلة؟","opts":["المباشرة","التدريجية","التبادلية","الكميات المادية"],"ans":2,"why":"Reciprocal method بتحل معادلات آنية.","en":{"q":"Which service department allocation method fully recognizes reciprocal services?","opts":["Direct","Step-down","Reciprocal","Physical units"],"why":"The reciprocal method solves simultaneous equations."}},{"q":"تكلفة ضمان المنتجات المباعة تُصنف:","opts":["منع","تقييم","فشل داخلي","فشل خارجي"],"ans":3,"why":"حصلت بعد ما المنتج وصل للعميل.","en":{"q":"Warranty costs on products sold are classified as:","opts":["Prevention","Appraisal","Internal failure","External failure"],"why":"They arise after the product reaches the customer."}},{"q":"وفق نظرية القيود، ربح الإنتاجية (Throughput contribution) يساوي:","opts":["المبيعات − كل التكاليف المتغيرة","المبيعات − المواد المباشرة","المبيعات − تكلفة المبيعات","هامش المساهمة − الثابتة"],"ans":1,"why":"TOC بتعتبر المواد المباشرة بس هي المتغيرة فعليًا على المدى القصير.","en":{"q":"Under the theory of constraints, throughput contribution equals:","opts":["Sales − all variable costs","Sales − direct materials","Sales − COGS","Contribution margin − fixed costs"],"why":"TOC treats only direct materials as truly variable in the short run."}},{"q":"ABC مفيدة أكتر في شركة:","opts":["بتنتج منتج واحد","تكاليفها غير المباشرة قليلة","منتجاتها متنوعة جدًا وتكاليفها غير المباشرة كبيرة","بتستخدم التكاليف المتغيرة"],"ans":2,"why":"التنوع يزود تشويه التوزيع بمعدل واحد.","en":{"q":"ABC is most useful in a company that:","opts":["Produces a single product","Has low overhead","Has highly diverse products and large overhead","Uses variable costing"],"why":"Diversity increases distortion from a single allocation rate."}}]},{"code":"1E","title":"الرقابة الداخلية","en":"Internal Controls","weight":15,"lessons":[{"title":"الحوكمة و COSO و قانون ساربينز أوكسلي","blocks":[["p","الرقابة الداخلية حسب COSO: **عملية** بينفذها مجلس الإدارة والإدارة والموظفين لتوفير **تأكيد معقول** (مش مطلق) لتحقيق أهداف التشغيل والتقارير والالتزام."],["h3","مكونات COSO الخمسة (إطار 2013)"],["t",["المكون","أمثلة"],[["بيئة الرقابة (Control environment)","النزاهة، \
