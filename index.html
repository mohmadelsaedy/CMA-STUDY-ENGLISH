"النغمة من القمة\"، استقلال المجلس، الهيكل التنظيمي، الكفاءات. **أساس باقي المكونات**."],["تقييم المخاطر","تحديد وتحليل المخاطر بما فيها مخاطر الغش والتغيرات المهمة."],["أنشطة الرقابة","الاعتمادات، الفصل بين المهام، المطابقات، الرقابة المادية، ضوابط تكنولوجيا المعلومات."],["المعلومات والاتصال","معلومات ذات جودة، والتواصل داخليًا وخارجيًا."],["المتابعة (Monitoring)","تقييمات مستمرة ومنفصلة، والإبلاغ عن أوجه القصور."]],[3000,6638]],["b","الإطار بيتكون من **17 مبدأ** موزعة على المكونات الخمسة، وكلها لازم تكون موجودة وشغالة مع بعض."],["h3","قانون ساربينز أوكسلي (SOX)"],["b","**القسم 302:** المدير التنفيذي والمدير المالي يشهدوا شخصيًا على صحة التقارير وفعالية الرقابة."],["b","**القسم 404:** الإدارة تقيّم فعالية الرقابة الداخلية على التقارير المالية (ICFR) وتصدر تقرير عنها. والمراجع الخارجي يبدي رأيه فيها للشركات الكبيرة (Accelerated filers)."],["b","**PCAOB AS 2201:** منهج \"من أعلى لأسفل\" مبني على المخاطر في مراجعة ICFR."],["b","**قانون مكافحة الممارسات الأجنبية الفاسدة (FCPA):** بيمنع رشوة المسؤولين الأجانب، ويلزم الشركات المسجلة بدفاتر دقيقة ونظام رقابة داخلية كافٍ."],["b","**لجنة المراجعة:** أعضاء مستقلين، واحد على الأقل خبير مالي، مسؤولة عن الإشراف على المراجع الخارجي وتعيينه."]],"en":{"title":"Governance, COSO, and Sarbanes-Oxley","blocks":[["p","Internal control per COSO: a **process**, effected by the board, management, and other personnel, designed to provide **reasonable** (not absolute) **assurance** of achieving operations, reporting, and compliance objectives."],["h3","The five COSO components (2013 framework)"],["t",["Component","Examples"],[["Control environment","Integrity, \"tone at the top\", board independence, organizational structure, competence. **The foundation for all other components**."],["Risk assessment","Identifying and analyzing risks, including fraud risk and significant changes."],["Control activities","Authorizations, segregation of duties, reconciliations, physical controls, IT controls."],["Information and communication","Quality information, communicated internally and externally."],["Monitoring activities","Ongoing and separate evaluations; reporting deficiencies."]]],["b","The framework includes **17 principles** across the five components, and all must be present and functioning together."],["h3","Sarbanes-Oxley Act (SOX)"],["b","**Section 302:** the CEO and CFO personally certify the accuracy of reports and the effectiveness of controls."],["b","**Section 404:** management assesses and reports on the effectiveness of internal control over financial reporting (ICFR). The external auditor attests to it for larger (accelerated) filers."],["b","**PCAOB AS 2201:** a top-down, risk-based approach to auditing ICFR."],["b","**Foreign Corrupt Practices Act (FCPA):** prohibits bribery of foreign officials and requires registrants to keep accurate books and an adequate internal control system."],["b","**Audit committee:** independent members, at least one financial expert; responsible for overseeing and appointing the external auditor."]]}},{"title":"مخاطر الرقابة وأنواع الضوابط","blocks":[["t",["النوع","الهدف","مثال"],[["وقائية (Preventive)","تمنع الخطأ قبل حدوثه","كلمات المرور، الاعتمادات، الفصل بين المهام"],["اكتشافية (Detective)","تكتشف الخطأ بعد حدوثه","المطابقات البنكية، الجرد الفعلي، المراجعة"],["تصحيحية (Corrective)","تصلح الخطأ وتمنع تكراره","النسخ الاحتياطي، إجراءات التصحيح"],["توجيهية (Directive)","تشجع على السلوك المطلوب","السياسات، التدريب"]],[2400,3000,4238]],["h3","الفصل بين المهام (Segregation of duties)"],["p","لازم الأربع وظائف دول يبقوا مع أشخاص مختلفين: **التفويض (Authorization)**، **التسجيل (Recording)**، **الحيازة (Custody)**، **المطابقة**. مثال: اللي بيستلم الشيكات ميسجلش في حسابات العملاء."],["b","**مخاطر الغش:** مثلث الغش = الضغط + الفرصة + التبرير. الرقابة الداخلية بتقلل **الفرصة**."],["b","**قيود الرقابة:** التواطؤ بين موظفين، تجاوز الإدارة، الخطأ البشري، والتكلفة اللي ممكن تزيد عن المنفعة."]],"en":{"title":"Control Risk and Types of Controls","blocks":[["t",["Type","Purpose","Example"],[["Preventive","Stop errors before they occur","Passwords, authorizations, segregation of duties"],["Detective","Find errors after they occur","Bank reconciliations, physical counts, reviews"],["Corrective","Fix errors and prevent recurrence","Backups, correction procedures"],["Directive","Encourage desired behavior","Policies, training"]]],["h3","Segregation of duties"],["p","These four functions should be performed by different people: **authorization**, **recordkeeping**, **custody**, and **reconciliation**. Example: the person who receives checks should not post to customer accounts."],["b","**Fraud risk:** the fraud triangle = pressure + opportunity + rationalization. Internal control reduces **opportunity**."],["b","**Limitations of control:** collusion, management override, human error, and costs that may exceed benefits."]]}},{"title":"ضوابط أنظمة المعلومات والأمن","blocks":[["h3","الضوابط العامة (General controls)"],["b","بتنطبق على كل البيئة: تطوير وصيانة الأنظمة، الوصول، تشغيل مركز البيانات، استمرارية الأعمال."],["h3","ضوابط التطبيقات (Application controls)"],["t",["المرحلة","أمثلة"],[["المدخلات","رقم التحقق (Check digit)، فحص الصلاحية (Validity)، فحص المدى (Limit/Range)، الحقول الإلزامية، المجاميع الرقابية للدفعات (Batch totals)، **المجاميع الهاش (Hash totals)** لحقل ملوش معنى حسابي زي أرقام الموظفين."],["المعالجة","مطابقة الأرصدة، سجل التشغيل، التحقق من المجاميع بين المراحل."],["المخرجات","مراجعة التقارير، التوزيع على المصرح لهم فقط."]],[2200,7438]],["h3","استمرارية الأعمال"],["b","**الموقع الساخن (Hot site):** جاهز بالكامل بأجهزة وبيانات، يشتغل فورًا. **الدافئ (Warm):** أجهزة جزئية. **البارد (Cold):** مكان وكهرباء بس."],["b","النسخ الاحتياطي بنظام الجد والأب والابن (Grandfather-father-son)، والتخزين خارج الموقع أو على السحابة."],["b","أمن المعلومات: التشفير، جدران الحماية، المصادقة متعددة العوامل، مبدأ أقل صلاحية (Least privilege)."]],"en":{"title":"Systems Controls and Security","blocks":[["h3","General controls"],["b","Apply to the whole environment: systems development and maintenance, access, data center operations, business continuity."],["h3","Application controls"],["t",["Stage","Examples"],[["Input","Check digit, validity check, limit/range check, required fields, batch totals, **hash totals** on a field with no arithmetic meaning, such as employee numbers."],["Processing","Balance reconciliations, run logs, run-to-run totals."],["Output","Report review, distribution to authorized users only."]]],["h3","Business continuity"],["b","**Hot site:** fully equipped with hardware and data, operational immediately. **Warm site:** partial equipment. **Cold site:** space and power only."],["b","Grandfather-father-son backups, with off-site or cloud storage."],["b","Information security: encryption, firewalls, multi-factor authentication, principle of least privilege."]]}}],"mcqs":[{"q":"أي مكون في COSO يُعتبر أساس باقي المكونات؟","opts":["تقييم المخاطر","بيئة الرقابة","أنشطة الرقابة","المتابعة"],"ans":1,"why":"بيئة الرقابة بتحدد ثقافة المنشأة وموقفها من الرقابة.","en":{"q":"Which COSO component is considered the foundation for all others?","opts":["Risk assessment","Control environment","Control activities","Monitoring"],"why":"The control environment sets the organization’s culture and attitude toward control."}},{"q":"القسم 404 من SOX يلزم بـ:","opts":["شهادة المدير التنفيذي والمالي على كل تقرير","تقرير الإدارة عن فعالية الرقابة الداخلية على التقارير المالية","منع رشوة المسؤولين الأجانب","تكوين لجنة مراجعة"],"ans":1,"why":"302 للشهادة الشخصية، و 404 لتقييم وتقرير ICFR.","en":{"q":"SOX Section 404 requires:","opts":["CEO and CFO certification of every report","A management report on the effectiveness of internal control over financial reporting","A prohibition on bribing foreign officials","Forming an audit committee"],"why":"302 is the personal certification; 404 is the ICFR assessment and report."}},{"q":"المطابقة البنكية الشهرية تعتبر رقابة:","opts":["وقائية","اكتشافية","تصحيحية","توجيهية"],"ans":1,"why":"بتكتشف الأخطاء بعد ما حصلت.","en":{"q":"A monthly bank reconciliation is a:","opts":["Preventive control","Detective control","Corrective control","Directive control"],"why":"It detects errors after they occur."}},{"q":"أكبر خطر لو نفس الموظف بيستلم النقدية وبيسجل في حسابات العملاء:","opts":["أخطاء حسابية","إخفاء اختلاس النقدية","تأخير التسجيل","زيادة التكلفة"],"ans":1,"why":"الجمع بين الحيازة والتسجيل يسمح بإخفاء السرقة (زي Lapping).","en":{"q":"The biggest risk if the same employee receives cash and posts to customer accounts:","opts":["Calculation errors","Concealing cash theft","Posting delays","Higher cost"],"why":"Combining custody and recordkeeping allows theft to be concealed (e.g., lapping)."}},{"q":"مجموع أرقام الحسابات في دفعة إدخال (رقم ملوش معنى حسابي) يسمى:","opts":["مجموع مالي","مجموع هاش","رقم تحقق","فحص مدى"],"ans":1,"why":"Hash total بيكشف حذف أو تغيير سجلات.","en":{"q":"The sum of account numbers in an input batch (a number with no arithmetic meaning) is called a:","opts":["Financial total","Hash total","Check digit","Range check"],"why":"A hash total detects missing or altered records."}},{"q":"موقع بديل فيه أجهزة وبيانات محدّثة ويشتغل فورًا:","opts":["بارد","دافئ","ساخن","سحابي احتياطي"],"ans":2,"why":"Hot site.","en":{"q":"An alternate site with up-to-date hardware and data that can operate immediately is a:","opts":["Cold site","Warm site","Hot site","Cloud backup"],"why":"Hot site."}},{"q":"أي مما يلي يُعد قيدًا متأصلًا في الرقابة الداخلية؟","opts":["الفصل بين المهام","التواطؤ بين الموظفين","المطابقات","التشفير"],"ans":1,"why":"التواطؤ يقدر يتغلب على الفصل بين المهام.","en":{"q":"Which of the following is an inherent limitation of internal control?","opts":["Segregation of duties","Collusion among employees","Reconciliations","Encryption"],"why":"Collusion can defeat segregation of duties."}}]},{"code":"1F","title":"التكنولوجيا والتحليلات","en":"Technology and Analytics","weight":15,"lessons":[{"title":"نظم المعلومات وحوكمة البيانات","blocks":[["b","**نظام المعلومات المحاسبي (AIS):** دورات: الإيراد (من الطلب للتحصيل)، المصروفات (من الشراء للسداد)، الإنتاج، الأجور، التقارير المالية."],["b","**ERP:** قاعدة بيانات موحدة لكل الإدارات، بيقلل التكرار ويحسن الرقابة، لكنه مكلف وتطبيقه معقد."],["b","**مستودع البيانات (Data warehouse):** بيانات منظمة ومنقحة للتحليل. **بحيرة البيانات (Data lake):** بيانات خام بكل أشكالها."],["b","**إدارة أداء المنشأة (EPM/CPM):** برامج للتخطيط والموازنة والتقارير."],["h3","حوكمة البيانات"],["b","**COBIT:** إطار ISACA لحوكمة وإدارة تكنولوجيا المعلومات في المنشأة."],["b","**دورة حياة البيانات:** الإنشاء/الجمع ← التخزين ← الاستخدام ← المشاركة ← الأرشفة ← الإتلاف."],["b","**الأمن السيبراني:** التصيد (Phishing)، برامج الفدية (Ransomware)، الهندسة الاجتماعية، هجمات حجب الخدمة (DDoS). الحماية: تدريب، تحديثات، نسخ احتياطي، مصادقة متعددة."]],"en":{"title":"Information Systems and Data Governance","blocks":[["b","**Accounting information system (AIS):** cycles: revenue (order to cash), expenditure (purchase to pay), production, payroll, financial reporting."],["b","**ERP:** a single database for all departments; reduces duplication and improves control, but is costly and complex to implement."],["b","**Data warehouse:** structured, cleaned data for analysis. **Data lake:** raw data in all formats."],["b","**Enterprise performance management (EPM/CPM):** software for planning, budgeting, and reporting."],["h3","Data governance"],["b","**COBIT:** ISACA’s framework for governance and management of enterprise IT."],["b","**Data life cycle:** creation/capture → storage → usage → sharing → archiving → destruction."],["b","**Cybersecurity:** phishing, ransomware, social engineering, denial-of-service (DDoS) attacks. Protection: training, updates, backups, multi-factor authentication."]]}},{"title":"تحول وظيفة المالية بالتكنولوجيا","blocks":[["t",["التكنولوجيا","الاستخدام في المالية"],[["دورة حياة تطوير الأنظمة (SDLC)","التخطيط ← التحليل ← التصميم ← التطوير ← الاختبار ← التطبيق ← الصيانة. أو منهج Agile بدورات قصيرة."],["أتمتة العمليات الروبوتية (RPA)","برامج بتقلد الإنسان في المهام المتكررة المبنية على قواعد (مطابقات، إدخال فواتير)."],["الذكاء الاصطناعي وتعلم الآلة","التنبؤ، كشف الغش، تحليل النصوص. محتاج بيانات كتير ومراقبة للتحيز."],["الحوسبة السحابية","SaaS (برنامج جاهز)، PaaS (منصة تطوير)، IaaS (بنية تحتية). تقلل الاستثمار الرأسمالي لكن فيها مخاطر أمن وتبعية للمورد."],["البلوك تشين","سجل موزع غير قابل للتعديل، والعقود الذكية بتنفذ نفسها تلقائيًا. مفيد في سلاسل التوريد والمدفوعات."]],[3000,6638]]],"en":{"title":"Technology-enabled Finance Transformation","blocks":[["t",["Technology","Use in finance"],[["Systems development life cycle (SDLC)","Planning → analysis → design → development → testing → implementation → maintenance. Or Agile with short iterations."],["Robotic process automation (RPA)","Software that mimics humans in repetitive, rule-based tasks (reconciliations, invoice entry)."],["Artificial intelligence and machine learning","Forecasting, fraud detection, text analysis. Needs lots of data and monitoring for bias."],["Cloud computing","SaaS (ready software), PaaS (development platform), IaaS (infrastructure). Reduces capital investment but carries security and vendor-dependence risks."],["Blockchain","A distributed, immutable ledger; smart contracts execute automatically. Useful in supply chains and payments."]]]]}},{"title":"تحليل البيانات (Data analytics)","blocks":[["t",["النوع","السؤال","مثال"],[["وصفي (Descriptive)","إيه اللي حصل؟","لوحة متابعة المبيعات الشهرية"],["تشخيصي (Diagnostic)","ليه حصل؟","تحليل أسباب انخفاض الهامش"],["تنبؤي (Predictive)","إيه اللي هيحصل؟","تنبؤ الطلب بالانحدار"],["توجيهي (Prescriptive)","نعمل إيه؟","تحسين مزيج الإنتاج بالبرمجة الخطية"]],[2500,2500,4638]],["b","**البيانات المنظمة وغير المنظمة:** جداول مقابل نصوص وصور وفيديو. **البيانات الضخمة (Big data):** الحجم، السرعة، التنوع، الصحة (Veracity)، القيمة."],["b","**التنقيب في البيانات (Data mining):** اكتشاف الأنماط والتجميع (Clustering) والتصنيف (Classification)."],["b","**المحاكاة (Monte Carlo):** تشغيل آلاف السيناريوهات العشوائية علشان نشوف توزيع النتائج المحتملة."],["b","**تحليل الحساسية:** تغيير متغير واحد ونشوف أثره على النتيجة."],["b","**القيم المتطرفة (Outliers):** ممكن تشوه الانحدار، فلازم نتأكد منها قبل ما نشيلها."],["b","**التصور البصري (Visualization):** الخط للاتجاهات الزمنية، الأعمدة للمقارنة، الانتشار (Scatter) للعلاقات، الدائري للنسب (بعدد قليل من الفئات)."],["exam","نقطة امتحان",["سؤال متكرر: \"شركة عاوزة تعرف أنسب سعر يعظّم الربح مع قيود الطاقة\" ← تحليل توجيهي (Prescriptive). \"تعرف ليه المبيعات نزلت\" ← تشخيصي."]]],"en":{"title":"Data Analytics","blocks":[["t",["Type","Question","Example"],[["Descriptive","What happened?","A monthly sales dashboard"],["Diagnostic","Why did it happen?","Analyzing causes of a margin decline"],["Predictive","What will happen?","Demand forecasting with regression"],["Prescriptive","What should we do?","Optimizing product mix with linear programming"]]],["b","**Structured vs unstructured data:** tables vs text, images, video. **Big data:** volume, velocity, variety, veracity, value."],["b","**Data mining:** discovering patterns, clustering, and classification."],["b","**Simulation (Monte Carlo):** running thousands of random scenarios to see the distribution of possible outcomes."],["b","**Sensitivity analysis:** change one variable and observe the effect on the result."],["b","**Outliers:** can distort regression, so verify them before removing them."],["b","**Visualization:** line charts for trends over time, bar charts for comparisons, scatter plots for relationships, pie charts for proportions (with few categories)."],["exam","Exam point",["A frequent question: \"A company wants the price that maximizes profit given capacity constraints\" → prescriptive analytics. \"Why did sales fall?\" → diagnostic."]]]}}],"mcqs":[{"q":"\"إيه أفضل مزيج إنتاج في ظل قيود الطاقة؟\" نوع التحليل:","opts":["وصفي","تشخيصي","تنبؤي","توجيهي"],"ans":3,"why":"بيقترح القرار الأمثل.","en":{"q":"\"What is the best product mix given capacity constraints?\" This type of analytics is:","opts":["Descriptive","Diagnostic","Predictive","Prescriptive"],"why":"It recommends the optimal decision."}},{"q":"أنسب تكنولوجيا لأتمتة مطابقة الفواتير المتكررة المبنية على قواعد ثابتة:","opts":["البلوك تشين","RPA","بحيرة البيانات","IaaS"],"ans":1,"why":"RPA مناسبة للمهام المتكررة المبنية على قواعد.","en":{"q":"The best technology for automating repetitive, rule-based invoice matching:","opts":["Blockchain","RPA","Data lake","IaaS"],"why":"RPA suits repetitive rule-based tasks."}},{"q":"شركة بتستخدم برنامج محاسبة جاهز على الإنترنت باشتراك شهري. نوع الخدمة السحابية:","opts":["IaaS","PaaS","SaaS","On-premise"],"ans":2,"why":"Software as a Service.","en":{"q":"A company uses ready-made online accounting software on a monthly subscription. The cloud service type is:","opts":["IaaS","PaaS","SaaS","On-premise"],"why":"Software as a Service."}},{"q":"أي مما يلي من خصائص البلوك تشين؟","opts":["قاعدة بيانات مركزية يديرها طرف واحد","سجل موزع يصعب تعديل بياناته","بيانات غير مشفرة","لا يحتاج شبكة"],"ans":1,"why":"Distributed immutable ledger.","en":{"q":"Which of the following is a characteristic of blockchain?","opts":["A central database managed by one party","A distributed ledger whose data is hard to alter","Unencrypted data","Requires no network"],"why":"A distributed, immutable ledger."}},{"q":"الإطار الأشهر لحوكمة تكنولوجيا المعلومات في المنشآت:","opts":["COSO ERM","COBIT","ISSB","SDLC"],"ans":1,"why":"COBIT من ISACA.","en":{"q":"The best-known framework for enterprise IT governance:","opts":["COSO ERM","COBIT","ISSB","SDLC"],"why":"COBIT from ISACA."}},{"q":"أنسب رسم لعرض العلاقة بين الإنفاق على الإعلان والمبيعات:","opts":["دائري","انتشار (Scatter)","أعمدة مكدسة","جدول"],"ans":1,"why":"Scatter بيوضح العلاقة بين متغيرين.","en":{"q":"The best chart to show the relationship between advertising spend and sales:","opts":["Pie","Scatter","Stacked bar","Table"],"why":"A scatter plot shows the relationship between two variables."}}]}]},{"id":2,"title":"الجزء الثاني","enT":"Part 2","en":"Strategic Financial Management","ar":"الإدارة المالية الاستراتيجية","domains":[{"code":"2A","title":"تحليل القوائم المالية","en":"Financial Statement Analysis","weight":20,"lessons":[{"title":"التحليل الرأسي والأفقي","blocks":[["b","**التحليل الرأسي (Common-size):** كل بند في قائمة الدخل كنسبة من المبيعات، وكل بند في الميزانية كنسبة من إجمالي الأصول. مفيد للمقارنة بين شركات مختلفة الحجم."],["b","**التحليل الأفقي (Trend):** نسبة التغير من سنة لسنة أو مقارنة بسنة أساس."],["ex","مثال",["المبيعات 2025: 800,000 و 2026: 920,000. تكلفة المبيعات 2026: 598,000.","النمو الأفقي = 120,000 ÷ 800,000 = **15%**. تكلفة المبيعات رأسيًا = 598,000 ÷ 920,000 = **65%** ← هامش مجمل الربح 35%."]],["b","**حدود التحليل:** اختلاف السياسات المحاسبية، التضخم، الموسمية، البنود خارج الميزانية، التلاعب بالأرباح، وإن المتوسطات الصناعية ممكن تكون مضللة."]],"en":{"title":"Vertical and Horizontal Analysis","blocks":[["b","**Vertical (common-size) analysis:** each income statement item as a percentage of sales, and each balance sheet item as a percentage of total assets. Useful for comparing companies of different sizes."],["b","**Horizontal (trend) analysis:** percentage change year over year or relative to a base year."],["ex","Example",["Sales 2025: 800,000 and 2026: 920,000. COGS 2026: 598,000.","Horizontal growth = 120,000 ÷ 800,000 = **15%**. COGS vertically = 598,000 ÷ 920,000 = **65%** → gross margin 35%."]],["b","**Limitations:** different accounting policies, inflation, seasonality, off-balance-sheet items, earnings management, and potentially misleading industry averages."]]}},{"title":"النسب المالية","blocks":[["h3","السيولة"],["t",["النسبة","المعادلة"],[["التداول (Current)","الأصول المتداولة ÷ الالتزامات المتداولة"],["السريعة (Quick/Acid-test)","(النقدية + الاستثمارات قصيرة الأجل + المدينون) ÷ الالتزامات المتداولة"],["النقدية (Cash ratio)","(النقدية + الاستثمارات قصيرة الأجل) ÷ الالتزامات المتداولة"],["التدفق النقدي التشغيلي","التدفق من التشغيل ÷ الالتزامات المتداولة"]],[3200,6438]],["h3","النشاط"],["t",["النسبة","المعادلة"],[["دوران المدينين","صافي المبيعات الآجلة ÷ متوسط المدينين"],["أيام التحصيل DSO","365 ÷ دوران المدينين"],["دوران المخزون","تكلفة المبيعات ÷ متوسط المخزون"],["أيام المخزون DIO","365 ÷ دوران المخزون"],["دوران الدائنين","المشتريات (أو تكلفة المبيعات) ÷ متوسط الدائنين"],["أيام السداد DPO","365 ÷ دوران الدائنين"],["الدورة التشغيلية","DIO + DSO"],["دورة تحويل النقدية","DIO + DSO − DPO"]],[3200,6438]],["h3","الرفع المالي والملاءة"],["t",["النسبة","المعادلة"],[["الدين إلى حقوق الملكية","إجمالي الالتزامات ÷ حقوق الملكية"],["نسبة الدين","إجمالي الالتزامات ÷ إجمالي الأصول"],["تغطية الفوائد (TIE)","الربح قبل الفوائد والضرائب EBIT ÷ مصروف الفوائد"],["الرافعة المالية DFL","EBIT ÷ (EBIT − الفوائد)"]],[3200,6438]],["h3","الربحية والسوق"],["t",["النسبة","المعادلة"],[["هامش صافي الربح","صافي الدخل ÷ المبيعات"],["العائد على الأصول ROA","صافي الدخل ÷ متوسط إجمالي الأصول"],["العائد على حقوق الملكية ROE","صافي الدخل ÷ متوسط حقوق الملكية"],["دوبونت (3 أجزاء)","ROE = هامش الربح × دوران الأصول × مضاعف حقوق الملكية (الأصول ÷ حقوق الملكية)"],["ربحية السهم EPS","(صافي الدخل − توزيعات الممتاز) ÷ المتوسط المرجح للأسهم العادية"],["مضاعف الربحية P/E","سعر السهم ÷ EPS"],["عائد التوزيعات","التوزيع للسهم ÷ سعر السهم"],["نسبة التوزيع (Payout)","التوزيعات ÷ صافي الدخل"],["القيمة الدفترية للسهم","(حقوق الملكية − الممتاز) ÷ عدد الأسهم العادية"]],[3200,6438]],["ex","مثال متكامل",["أصول متداولة 500,000 (منها مخزون 200,000 ومصروفات مقدمة 20,000)، التزامات متداولة 250,000.","التداول = **2.0**. السريعة = (500,000 − 200,000 − 20,000) ÷ 250,000 = **1.12**.","مبيعات 2,000,000، صافي دخل 150,000، أصول 1,500,000، حقوق ملكية 750,000.","هامش 7.5% × دوران 1.333 × مضاعف 2 = **ROE 20%** (= 150,000 ÷ 750,000)."]],["exam","نقطة امتحان",["أسئلة \"أثر المعاملة على النسبة\" متكررة جدًا: مثلًا سداد دائن نقدًا لما نسبة التداول أكبر من 1 ← النسبة **تزيد**. ولو أقل من 1 ← **تقل**. جرّب بأرقام صغيرة لو اتلخبطت."]]],"en":{"title":"Financial Ratios","blocks":[["h3","Liquidity"],["t",["Ratio","Formula"],[["Current ratio","Current assets ÷ current liabilities"],["Quick (acid-test) ratio","(Cash + marketable securities + receivables) ÷ current liabilities"],["Cash ratio","(Cash + marketable securities) ÷ current liabilities"],["Operating cash flow ratio","Cash flow from operations ÷ current liabilities"]]],["h3","Activity"],["t",["Ratio","Formula"],[["Receivables turnover","Net credit sales ÷ average receivables"],["Days sales outstanding (DSO)","365 ÷ receivables turnover"],["Inventory turnover","COGS ÷ average inventory"],["Days inventory outstanding (DIO)","365 ÷ inventory turnover"],["Payables turnover","Purchases (or COGS) ÷ average payables"],["Days payables outstanding (DPO)","365 ÷ payables turnover"],["Operating cycle","DIO + DSO"],["Cash conversion cycle","DIO + DSO − DPO"]]],["h3","Leverage and solvency"],["t",["Ratio","Formula"],[["Debt-to-equity","Total liabilities ÷ equity"],["Debt ratio","Total liabilities ÷ total assets"],["Times interest earned (TIE)","EBIT ÷ interest expense"],["Degree of financial leverage (DFL)","EBIT ÷ (EBIT − interest)"]]],["h3","Profitability and market"],["t",["Ratio","Formula"],[["Net profit margin","Net income ÷ sales"],["Return on assets (ROA)","Net income ÷ average total assets"],["Return on equity (ROE)","Net income ÷ average equity"],["DuPont (3-part)","ROE = profit margin × asset turnover × equity multiplier (assets ÷ equity)"],["Earnings per share (EPS)","(Net income − preferred dividends) ÷ weighted-average common shares"],["Price/earnings (P/E)","Share price ÷ EPS"],["Dividend yield","Dividend per share ÷ share price"],["Payout ratio","Dividends ÷ net income"],["Book value per share","(Equity − preferred) ÷ common shares outstanding"]]],["ex","Integrated example",["Current assets 500,000 (including inventory 200,000 and prepaid expenses 20,000), current liabilities 250,000.","Current ratio = **2.0**. Quick ratio = (500,000 − 200,000 − 20,000) ÷ 250,000 = **1.12**.","Sales 2,000,000, net income 150,000, assets 1,500,000, equity 750,000.","Margin 7.5% × turnover 1.333 × multiplier 2 = **ROE 20%** (= 150,000 ÷ 750,000)."]],["exam","Exam point",["\"Effect of a transaction on a ratio\" questions are very common: e.g., paying a payable in cash when the current ratio is above 1 → the ratio **increases**. If it is below 1 → it **decreases**. Test with small numbers if unsure."]]]}},{"title":"تحليل الربحية وجودة الأرباح وقضايا خاصة","blocks":[["b","**جودة الأرباح:** الأرباح عالية الجودة متكررة ومدعومة بتدفق نقدي. علامات الخطر: نمو الربح أسرع كتير من التدفق النقدي التشغيلي، تغيير السياسات المحاسبية، الاعتماد على بنود غير متكررة."],["b","**أثر التضخم:** الأصول بالتكلفة التاريخية بتقلل الإهلاك فالربح يبان أعلى من الحقيقي."],["b","**أثر العملة:** شركة تابعة أجنبية عملتها انخفضت ← الإيرادات المترجمة تقل. الترجمة بطريقة سعر الإقفال تروح فروقها للدخل الشامل الآخر."],["b","**البنود خارج الميزانية:** التزامات محتملة، كفالات، شركات ذات غرض خاص. لازم تتعدل علشان المقارنة."],["b","**أثر US GAAP مقابل IFRS على النسب:** مثلًا LIFO في US GAAP بتقلل المخزون فتزود دوران المخزون، وإعادة التقييم في IFRS بتزود الأصول وحقوق الملكية فتقلل ROA."],["b","**تحليل الإيراد:** فصل أثر السعر عن أثر الكمية وأثر المزيج."]],"en":{"title":"Profitability Analysis, Earnings Quality, and Special Issues","blocks":[["b","**Earnings quality:** high-quality earnings are recurring and supported by cash flow. Red flags: profit growing much faster than operating cash flow, changes in accounting policies, reliance on non-recurring items."],["b","**Inflation effects:** assets at historical cost understate depreciation, so profit looks higher than it really is."],["b","**Currency effects:** if a foreign subsidiary’s currency weakens, translated revenues fall. Translation differences under the current-rate method go to OCI."],["b","**Off-balance-sheet items:** contingent liabilities, guarantees, special-purpose entities. Adjust for them to compare fairly."],["b","**US GAAP vs IFRS effects on ratios:** e.g., LIFO under US GAAP lowers inventory, increasing inventory turnover; revaluation under IFRS raises assets and equity, lowering ROA."],["b","**Revenue analysis:** separate the price effect from the volume effect and the mix effect."]]}}],"mcqs":[{"q":"أصول متداولة 600,000 (منها مخزون 250,000)، التزامات متداولة 300,000. النسبة السريعة (بافتراض لا مصروفات مقدمة):","opts":["2.0","1.17","0.83","1.5"],"ans":1,"why":"(600,000 − 250,000) ÷ 300,000 = 1.17.","en":{"q":"Current assets 600,000 (inventory 250,000), current liabilities 300,000. Quick ratio (assume no prepaids):","opts":["2.0","1.17","0.83","1.5"],"why":"(600,000 − 250,000) ÷ 300,000 = 1.17."}},{"q":"نسبة التداول 1.5. الشركة سددت دائن نقدًا. النسبة:","opts":["تزيد","تقل","لا تتغير","تساوي 1"],"ans":0,"why":"مثال: 150/100 ← بعد سداد 20: 130/80 = 1.625.","en":{"q":"The current ratio is 1.5. The company pays a payable in cash. The ratio:","opts":["Increases","Decreases","Does not change","Equals 1"],"why":"Example: 150/100 → after paying 20: 130/80 = 1.625."}},{"q":"DIO = 60 يوم، DSO = 45، DPO = 30. دورة تحويل النقدية:","opts":["135","75","105","15"],"ans":1,"why":"60 + 45 − 30 = 75 يوم.","en":{"q":"DIO = 60 days, DSO = 45, DPO = 30. The cash conversion cycle is:","opts":["135","75","105","15"],"why":"60 + 45 − 30 = 75 days."}},{"q":"هامش الربح 5%، دوران الأصول 2، الأصول ÷ حقوق الملكية = 2.5. العائد على حقوق الملكية:","opts":["10%","25%","12.5%","20%"],"ans":1,"why":"5% × 2 × 2.5 = 25%.","en":{"q":"Profit margin 5%, asset turnover 2, assets ÷ equity = 2.5. Return on equity:","opts":["10%","25%","12.5%","20%"],"why":"5% × 2 × 2.5 = 25%."}},{"q":"صافي الدخل 500,000، توزيعات ممتاز 50,000، متوسط الأسهم العادية 150,000. ربحية السهم:","opts":["3.33","3.00","3.67","2.50"],"ans":1,"why":"(500,000 − 50,000) ÷ 150,000 = 3.00.","en":{"q":"Net income 500,000, preferred dividends 50,000, weighted-average common shares 150,000. EPS:","opts":["3.33","3.00","3.67","2.50"],"why":"(500,000 − 50,000) ÷ 150,000 = 3.00."}},{"q":"EBIT = 400,000 والفوائد 80,000. نسبة تغطية الفوائد:","opts":["4","5","0.2","3.2"],"ans":1,"why":"400,000 ÷ 80,000 = 5 مرات.","en":{"q":"EBIT = 400,000 and interest = 80,000. Times interest earned:","opts":["4","5","0.2","3.2"],"why":"400,000 ÷ 80,000 = 5 times."}},{"q":"أي مؤشر يدل على جودة أرباح منخفضة؟","opts":["تدفق نقدي تشغيلي أعلى من صافي الدخل","نمو كبير في الربح مع تدفق نقدي تشغيلي ثابت أو أقل","أرباح متكررة","سياسات محاسبية متحفظة"],"ans":1,"why":"الربح غير مدعوم بنقدية، وده ممكن يدل على استحقاقات مبالغ فيها.","en":{"q":"Which indicates low earnings quality?","opts":["Operating cash flow higher than net income","Large profit growth with flat or lower operating cash flow","Recurring earnings","Conservative accounting policies"],"why":"Profit not backed by cash may indicate aggressive accruals."}}]},{"code":"2B","title":"تمويل الشركات","en":"Corporate Finance","weight":20,"lessons":[{"title":"العائد والمخاطرة و CAPM","blocks":[["b","**العائد المتوقع** = Σ (الاحتمال × العائد)."],["b","**الانحراف المعياري:** مقياس المخاطرة الكلية. **معامل الاختلاف (CV)** = الانحراف المعياري ÷ العائد المتوقع (مخاطرة لكل وحدة عائد، مفيد للمقارنة)."],["b","**المخاطرة المنتظمة (Systematic):** مخاطرة السوق، مش بتتشال بالتنويع، وبيقيسها **بيتا β**. **غير المنتظمة:** خاصة بالشركة وبتتشال بالتنويع."],["b","**CAPM:** العائد المطلوب = **Rf + β × (Rm − Rf)**."],["ex","مثال",["معدل خالي المخاطرة 4%، عائد السوق 10%، بيتا السهم 1.3.","العائد المطلوب = 4% + 1.3 × 6% = **11.8%**.","بيتا = 1 يعني السهم بيتحرك زي السوق، وأكبر من 1 يعني أكثر تقلبًا."]]],"en":{"title":"Risk, Return, and CAPM","blocks":[["b","**Expected return** = Σ (probability × return)."],["b","**Standard deviation:** measures total risk. **Coefficient of variation (CV)** = standard deviation ÷ expected return (risk per unit of return; useful for comparison)."],["b","**Systematic risk:** market risk that cannot be diversified away, measured by **beta β**. **Unsystematic risk:** firm-specific and diversifiable."],["b","**CAPM:** required return = **Rf + β × (Rm − Rf)**."],["ex","Example",["Risk-free rate 4%, market return 10%, stock beta 1.3.","Required return = 4% + 1.3 × 6% = **11.8%**.","Beta = 1 means the stock moves with the market; above 1 means more volatile."]]]}},{"title":"تقييم الأوراق المالية وتكلفة رأس المال","blocks":[["h3","تقييم السندات"],["b","سعر السند = القيمة الحالية للكوبونات + القيمة الحالية لقيمة الاسترداد، مخصومين بسعر السوق."],["b","لو سعر السوق > الكوبون ← السند بخصم. لو أقل ← بعلاوة. **العلاقة عكسية بين أسعار الفائدة وسعر السند**، والمدة الأطول تعني حساسية أكبر."],["ex","مثال",["سند قيمته 1,000، كوبون 6% سنوي، 5 سنين، وسعر السوق 8%.","السعر ≈ 60 × 3.9927 + 1,000 × 0.6806 = **920** (بخصم)."]],["h3","تقييم الأسهم"],["b","**نموذج جوردون (نمو ثابت):** P0 = D1 ÷ (r − g)، مع D1 = D0 × (1 + g)."],["b","السهم الممتاز: P = التوزيع ÷ العائد المطلوب."],["ex","مثال",["آخر توزيع 2.00، النمو 5%، العائد المطلوب 12%.","D1 = 2.10 ← السعر = 2.10 ÷ 0.07 = **30**."]],["h3","تكلفة رأس المال"],["t",["المصدر","التكلفة"],[["الدين","العائد حتى الاستحقاق × (1 − معدل الضريبة)"],["السهم الممتاز","التوزيع ÷ صافي متحصلات الإصدار"],["الأرباح المحتجزة","CAPM أو (D1 ÷ P0) + g"],["أسهم عادية جديدة","(D1 ÷ صافي المتحصلات بعد تكاليف الإصدار) + g"]],[3000,6638]],["ex","مثال WACC",["الهيكل بالقيمة السوقية: دين 40% بتكلفة قبل الضريبة 8%، ممتاز 10% بتكلفة 9%، عادي 50% بتكلفة 14%. الضريبة 25%.","تكلفة الدين بعد الضريبة = 6%.","WACC = 0.4 × 6% + 0.1 × 9% + 0.5 × 14% = 2.4% + 0.9% + 7% = **10.3%**.","الأوزان بالقيمة **السوقية** المستهدفة مش الدفترية."]]],"en":{"title":"Valuing Securities and Cost of Capital","blocks":[["h3","Bond valuation"],["b","Bond price = PV of coupons + PV of face value, discounted at the market rate."],["b","Market rate > coupon → bond sells at a discount. Market rate < coupon → at a premium. **Interest rates and bond prices move inversely**, and longer maturity means greater sensitivity."],["ex","Example",["Bond face 1,000, 6% annual coupon, 5 years, market rate 8%.","Price ≈ 60 × 3.9927 + 1,000 × 0.6806 = **920** (discount)."]],["h3","Stock valuation"],["b","**Gordon (constant growth) model:** P0 = D1 ÷ (r − g), where D1 = D0 × (1 + g)."],["b","Preferred stock: P = dividend ÷ required return."],["ex","Example",["Last dividend 2.00, growth 5%, required return 12%.","D1 = 2.10 → price = 2.10 ÷ 0.07 = **30**."]],["h3","Cost of capital"],["t",["Source","Cost"],[["Debt","Yield to maturity × (1 − tax rate)"],["Preferred stock","Dividend ÷ net issuance proceeds"],["Retained earnings","CAPM or (D1 ÷ P0) + g"],["New common stock","(D1 ÷ net proceeds after flotation costs) + g"]]],["ex","WACC example",["Market-value structure: debt 40% at 8% pre-tax, preferred 10% at 9%, common 50% at 14%. Tax rate 25%.","After-tax cost of debt = 6%.","WACC = 0.4 × 6% + 0.1 × 9% + 0.5 × 14% = 2.4% + 0.9% + 7% = **10.3%**.","Weights are based on target **market** values, not book values."]]]}},{"title":"جمع رأس المال وسياسة التوزيعات","blocks":[["b","**الطرح العام الأولي (IPO)** عن طريق بنك استثمار (اكتتاب بتعهد ثابت أو بأفضل جهد)، أو **الطرح الخاص** لعدد محدود من المستثمرين (أسرع وأقل تكلفة)."],["b","**الاقتراض طويل الأجل:** السندات، والقيود (Covenants)، وإمكانية الاستدعاء (Callable)، والتحويل لأسهم (Convertible)."],["b","**التأجير** كبديل للشراء."],["h3","سياسة التوزيعات"],["b","نظريات: عدم الأثر (Modigliani-Miller)، عصفور في اليد، الأثر الضريبي، المحتوى المعلوماتي (Signaling)، أثر العملاء (Clientele)."],["b","سياسات: توزيع ثابت مستقر، نسبة ثابتة من الأرباح، التوزيع المتبقي (Residual) بعد تمويل المشاريع."],["b","**توزيعات الأسهم وتجزئة الأسهم:** مالهاش أثر على إجمالي حقوق الملكية. **إعادة شراء الأسهم:** بتقلل عدد الأسهم فتزود EPS."],["b","**التواريخ:** الإعلان (يتسجل الالتزام) ← الاستحقاق بدون توزيع (Ex-dividend) ← التسجيل ← الدفع."]],"en":{"title":"Raising Capital and Dividend Policy","blocks":[["b","**Initial public offering (IPO)** through an investment bank (firm commitment or best efforts), or a **private placement** with a small number of investors (faster and cheaper)."],["b","**Long-term debt:** bonds, covenants, callable features, convertibles."],["b","**Leasing** as an alternative to buying."],["h3","Dividend policy"],["b","Theories: dividend irrelevance (Modigliani-Miller), bird-in-the-hand, tax preference, signaling (information content), clientele effect."],["b","Policies: stable dividend, constant payout ratio, residual dividend after funding projects."],["b","**Stock dividends and stock splits:** no effect on total equity. **Share repurchases:** reduce shares outstanding and increase EPS."],["b","**Dates:** declaration (liability recorded) → ex-dividend → record → payment."]]}},{"title":"إدارة رأس المال العامل","blocks":[["h3","النقدية"],["b","تسريع المتحصلات: صناديق البريد (Lockbox)، التحويلات الإلكترونية. إبطاء المدفوعات: الاستفادة من الـ Float في حدود الأخلاقيات."],["b","العائد من Lockbox: الأيام الموفرة × المتحصلات اليومية × معدل الفائدة − تكلفة الخدمة."],["h3","المدينين وتكلفة عدم الاستفادة من الخصم"],["ex","مثال: شروط 2/10, net 30",["تكلفة عدم أخذ الخصم = [2% ÷ (100% − 2%)] × [365 ÷ (30 − 10)] = 2.04% × 18.25 = **37.2% سنويًا**.","يعني لو تقدر تقترض بأقل من 37% الأحسن تاخد الخصم."]],["h3","المخزون: الكمية الاقتصادية للطلب"],["ex","مثال EOQ",["الطلب السنوي 40,000 وحدة، تكلفة الطلبية 50، تكلفة الاحتفاظ بالوحدة 4 سنويًا.","EOQ = √(2 × 40,000 × 50 ÷ 4) = √1,000,000 = **1,000 وحدة** ← 40 طلبية في السنة.","**نقطة إعادة الطلب** = (الاستخدام اليومي × فترة التوريد) + مخزون الأمان."]],["h3","التمويل قصير الأجل"],["b","الائتمان التجاري، القروض البنكية، الأوراق التجارية (Commercial paper)، تخصيم المدينين."],["ex","مثال: الفائدة الفعلية مع رصيد معوّض",["قرض 100,000 بفائدة 10%، والبنك شارط رصيد معوّض 20% (الشركة عادة مش محتفظة برصيد).","الفائدة الفعلية = 10,000 ÷ 80,000 = **12.5%**.","لو القرض بخصم مقدم (Discounted loan): 10,000 ÷ 90,000 = 11.1%."]]],"en":{"title":"Working Capital Management","blocks":[["h3","Cash"],["b","Speed up collections: lockboxes, electronic transfers. Slow down disbursements: use float within ethical limits."],["b","Lockbox benefit: days saved × daily collections × interest rate − service cost."],["h3","Receivables and the cost of forgoing a discount"],["ex","Example: terms 2/10, net 30",["Cost of not taking the discount = [2% ÷ (100% − 2%)] × [365 ÷ (30 − 10)] = 2.04% × 18.25 = **37.2% annually**.","If you can borrow at less than 37%, take the discount."]],["h3","Inventory: economic order quantity"],["ex","EOQ example",["Annual demand 40,000 units, ordering cost 50 per order, carrying cost 4 per unit per year.","EOQ = √(2 × 40,000 × 50 ÷ 4) = √1,000,000 = **1,000 units** → 40 orders per year.","**Reorder point** = (daily usage × lead time) + safety stock."]],["h3","Short-term financing"],["b","Trade credit, bank loans, commercial paper, factoring receivables."],["ex","Example: effective rate with a compensating balance",["Loan 100,000 at 10%, with a 20% compensating balance (the company does not normally hold this balance).","Effective rate = 10,000 ÷ 80,000 = **12.5%**.","If it is a discounted loan: 10,000 ÷ 90,000 = 11.1%."]]]}},{"title":"إعادة الهيكلة والتمويل الدولي","blocks":[["b","**الاندماج والاستحواذ:** أفقي (نفس الصناعة)، رأسي (مورد أو عميل)، متنوع. الهدف: **التآزر (Synergy)** يعني قيمة الكيان المدمج أكبر من مجموع القيمتين."],["b","**وسائل الدفاع ضد الاستحواذ العدائي:** حبة السم (Poison pill)، المظلة الذهبية، الفارس الأبيض."],["b","**التصفية الجزئية (Divestiture)**، **الانفصال (Spin-off)** بتوزيع أسهم الوحدة على المساهمين، **الإفلاس وإعادة التنظيم**."],["h3","التمويل الدولي"],["b","سعر الصرف: مباشر وغير مباشر، فوري وآجل. **العلاوة/الخصم الآجل** بيعكس فرق الفائدة بين البلدين (تعادل أسعار الفائدة)."],["b","مخاطر العملة: مخاطر المعاملات، الترجمة، الاقتصادية. التحوط بالعقود الآجلة، المستقبليات، الخيارات، المبادلات."],["b","وسائل الدفع الدولية: الاعتماد المستندي (Letter of credit)، بوالص التحصيل."],["ex","مثال تحوط",["شركة أمريكية هتدفع 1,000,000 يورو بعد 3 شهور. السعر الآجل 1.10 دولار لليورو.","لو اشترت عقد آجل تثبّت التكلفة عند **1,100,000 دولار** مهما اتغير السعر الفوري."]]],"en":{"title":"Corporate Restructuring and International Finance","blocks":[["b","**Mergers and acquisitions:** horizontal (same industry), vertical (supplier or customer), conglomerate. The goal is **synergy**: the combined entity is worth more than the sum of the parts."],["b","**Takeover defenses:** poison pill, golden parachute, white knight."],["b","**Divestiture**, **spin-off** (distributing the unit’s shares to shareholders), **bankruptcy and reorganization**."],["h3","International finance"],["b","Exchange rates: direct and indirect quotes, spot and forward. The **forward premium/discount** reflects the interest rate differential (interest rate parity)."],["b","Currency risks: transaction, translation, economic. Hedge with forwards, futures, options, swaps."],["b","International payment methods: letters of credit, documentary collections."],["ex","Hedging example",["A US company will pay 1,000,000 euros in 3 months. The forward rate is 1.10 dollars per euro.","Buying a forward contract locks the cost at **1,100,000 dollars** regardless of the spot rate."]]]}}],"mcqs":[{"q":"Rf = 3%، عائد السوق 9%، بيتا 1.5. العائد المطلوب بنموذج CAPM:","opts":["13.5%","12%","16.5%","9%"],"ans":1,"why":"3% + 1.5 × 6% = 12%.","en":{"q":"Rf = 3%, market return 9%, beta 1.5. The required return under CAPM:","opts":["13.5%","12%","16.5%","9%"],"why":"3% + 1.5 × 6% = 12%."}},{"q":"سهم آخر توزيع له 3.00، النمو 4%، العائد المطلوب 10%. سعره:","opts":["50.00","52.00","30.00","75.00"],"ans":1,"why":"D1 = 3.12 ← 3.12 ÷ 0.06 = 52.","en":{"q":"A stock’s last dividend was 3.00, growth 4%, required return 10%. Its price:","opts":["50.00","52.00","30.00","75.00"],"why":"D1 = 3.12 → 3.12 ÷ 0.06 = 52."}},{"q":"تكلفة الدين قبل الضريبة 9% ومعدل الضريبة 30%. تكلفة الدين بعد الضريبة:","opts":["9%","6.3%","2.7%","11.7%"],"ans":1,"why":"9% × (1 − 0.3) = 6.3%.","en":{"q":"Pre-tax cost of debt 9% and tax rate 30%. After-tax cost of debt:","opts":["9%","6.3%","2.7%","11.7%"],"why":"9% × (1 − 0.3) = 6.3%."}},{"q":"لو ارتفع سعر الفائدة في السوق فوق كوبون السند:","opts":["يتباع بعلاوة","يتباع بخصم","يتباع بالقيمة الاسمية","لا أثر"],"ans":1,"why":"العلاقة عكسية بين سعر الفائدة وسعر السند.","en":{"q":"If the market interest rate rises above a bond’s coupon rate:","opts":["It sells at a premium","It sells at a discount","It sells at par","No effect"],"why":"Interest rates and bond prices move inversely."}},{"q":"شروط 1/10, net 40. التكلفة السنوية التقريبية لعدم أخذ الخصم (365 يوم):","opts":["12.3%","24.3%","9.1%","36.5%"],"ans":0,"why":"(1/99) × (365/30) = 1.01% × 12.17 = 12.3%.","en":{"q":"Terms 1/10, net 40. The approximate annual cost of not taking the discount (365 days):","opts":["12.3%","24.3%","9.1%","36.5%"],"why":"(1/99) × (365/30) = 1.01% × 12.17 = 12.3%."}},{"q":"طلب سنوي 18,000، تكلفة الطلبية 40، تكلفة الاحتفاظ 4. الكمية الاقتصادية:","opts":["600","424","800","300"],"ans":0,"why":"√(2 × 18,000 × 40 ÷ 4) = √360,000 = 600.","en":{"q":"Annual demand 18,000, ordering cost 40, carrying cost 4. EOQ:","opts":["600","424","800","300"],"why":"√(2 × 18,000 × 40 ÷ 4) = √360,000 = 600."}},{"q":"أي مخاطرة لا يمكن تقليلها بالتنويع؟","opts":["مخاطر خاصة بالشركة","المخاطر المنتظمة (السوق)","مخاطر الإدارة","مخاطر المنتج"],"ans":1,"why":"Systematic risk ويقيسها بيتا.","en":{"q":"Which risk cannot be reduced by diversification?","opts":["Firm-specific risk","Systematic (market) risk","Management risk","Product risk"],"why":"Systematic risk, measured by beta."}},{"q":"قرض 200,000 بفائدة 8% ورصيد معوض 15% غير محتفظ به أصلًا. الفائدة الفعلية:","opts":["8%","9.41%","9.2%","6.8%"],"ans":1,"why":"16,000 ÷ 170,000 = 9.41%.","en":{"q":"A 200,000 loan at 8% with a 15% compensating balance not otherwise held. Effective rate:","opts":["8%","9.41%","9.2%","6.8%"],"why":"16,000 ÷ 170,000 = 9.41%."}},{"q":"دين 30% بتكلفة بعد الضريبة 5%، وحقوق ملكية 70% بتكلفة 12%. WACC:","opts":["8.5%","9.9%","8.9%","17%"],"ans":1,"why":"1.5% + 8.4% = 9.9%.","en":{"q":"Debt 30% at an after-tax cost of 5% and equity 70% at 12%. WACC:","opts":["8.5%","9.9%","8.9%","17%"],"why":"1.5% + 8.4% = 9.9%."}}]},{"code":"2C","title":"تحليل القرارات","en":"Decision Analysis","weight":25,"lessons":[{"title":"تحليل التكلفة والحجم والربح (CVP)","blocks":[["t",["المفهوم","المعادلة"],[["هامش المساهمة للوحدة","السعر − التكلفة المتغيرة"],["نسبة هامش المساهمة","هامش المساهمة ÷ السعر"],["نقطة التعادل بالوحدات","التكاليف الثابتة ÷ هامش المساهمة للوحدة"],["نقطة التعادل بالقيمة","التكاليف الثابتة ÷ نسبة هامش المساهمة"],["الوحدات لربح مستهدف","(الثابتة + الربح المستهدف قبل الضريبة) ÷ هامش الوحدة"],["الربح قبل الضريبة من بعدها","الربح بعد الضريبة ÷ (1 − معدل الضريبة)"],["هامش الأمان","المبيعات الفعلية − مبيعات التعادل"],["درجة الرفع التشغيلي DOL","هامش المساهمة ÷ الربح التشغيلي"]],[3400,6238]],["ex","مثال",["السعر 50، التكلفة المتغيرة 30، الثابتة 200,000، الضريبة 25%.","هامش الوحدة 20 ← التعادل = **10,000 وحدة** (= 500,000 قيمة بنسبة 40%).","ربح مستهدف بعد الضريبة 60,000 ← قبل الضريبة 80,000 ← (200,000 + 80,000) ÷ 20 = **14,000 وحدة**.","لو المبيعات 14,000 وحدة: هامش الأمان = 4,000 وحدة (28.6%)، و DOL = 280,000 ÷ 80,000 = **3.5** ← زيادة المبيعات 10% تزود الربح 35%."]],["h3","منتجات متعددة"],["ex","مثال المزيج",["منتجين A و B بنسبة 3 : 2. هامش A = 10 وهامش B = 15، والتكاليف الثابتة 120,000.","هامش \"الحزمة\" = 3 × 10 + 2 × 15 = 60 ← التعادل = 2,000 حزمة = **6,000 من A و 4,000 من B**."]]],"en":{"title":"Cost-Volume-Profit (CVP) Analysis","blocks":[["t",["Concept","Formula"],[["Unit contribution margin","Price − variable cost"],["Contribution margin ratio","Contribution margin ÷ price"],["Breakeven in units","Fixed costs ÷ unit contribution margin"],["Breakeven in dollars","Fixed costs ÷ contribution margin ratio"],["Units for target profit","(Fixed costs + pre-tax target profit) ÷ unit CM"],["Pre-tax profit from after-tax","After-tax profit ÷ (1 − tax rate)"],["Margin of safety","Actual sales − breakeven sales"],["Degree of operating leverage (DOL)","Contribution margin ÷ operating income"]]],["ex","Example",["Price 50, variable cost 30, fixed costs 200,000, tax rate 25%.","Unit CM 20 → breakeven = **10,000 units** (= 500,000 in dollars at a 40% CM ratio).","After-tax target profit 60,000 → pre-tax 80,000 → (200,000 + 80,000) ÷ 20 = **14,000 units**.","At sales of 14,000 units: margin of safety = 4,000 units (28.6%), and DOL = 280,000 ÷ 80,000 = **3.5** → a 10% sales increase raises profit by 35%."]],["h3","Multiple products"],["ex","Sales mix example",["Products A and B in a 3 : 2 ratio. A’s CM = 10 and B’s CM = 15; fixed costs 120,000.","CM per \"bundle\" = 3 × 10 + 2 × 15 = 60 → breakeven = 2,000 bundles = **6,000 of A and 4,000 of B**."]]]}},{"title":"التحليل الحدي: القرارات قصيرة الأجل","blocks":[["p","القاعدة الذهبية: **التكلفة الملائمة** هي التكلفة المستقبلية اللي **بتختلف** بين البدائل. التكاليف الغارقة (Sunk) مش ملائمة أبدًا، وتكلفة الفرصة البديلة ملائمة."],["h3","الطلبية الخاصة (Special order)"],["ex","مثال",["طاقة 100,000 وحدة، الإنتاج الحالي 80,000. السعر العادي 40، التكلفة المتغيرة 22، الثابتة للوحدة 8.","عميل عاوز 15,000 وحدة بـ 25.","في **طاقة عاطلة** ← الملائم المتغيرة بس: 15,000 × (25 − 22) = **ربح إضافي 45,000** ← اقبل (الثابتة مش هتتغير).","لو العميل عاوز **30,000** وحدة: هنضحي بـ 10,000 وحدة من المبيعات العادية بهامش 18 ← تكلفة الفرصة 180,000. العائد: 30,000 × 3 = 90,000 − 180,000 = **خسارة 90,000** ← ارفض."]],["h3","التصنيع أو الشراء (Make or buy)"],["ex","مثال",["تكلفة تصنيع جزء: مواد 10، أجور 8، غ.م.ص متغيرة 4، ثابتة موزعة 6 = 28. المورد بيبيعه بـ 25.","لو الثابتة مش هتتوفر: تكلفة التصنيع الملائمة = **22** < 25 ← **صنّع**.","لو 2 من الثابتة هتتوفر (مشرف هيتلغي): الملائم = 24 < 25 ← لسه صنّع. لو الطاقة ممكن تتأجر بربح 4 للوحدة: 24 + 4 = 28 > 25 ← **اشتري**."]],["h3","الإبقاء على قطاع أو إلغاؤه"],["b","لو هامش المساهمة اللي هيضيع أكبر من التكاليف الثابتة اللي هتتوفر فعلًا ← أبقِ عليه. التكاليف المشتركة الموزعة مش هتختفي."],["h3","الموارد المحدودة"],["b","لما يكون فيه قيد (ساعات آلات مثلًا): رتب المنتجات حسب **هامش المساهمة لكل وحدة من المورد المحدود**، مش هامش الوحدة."],["ex","مثال",["المنتج X هامشه 30 ويحتاج 3 ساعات (10 للساعة). المنتج Y هامشه 20 ويحتاج ساعة (20 للساعة).","ابدأ بـ **Y** رغم إن هامش وحدته أقل."]]],"en":{"title":"Marginal Analysis: Short-term Decisions","blocks":[["p","The golden rule: a **relevant cost** is a future cost that **differs** between alternatives. Sunk costs are never relevant; opportunity costs are relevant."],["h3","Special order"],["ex","Example",["Capacity 100,000 units; current production 80,000. Regular price 40, variable cost 22, fixed cost per unit 8.","A customer wants 15,000 units at 25.","With **idle capacity** → only variable costs are relevant: 15,000 × (25 − 22) = **additional profit 45,000** → accept (fixed costs will not change).","If the customer wants **30,000** units: we give up 10,000 regular units at a margin of 18 → opportunity cost 180,000. Gain: 30,000 × 3 = 90,000 − 180,000 = **loss of 90,000** → reject."]],["h3","Make or buy"],["ex","Example",["Cost to make a part: materials 10, labor 8, variable overhead 4, allocated fixed 6 = 28. A supplier sells it for 25.","If fixed costs will not be avoided: relevant cost to make = **22** < 25 → **make**.","If 2 of the fixed costs are avoidable (a supervisor is eliminated): relevant = 24 < 25 → still make. If the capacity can be rented out for a profit of 4 per unit: 24 + 4 = 28 > 25 → **buy**."]],["h3","Keep or drop a segment"],["b","If the contribution margin lost exceeds the fixed costs actually avoided → keep it. Allocated common costs will not disappear."],["h3","Limited resources"],["b","With a constraint (e.g., machine hours): rank products by **contribution margin per unit of the constrained resource**, not by unit CM."],["ex","Example",["Product X has CM 30 and needs 3 hours (10 per hour). Product Y has CM 20 and needs 1 hour (20 per hour).","Start with **Y** even though its unit margin is lower."]]]}},{"title":"التسعير","blocks":[["b","**التكلفة زائد هامش (Cost-plus):** السعر = التكلفة × (1 + نسبة الإضافة). بسيط لكنه بيتجاهل الطلب والمنافسة."],["b","**التكلفة المستهدفة (Target costing):** التكلفة المستهدفة = السعر السوقي − الربح المطلوب. لو التكلفة الحالية أعلى ← نعيد التصميم (الهندسة القيمية)."],["ex","مثال",["سعر السوق 120، والشركة عايزة هامش 25% من السعر.","التكلفة المستهدفة = 120 − 30 = **90**. لو التكلفة الحالية 100 يبقى محتاجين تخفيض 10."]],["b","**مرونة الطلب السعرية** = % التغير في الكمية ÷ % التغير في السعر. أكبر من 1 (مرن): تخفيض السعر يزود الإيراد. أقل من 1 (غير مرن): رفع السعر يزود الإيراد."],["b","**هياكل السوق:** منافسة كاملة (الشركة متلقية للسعر)، احتكار، احتكار القلة، المنافسة الاحتكارية."],["b","**تسعير مراحل حياة المنتج:** قشط السوق (Skimming) بسعر عالي في البداية، أو التغلغل (Penetration) بسعر منخفض لكسب حصة."],["b","**قيود قانونية:** التسعير الافتراسي، التمييز السعري، التلاعب بالعطاءات، الإغراق."]],"en":{"title":"Pricing","blocks":[["b","**Cost-plus pricing:** price = cost × (1 + markup). Simple, but ignores demand and competition."],["b","**Target costing:** target cost = market price − required profit. If current cost is higher → redesign (value engineering)."],["ex","Example",["Market price 120, and the company wants a margin of 25% of price.","Target cost = 120 − 30 = **90**. If current cost is 100, a reduction of 10 is needed."]],["b","**Price elasticity of demand** = % change in quantity ÷ % change in price. Greater than 1 (elastic): cutting price increases revenue. Less than 1 (inelastic): raising price increases revenue."],["b","**Market structures:** perfect competition (price taker), monopoly, oligopoly, monopolistic competition."],["b","**Product life-cycle pricing:** skimming (high initial price) or penetration (low price to gain share)."],["b","**Legal constraints:** predatory pricing, price discrimination, bid rigging, dumping."]]}}],"mcqs":[{"q":"السعر 80، المتغيرة 50، الثابتة 300,000. نقطة التعادل بالوحدات:","opts":["6,000","10,000","3,750","12,000"],"ans":1,"why":"300,000 ÷ 30 = 10,000.","en":{"q":"Price 80, variable cost 50, fixed costs 300,000. Breakeven in units:","opts":["6,000","10,000","3,750","12,000"],"why":"300,000 ÷ 30 = 10,000."}},{"q":"من السؤال السابق، كم وحدة لتحقيق ربح بعد الضريبة 90,000 بضريبة 25%؟","opts":["13,000","14,000","12,000","16,000"],"ans":1,"why":"قبل الضريبة 120,000 ← (300,000 + 120,000) ÷ 30 = 14,000.","en":{"q":"From the previous question, how many units for an after-tax profit of 90,000 at a 25% tax rate?","opts":["13,000","14,000","12,000","16,000"],"why":"Pre-tax 120,000 → (300,000 + 120,000) ÷ 30 = 14,000."}},{"q":"هامش المساهمة 500,000 والربح التشغيلي 125,000. لو زادت المبيعات 8% يزيد الربح:","opts":["8%","32%","4%","25%"],"ans":1,"why":"DOL = 4 ← 4 × 8% = 32%.","en":{"q":"Contribution margin 500,000 and operating income 125,000. If sales rise 8%, profit rises:","opts":["8%","32%","4%","25%"],"why":"DOL = 4 → 4 × 8% = 32%."}},{"q":"في قرار طلبية خاصة مع طاقة عاطلة، أي تكلفة غير ملائمة؟","opts":["المواد المباشرة","عمولة بيع خاصة بالطلبية","التكاليف الثابتة الموزعة على المصنع","الشحن الإضافي"],"ans":2,"why":"مش هتتغير بقبول الطلبية.","en":{"q":"In a special order decision with idle capacity, which cost is irrelevant?","opts":["Direct materials","A special sales commission for the order","Allocated factory fixed costs","Additional shipping"],"why":"They will not change if the order is accepted."}},{"q":"التكلفة الملائمة للتصنيع 34 للوحدة، والشراء بـ 36، والطاقة لو اتفضت تتأجر بـ 30,000 لـ 10,000 وحدة. القرار:","opts":["صنّع بوفر 20,000","اشتري بوفر 10,000","لا فرق","صنّع بوفر 2"],"ans":1,"why":"التصنيع: 340,000 + 30,000 فرصة = 370,000. الشراء: 360,000 ← الشراء أوفر بـ 10,000.","en":{"q":"Relevant cost to make is 34 per unit, the purchase price is 36, and the freed capacity can be rented for 30,000 for 10,000 units. Decision:","opts":["Make, saving 20,000","Buy, saving 10,000","Indifferent","Make, saving 2"],"why":"Make: 340,000 + 30,000 opportunity cost = 370,000. Buy: 360,000 → buying saves 10,000."}},{"q":"سعر السوق 200 والربح المطلوب 30% من السعر. التكلفة المستهدفة:","opts":["140","154","170","260"],"ans":0,"why":"200 − 60 = 140.","en":{"q":"Market price 200 and required profit 30% of price. Target cost:","opts":["140","154","170","260"],"why":"200 − 60 = 140."}},{"q":"لو السعر انخفض 10% والكمية زادت 25%، الطلب:","opts":["غير مرن","مرن (المرونة 2.5)","متكافئ المرونة","عديم المرونة"],"ans":1,"why":"25% ÷ 10% = 2.5 أكبر من 1.","en":{"q":"If price falls 10% and quantity rises 25%, demand is:","opts":["Inelastic","Elastic (elasticity 2.5)","Unit elastic","Perfectly inelastic"],"why":"25% ÷ 10% = 2.5, greater than 1."}},{"q":"ساعات الآلات محدودة. المنتج A هامشه 40 ويحتاج 4 ساعات، والمنتج B هامشه 25 ويحتاج ساعتين. الأولوية:","opts":["A لأن هامشه أعلى","B لأن هامشه للساعة 12.5 مقابل 10","بالتساوي","حسب الطلب فقط"],"ans":1,"why":"الترتيب بالهامش لكل وحدة من المورد المحدود.","en":{"q":"Machine hours are limited. Product A has CM 40 and needs 4 hours; Product B has CM 25 and needs 2 hours. Priority:","opts":["A, because its margin is higher","B, because its margin per hour is 12.5 vs 10","Equal","Based on demand only"],"why":"Rank by margin per unit of the constrained resource."}},{"q":"تكلفة سبق إنفاقها على دراسة جدوى تعتبر:","opts":["ملائمة","تكلفة فرصة","تكلفة غارقة غير ملائمة","تكلفة تفاضلية"],"ans":2,"why":"Sunk cost مش بتتغير بالقرار.","en":{"q":"Money already spent on a feasibility study is a:","opts":["Relevant cost","Opportunity cost","Sunk cost, irrelevant","Differential cost"],"why":"A sunk cost does not change with the decision."}}]},{"code":"2D","title":"إدارة المخاطر","en":"Risk Management","weight":10,"lessons":[{"title":"إدارة مخاطر المنشأة (ERM)","blocks":[["b","**أنواع المخاطر:** استراتيجية (تغير السوق والتكنولوجيا)، تشغيلية (العمليات والأنظمة والأشخاص)، مالية (الائتمان، السيولة، الفائدة، العملة)، مخاطر الأخطار (حرائق وكوارث)، مخاطر الالتزام والسمعة."],["h3","إطار COSO ERM (2017)"],["t",["المكون","الفكرة"],[["الحوكمة والثقافة","إشراف المجلس على المخاطر والقيم الأساسية."],["الاستراتيجية ووضع الأهداف","تحديد **شهية المخاطر (Risk appetite)** وربطها بالاستراتيجية."],["الأداء","تحديد المخاطر وتقييم شدتها وترتيبها والاستجابة ليها."],["المراجعة والتعديل","متابعة التغيرات وتحسين إدارة المخاطر."],["المعلومات والاتصال والتقرير","تدفق المعلومات عن المخاطر."]],[3000,6638]],["b","**شهية المخاطر:** مقدار المخاطر اللي المنشأة مستعدة تقبله لتحقيق أهدافها. **التحمل (Tolerance):** الانحراف المقبول عن هدف معين."],["b","**المخاطر المتأصلة** قبل الضوابط، و**المتبقية (Residual)** بعد الضوابط."],["h3","الاستجابة للمخاطر"],["t",["الاستجابة","مثال"],[["التجنب (Avoid)","الخروج من سوق أو نشاط خطير."],["التخفيض (Reduce/Mitigate)","ضوابط، صيانة وقائية، تنويع الموردين."],["المشاركة/النقل (Share/Transfer)","التأمين، التحوط، التعهيد."],["القبول (Accept)","المخاطر الصغيرة أو اللي تكلفة معالجتها أعلى من أثرها."]],[3000,6638]]],"en":{"title":"Enterprise Risk Management (ERM)","blocks":[["b","**Types of risk:** strategic (market and technology changes), operational (processes, systems, people), financial (credit, liquidity, interest rate, currency), hazard (fire, disasters), compliance and reputational risk."],["h3","COSO ERM framework (2017)"],["t",["Component","Idea"],[["Governance and culture","Board oversight of risk and core values."],["Strategy and objective-setting","Defining **risk appetite** and linking it to strategy."],["Performance","Identifying risks, assessing severity, prioritizing, and responding."],["Review and revision","Monitoring changes and improving risk management."],["Information, communication, and reporting","Flow of risk information."]]],["b","**Risk appetite:** the amount of risk an organization is willing to accept in pursuit of its objectives. **Risk tolerance:** the acceptable variation around a specific objective."],["b","**Inherent risk** is before controls; **residual risk** is after controls."],["h3","Risk responses"],["t",["Response","Example"],[["Avoid","Exiting a risky market or activity."],["Reduce/Mitigate","Controls, preventive maintenance, supplier diversification."],["Share/Transfer","Insurance, hedging, outsourcing."],["Accept","Small risks, or risks that cost more to treat than their impact."]]]]}},{"title":"قياس المخاطر","blocks":[["b","**مصفوفة المخاطر (Heat map):** الاحتمال × الأثر، والمخاطر في الخانة الحمراء أولوية."],["b","**الخسارة المتوقعة** = الاحتمال × الأثر."],["b","**القيمة المعرضة للخطر (VaR):** أقصى خسارة متوقعة خلال فترة معينة بمستوى ثقة معين. مثال: VaR يومي 1 مليون بثقة 95% يعني فيه احتمال 5% إن الخسارة تزيد عن مليون في يوم."],["b","**التدفق النقدي المعرض للخطر (CFaR)** و**الأرباح المعرضة للخطر (EaR)**: نفس الفكرة على التدفقات والأرباح."],["b","**مؤشرات المخاطر الرئيسية (KRIs):** مؤشرات إنذار مبكر."],["b","**اختبارات الضغط والسيناريوهات** للأحداث الشديدة غير المحتملة."],["ex","مثال",["خطر عطل نظام احتماله 10% سنويًا وأثره 500,000. الخسارة المتوقعة = **50,000**.","ضابط تكلفته 30,000 سنويًا يقلل الاحتمال لـ 2% ← الخسارة المتوقعة 10,000. الوفر 40,000 > 30,000 ← **الضابط مجدي**."]]],"en":{"title":"Measuring Risk","blocks":[["b","**Risk heat map:** likelihood × impact; risks in the red zone are priorities."],["b","**Expected loss** = probability × impact."],["b","**Value at risk (VaR):** the maximum expected loss over a period at a given confidence level. Example: a daily VaR of 1 million at 95% confidence means a 5% chance the loss exceeds 1 million in a day."],["b","**Cash flow at risk (CFaR)** and **earnings at risk (EaR)**: the same idea applied to cash flows and earnings."],["b","**Key risk indicators (KRIs):** early-warning metrics."],["b","**Stress tests and scenarios** for severe but unlikely events."],["ex","Example",["A system failure risk has a 10% annual probability and an impact of 500,000. Expected loss = **50,000**.","A control costing 30,000 per year reduces the probability to 2% → expected loss 10,000. Savings of 40,000 > 30,000 → **the control is worthwhile**."]]]}}],"mcqs":[{"q":"شراء بوليصة تأمين ضد الحريق يمثل استجابة:","opts":["تجنب","تخفيض","مشاركة/نقل","قبول"],"ans":2,"why":"نقل الأثر المالي لطرف تالت.","en":{"q":"Buying a fire insurance policy is a response of:","opts":["Avoidance","Reduction","Sharing/transfer","Acceptance"],"why":"It transfers the financial impact to a third party."}},{"q":"مقدار المخاطر الإجمالي اللي المنشأة مستعدة تقبله لتحقيق أهدافها:","opts":["تحمل المخاطر","شهية المخاطر","المخاطر المتبقية","المخاطر المتأصلة"],"ans":1,"why":"Risk appetite.","en":{"q":"The overall amount of risk an organization is willing to accept to achieve its objectives:","opts":["Risk tolerance","Risk appetite","Residual risk","Inherent risk"],"why":"Risk appetite."}},{"q":"VaR يومي 2 مليون بثقة 99% يعني:","opts":["أقصى خسارة ممكنة 2 مليون","احتمال 1% إن الخسارة اليومية تتجاوز 2 مليون","خسارة متوقعة 2 مليون يوميًا","99% من الأيام فيها خسارة 2 مليون"],"ans":1,"why":"VaR حد عند مستوى ثقة، مش أقصى خسارة مطلقة.","en":{"q":"A daily VaR of 2 million at 99% confidence means:","opts":["The maximum possible loss is 2 million","A 1% probability that the daily loss exceeds 2 million","An expected loss of 2 million per day","99% of days have a 2 million loss"],"why":"VaR is a threshold at a confidence level, not an absolute maximum loss."}},{"q":"خطر احتماله 20% وأثره 300,000. ضابط تكلفته 40,000 يقلل الاحتمال لـ 5%. القرار:","opts":["طبّق الضابط (وفر صافي 5,000)","لا تطبقه","طبّقه (وفر 60,000)","انقل الخطر"],"ans":0,"why":"الخسارة المتوقعة تنزل من 60,000 لـ 15,000 (وفر 45,000) − 40,000 = 5,000 صافي.","en":{"q":"A risk has a 20% probability and an impact of 300,000. A control costing 40,000 reduces the probability to 5%. Decision:","opts":["Implement the control (net saving 5,000)","Do not implement it","Implement it (saving 60,000)","Transfer the risk"],"why":"Expected loss falls from 60,000 to 15,000 (saving 45,000) − 40,000 = 5,000 net."}},{"q":"المخاطر الباقية بعد تطبيق الضوابط تسمى:","opts":["متأصلة","متبقية","منتظمة","استراتيجية"],"ans":1,"why":"Residual risk.","en":{"q":"The risk remaining after controls are applied is called:","opts":["Inherent","Residual","Systematic","Strategic"],"why":"Residual risk."}}]},{"code":"2E","title":"قرارات الاستثمار","en":"Investment Decisions","weight":10,"lessons":[{"title":"تقدير التدفقات النقدية للمشروع","blocks":[["p","الموازنة الرأسمالية بتعتمد على **التدفقات النقدية بعد الضريبة**، مش الربح المحاسبي."],["t",["المرحلة","المكونات"],[["الاستثمار المبدئي","سعر الأصل + الشحن والتركيب + **الزيادة في رأس المال العامل** − متحصلات بيع الأصل القديم (بعد أثرها الضريبي)"],["التدفقات التشغيلية","(الإيرادات − المصروفات النقدية) × (1 − t) + **الإهلاك × t** (الوفر الضريبي)"],["التدفق النهائي","القيمة التخريدية بعد الضريبة + **استرداد رأس المال العامل**"]],[2600,7038]],["ex","مثال",["إيرادات 60,000، مصروفات نقدية 20,000، إهلاك 25,000، ضريبة 25%.","التدفق = 40,000 × 0.75 + 25,000 × 0.25 = 30,000 + 6,250 = **36,250**.","أو: الربح قبل الضريبة 15,000 ← بعدها 11,250 + الإهلاك 25,000 = 36,250."]],["ex","مثال: بيع أصل قديم",["أصل قيمته الدفترية 40,000 اتباع بـ 50,000، والضريبة 25%.","الربح 10,000 ← ضريبة 2,500 ← صافي المتحصلات = **47,500**.","لو اتباع بـ 30,000: خسارة 10,000 ← وفر ضريبي 2,500 ← صافي **32,500**."]],["b","التكاليف الغارقة مش بتدخل، وتكاليف الفرصة البديلة بتدخل، ومصروف الفائدة مش بيدخل (لأنه متضمن في معدل الخصم)."]],"en":{"title":"Estimating Project Cash Flows","blocks":[["p","Capital budgeting uses **after-tax cash flows**, not accounting profit."],["t",["Stage","Components"],[["Initial investment","Asset price + freight and installation + **increase in working capital** − proceeds from selling the old asset (after tax)"],["Operating cash flows","(Revenue − cash expenses) × (1 − t) + **depreciation × t** (tax shield)"],["Terminal cash flow","After-tax salvage value + **recovery of working capital**"]]],["ex","Example",["Revenue 60,000, cash expenses 20,000, depreciation 25,000, tax 25%.","Cash flow = 40,000 × 0.75 + 25,000 × 0.25 = 30,000 + 6,250 = **36,250**.","Or: pre-tax income 15,000 → after tax 11,250 + depreciation 25,000 = 36,250."]],["ex","Example: selling an old asset",["An asset with book value 40,000 is sold for 50,000; tax rate 25%.","Gain 10,000 → tax 2,500 → net proceeds = **47,500**.","If sold for 30,000: loss 10,000 → tax saving 2,500 → net **32,500**."]],["b","Sunk costs are excluded, opportunity costs are included, and interest expense is excluded (it is already in the discount rate)."]]}},{"title":"أساليب التقييم: NPV و IRR و Payback","blocks":[["t",["الأسلوب","القاعدة","ملاحظات"],[["صافي القيمة الحالية NPV","اقبل لو NPV > 0","الأفضل نظريًا؛ بيفترض إعادة الاستثمار بمعدل الخصم."],["معدل العائد الداخلي IRR","اقبل لو IRR > تكلفة رأس المال","ممكن يدي أكتر من IRR لو التدفقات غيرت إشارتها، وبيفترض إعادة الاستثمار بالـ IRR."],["فترة الاسترداد","كل ما قلت أحسن","بتتجاهل القيمة الزمنية والتدفقات بعد الاسترداد."],["الاسترداد المخصوم","نفس الفكرة بتدفقات مخصومة","لسه بتتجاهل ما بعد الاسترداد."],["مؤشر الربحية PI","PV للتدفقات ÷ الاستثمار > 1","مفيد لترتيب المشروعات مع تقنين رأس المال."]],[2600,2800,4238]],["ex","مثال متكامل",["استثمار 100,000، تدفقات 40,000 سنويًا لمدة 4 سنين، تكلفة رأس المال 10% (معامل القيمة الحالية للدفعات 3.1699).","PV = 40,000 × 3.1699 = 126,796 ← **NPV = 26,796** ← اقبل.","**PI** = 126,796 ÷ 100,000 = **1.27**.","**الاسترداد** = 100,000 ÷ 40,000 = **2.5 سنة**.","**IRR** ≈ **21.9%** (المعدل اللي يخلي معامل الدفعات = 2.5)."]],["b","**تعارض الترتيب بين NPV و IRR** في المشروعات المتنافية: بسبب اختلاف الحجم أو توقيت التدفقات. **القاعدة: اختار حسب NPV.**"]],"en":{"title":"Evaluation Methods: NPV, IRR, Payback","blocks":[["t",["Method","Rule","Notes"],[["Net present value (NPV)","Accept if NPV > 0","Theoretically best; assumes reinvestment at the discount rate."],["Internal rate of return (IRR)","Accept if IRR > cost of capital","Can give multiple IRRs if cash flows change sign; assumes reinvestment at the IRR."],["Payback period","Shorter is better","Ignores time value and cash flows after payback."],["Discounted payback","Same idea with discounted cash flows","Still ignores cash flows after payback."],["Profitability index (PI)","PV of cash flows ÷ investment > 1","Useful for ranking under capital rationing."]]],["ex","Integrated example",["Investment 100,000, cash flows 40,000 per year for 4 years, cost of capital 10% (annuity factor 3.1699).","PV = 40,000 × 3.1699 = 126,796 → **NPV = 26,796** → accept.","**PI** = 126,796 ÷ 100,000 = **1.27**.","**Payback** = 100,000 ÷ 40,000 = **2.5 years**.","**IRR** ≈ **21.9%** (the rate that makes the annuity factor = 2.5)."]],["b","**Ranking conflicts between NPV and IRR** for mutually exclusive projects: caused by differences in scale or timing of cash flows. **Rule: choose by NPV.**"]]}},{"title":"المخاطرة في الموازنة الرأسمالية","blocks":[["b","**معدل خصم معدل بالمخاطرة:** معدل أعلى للمشروعات الأخطر."],["b","**تحليل الحساسية والسيناريو والمحاكاة** لقياس أثر تغير الافتراضات."],["b","**الخيارات الحقيقية (Real options):** خيار التوسع، خيار الانسحاب، خيار التأجيل، خيار المرونة. بتزود قيمة المشروع عن NPV التقليدي."],["b","**تقنين رأس المال:** لما الميزانية محدودة، رتب حسب PI أو اختار التوليفة اللي تعظّم إجمالي NPV."],["b","**العوامل النوعية:** التوافق مع الاستراتيجية، الأثر البيئي والاجتماعي، المخاطر التنظيمية."]],"en":{"title":"Risk in Capital Budgeting","blocks":[["b","**Risk-adjusted discount rate:** a higher rate for riskier projects."],["b","**Sensitivity, scenario, and simulation analysis** to measure the effect of changing assumptions."],["b","**Real options:** option to expand, abandon, delay, or flexibility options. They add value beyond traditional NPV."],["b","**Capital rationing:** with a limited budget, rank by PI or choose the combination that maximizes total NPV."],["b","**Qualitative factors:** strategic fit, environmental and social impact, regulatory risk."]]}}],"mcqs":[{"q":"إيرادات 100,000، مصروفات نقدية 40,000، إهلاك 20,000، ضريبة 30%. التدفق النقدي بعد الضريبة:","opts":["28,000","48,000","42,000","60,000"],"ans":1,"why":"60,000 × 0.7 + 20,000 × 0.3 = 42,000 + 6,000 = 48,000.","en":{"q":"Revenue 100,000, cash expenses 40,000, depreciation 20,000, tax 30%. After-tax cash flow:","opts":["28,000","48,000","42,000","60,000"],"why":"60,000 × 0.7 + 20,000 × 0.3 = 42,000 + 6,000 = 48,000."}},{"q":"في المشروعات المتنافية لو NPV و IRR اختلفوا في الترتيب، نختار حسب:","opts":["IRR","NPV","فترة الاسترداد","PI"],"ans":1,"why":"NPV بيقيس الزيادة في ثروة المساهمين مباشرة.","en":{"q":"For mutually exclusive projects, if NPV and IRR rank them differently, choose by:","opts":["IRR","NPV","Payback","PI"],"why":"NPV directly measures the increase in shareholder wealth."}},{"q":"استثمار 90,000 وتدفقات سنوية 30,000. فترة الاسترداد:","opts":["3 سنوات","2.5 سنة","4 سنوات","0.33 سنة"],"ans":0,"why":"90,000 ÷ 30,000 = 3.","en":{"q":"Investment 90,000 and annual cash flows 30,000. Payback period:","opts":["3 years","2.5 years","4 years","0.33 years"],"why":"90,000 ÷ 30,000 = 3."}},{"q":"أي بند لا يدخل في تدفقات المشروع؟","opts":["الزيادة في رأس المال العامل","مصروف الفائدة على قرض تمويل المشروع","الوفر الضريبي للإهلاك","القيمة التخريدية"],"ans":1,"why":"تكلفة التمويل متضمنة في معدل الخصم.","en":{"q":"Which item is NOT included in project cash flows?","opts":["Increase in working capital","Interest expense on the project loan","Depreciation tax shield","Salvage value"],"why":"Financing cost is captured in the discount rate."}},{"q":"أصل قيمته الدفترية 60,000 اتباع بـ 45,000، والضريبة 20%. صافي المتحصلات:","opts":["45,000","48,000","42,000","60,000"],"ans":1,"why":"خسارة 15,000 × 20% = وفر ضريبي 3,000 ← 48,000.","en":{"q":"An asset with book value 60,000 is sold for 45,000; tax rate 20%. Net proceeds:","opts":["45,000","48,000","42,000","60,000"],"why":"Loss 15,000 × 20% = tax saving 3,000 → 48,000."}},{"q":"PV للتدفقات 260,000 والاستثمار 200,000. مؤشر الربحية:","opts":["0.77","1.3","60,000","1.6"],"ans":1,"why":"260,000 ÷ 200,000 = 1.3.","en":{"q":"PV of cash flows 260,000 and investment 200,000. Profitability index:","opts":["0.77","1.3","60,000","1.6"],"why":"260,000 ÷ 200,000 = 1.3."}}]},{"code":"2F","title":"الأخلاقيات المهنية","en":"Professional Ethics","weight":15,"lessons":[{"title":"قائمة IMA للممارسة المهنية الأخلاقية","blocks":[["p","الجزء ده **15%** من Part 2، وأسئلته سهلة لو حفظت الإطار كويس. الإطار عبارة عن **4 مبادئ عامة** و**4 معايير**."],["t",["المبادئ العامة (Overarching principles)"],[["الأمانة (Honesty)"],["العدالة (Fairness)"],["الموضوعية (Objectivity)"],["المسؤولية (Responsibility)"]],[9638]],["t",["المعيار","أهم المسؤوليات"],[["الكفاءة (Competence)","تطوير المعرفة والمهارات باستمرار، الالتزام بالقوانين والمعايير، تقديم معلومات دقيقة وفي وقتها، الإبلاغ عن أي قيود قد تمنع الحكم السليم، **مواكبة التكنولوجيا وتطوير المهارات الرقمية**."],["السرية (Confidentiality)","عدم الإفصاح عن المعلومات إلا بتصريح أو التزام قانوني، إبلاغ المرؤوسين بالسرية، عدم استخدام المعلومات لميزة شخصية."],["النزاهة (Integrity)","تجنب تعارض المصالح والإفصاح عنه، عدم ممارسة أي نشاط يعيق أداء الواجب، الامتناع عن أي نشاط يسيء للمهنة، **المساهمة في ثقافة أخلاقية إيجابية**."],["المصداقية (Credibility)","توصيل المعلومات بعدالة وموضوعية، الإفصاح عن كل ما يؤثر على فهم المستخدم، الإفصاح عن التأخيرات أو القصور في المعلومات أو الرقابة الداخلية."]],[2600,7038]],["h3","خطوات حل المشكلة الأخلاقية"],["n","اتبع سياسات المنشأة الموضوعة لحل المشكلات الأخلاقية."],["n","ناقش المشكلة مع المشرف المباشر، إلا لو هو متورط فتروح للمستوى الأعلى (وممكن توصل لمجلس الإدارة أو لجنة المراجعة)."],["n","استشر بسرية مستشار أخلاقيات IMA أو مستشار مستقل."],["n","استشر محاميك عن حقوقك والتزاماتك القانونية."],["n","لو المشكلة مااتحلتش، ممكن تفكر في الاستقالة."],["exam","نقطة امتحان",["التواصل مع الإعلام أو الجهات الخارجية **مش** خطوة أولى؛ ده بيكون بس لو القانون بيلزمك. وخطأ شائع: اختيار \"استقيل فورًا\" كأول خطوة."]]],"en":{"title":"IMA Statement of Ethical Professional Practice","blocks":[["p","This topic is **15%** of Part 2, and its questions are easy if you know the framework well. The framework has **4 overarching principles** and **4 standards**."],["t",["Overarching principles"],[["Honesty"],["Fairness"],["Objectivity"],["Responsibility"]]],["t",["Standard","Key responsibilities"],[["Competence","Continually develop knowledge and skills, comply with laws and standards, provide accurate and timely information, report any limitations that might preclude sound judgment, **keep up with technology and develop digital skills**."],["Confidentiality","Do not disclose information unless authorized or legally required, inform subordinates about confidentiality, do not use information for personal advantage."],["Integrity","Avoid and disclose conflicts of interest, refrain from activities that prejudice duties, abstain from activities that discredit the profession, **contribute to a positive ethical culture**."],["Credibility","Communicate information fairly and objectively, disclose everything that could affect a user’s understanding, disclose delays or deficiencies in information or internal controls."]]],["h3","Steps to resolve an ethical issue"],["n","Follow the organization’s established policies for resolving ethical issues."],["n","Discuss the issue with your immediate supervisor, unless the supervisor is involved, in which case go to the next level (possibly up to the board or audit committee)."],["n","Consult confidentially with an IMA ethics counselor or other impartial advisor."],["n","Consult your own attorney about your legal rights and obligations."],["n","If the issue is not resolved, consider resigning."],["exam","Exam point",["Contacting the media or outside parties is **not** a first step; it applies only when required by law. A common mistake: choosing \"resign immediately\" as the first step."]]]}},{"title":"الأخلاقيات على مستوى المنشأة والاستدامة","blocks":[["b","**النغمة من القمة (Tone at the top):** سلوك الإدارة العليا أهم عامل في الثقافة الأخلاقية."],["b","**مدونة السلوك:** مكتوبة، ومعروفة لكل الموظفين، ومعاها تدريب وآلية إبلاغ آمنة (Whistleblower hotline) وحماية من الانتقام."],["b","**مثلث الغش:** الضغط (حوافز أو ضغوط مالية)، الفرصة (ضعف الرقابة)، التبرير (\"هرجعهم بعدين\")."],["b","**FCPA:** منع الرشوة، مع استثناء **المدفوعات التسهيلية** الصغيرة لإجراءات روتينية. ومتطلبات الدفاتر والسجلات والرقابة الداخلية."],["b","**المسؤولية الاجتماعية والاستدامة:** مراعاة أصحاب المصلحة، حقوق الإنسان في سلسلة التوريد، تجنب **التضليل البيئي (Greenwashing)**، إرشادات مثل الميثاق العالمي للأمم المتحدة وإرشادات OECD للشركات متعددة الجنسيات."],["b","**الأخلاقيات والتكنولوجيا:** خصوصية البيانات، تحيز الخوارزميات، الشفافية في استخدام الذكاء الاصطناعي."],["ex","حالة",["المدير المالي طلب من المحاسبة الإدارية تأجيل تسجيل مصروفات ديسمبر لشهر يناير علشان الشركة تحقق هدف الأرباح والمكافآت تتصرف.","**المعايير المنتهكة:** المصداقية (معلومات غير عادلة)، النزاهة (تعارض مصالح بسبب المكافآت)، الكفاءة (مخالفة المعايير المحاسبية).","**المطلوب:** ترفض، وتشوف سياسة الشركة، وبما إن المشرف المباشر هو المتورط، تروح للمستوى الأعلى (المدير التنفيذي أو لجنة المراجعة)، وتستشير مستشار أخلاقيات IMA بسرية."]]],"en":{"title":"Organizational Ethics and Sustainability","blocks":[["b","**Tone at the top:** senior management behavior is the most important factor in ethical culture."],["b","**Code of conduct:** written, known to all employees, supported by training, a safe reporting channel (whistleblower hotline), and protection from retaliation."],["b","**Fraud triangle:** pressure (financial incentives or pressures), opportunity (weak controls), rationalization (\"I’ll pay it back later\")."],["b","**FCPA:** prohibits bribery, with an exception for small **facilitating payments** for routine actions; plus books-and-records and internal control requirements."],["b","**Social responsibility and sustainability:** considering stakeholders, human rights in the supply chain, avoiding **greenwashing**, guidance such as the UN Global Compact and the OECD Guidelines for Multinational Enterprises."],["b","**Ethics and technology:** data privacy, algorithmic bias, transparency in the use of AI."],["ex","Case",["The CFO asks a management accountant to defer recording December expenses to January so the company meets its profit target and bonuses are paid.","**Standards violated:** credibility (unfair information), integrity (conflict of interest from bonuses), competence (violating accounting standards).","**Required action:** refuse, check company policy, and since the immediate supervisor is involved, escalate to the next level (CEO or audit committee), and consult an IMA ethics counselor confidentially."]]]}}],"mcqs":[{"q":"أي مما يلي من المبادئ العامة في قائمة IMA؟","opts":["الكفاءة","الموضوعية","السرية","المصداقية"],"ans":1,"why":"المبادئ: الأمانة، العدالة، الموضوعية، المسؤولية. الباقي معايير.","en":{"q":"Which of the following is an overarching principle in the IMA Statement?","opts":["Competence","Objectivity","Confidentiality","Credibility"],"why":"The principles are honesty, fairness, objectivity, and responsibility. The others are standards."}},{"q":"محاسب إداري استخدم معلومات داخلية عن صفقة استحواذ لشراء أسهم. المعيار المنتهك أساسًا:","opts":["الكفاءة","السرية","المصداقية","الموضوعية"],"ans":1,"why":"معيار السرية بيمنع استخدام المعلومات لمنفعة شخصية.","en":{"q":"A management accountant used inside information about an acquisition to buy shares. The standard primarily violated:","opts":["Competence","Confidentiality","Credibility","Objectivity"],"why":"Confidentiality prohibits using information for personal advantage."}},{"q":"لو المشرف المباشر متورط في المشكلة الأخلاقية، الخطوة المناسبة:","opts":["إبلاغ الصحافة","عرض الأمر على المستوى الإداري الأعلى","الاستقالة فورًا","تجاهل الأمر"],"ans":1,"why":"تتخطى المشرف للمستوى الأعلى.","en":{"q":"If the immediate supervisor is involved in the ethical issue, the appropriate step is:","opts":["Inform the press","Take the matter to the next higher management level","Resign immediately","Ignore it"],"why":"Bypass the supervisor and go to the next level."}},{"q":"الإفصاح عن أوجه القصور في الرقابة الداخلية يندرج تحت معيار:","opts":["الكفاءة","السرية","النزاهة","المصداقية"],"ans":3,"why":"المصداقية تشمل الإفصاح عن القصور في المعلومات أو الرقابة.","en":{"q":"Disclosing deficiencies in internal control falls under the standard of:","opts":["Competence","Confidentiality","Integrity","Credibility"],"why":"Credibility includes disclosing deficiencies in information or controls."}},{"q":"في مثلث الغش، ضعف الفصل بين المهام يمثل:","opts":["الضغط","الفرصة","التبرير","الدافع"],"ans":1,"why":"ضعف الرقابة بيخلق فرصة.","en":{"q":"In the fraud triangle, weak segregation of duties represents:","opts":["Pressure","Opportunity","Rationalization","Motive"],"why":"Weak controls create opportunity."}},{"q":"محاسب إداري قريبه مالك شركة توريد بتتقدم بعطاء. التصرف السليم:","opts":["يقيّم العطاء عادي","يفصح عن تعارض المصالح ويتنحى عن التقييم","يستبعد الشركة من العطاء","يستقيل"],"ans":1,"why":"معيار النزاهة: تجنب تعارض المصالح والإفصاح عنه.","en":{"q":"A management accountant’s relative owns a supplier that is bidding. The proper action:","opts":["Evaluate the bid normally","Disclose the conflict of interest and recuse from the evaluation","Exclude the supplier from bidding","Resign"],"why":"Integrity: avoid and disclose conflicts of interest."}},{"q":"وفق FCPA، أي مدفوعات قد تكون مسموحة؟","opts":["رشوة للحصول على عقد حكومي","مدفوعات تسهيلية صغيرة لإجراء روتيني","هدية كبيرة لوزير","دفع لمسؤول لتغيير قرار"],"ans":1,"why":"Facilitating payments لإجراءات روتينية غير تقديرية.","en":{"q":"Under the FCPA, which payments may be permitted?","opts":["A bribe to win a government contract","Small facilitating payments for a routine action","A large gift to a minister","A payment to an official to change a decision"],"why":"Facilitating payments for routine, non-discretionary actions."}}]}]}],"cbqs":[{"part":1,"title":"شركة النيل للصناعات: موازنة الإنتاج والمشتريات وانحرافات المواد","domains":["1B","1C"],"caseText":["شركة النيل بتنتج منتج واحد. المبيعات المتوقعة بالوحدات: يناير 8,000، فبراير 10,000، مارس 9,000، أبريل 11,000.","سياسة المخزون التام: مخزون آخر كل شهر = 20% من مبيعات الشهر اللي بعده. مخزون التام في 1 يناير 1,600 وحدة.","كل وحدة محتاجة 2 كجم خامات بسعر معياري 4 للكيلو. سياسة مخزون الخامات: آخر كل شهر = 25% من احتياجات إنتاج الشهر اللي بعده. مخزون الخامات في 1 يناير 4,300 كجم.","الفعلي في فبراير: الإنتاج زي الموازنة بالظبط. الشركة اشترت 21,000 كجم بإجمالي 81,900، واستخدمت في الإنتاج 20,100 كجم."],"tasks":[{"type":"num","q":"كم وحدة لازم تنتج الشركة في يناير؟","ans":8400,"tol":0,"unit":"وحدة","why":"8,000 + (20% × 10,000) − 1,600 = 8,400.","en":{"q":"How many units must be produced in January?","unit":"units","why":"8,000 + (20% × 10,000) − 1,600 = 8,400."}},{"type":"num","q":"كم وحدة لازم تنتج في فبراير؟","ans":9800,"tol":0,"unit":"وحدة","why":"10,000 + (20% × 9,000 = 1,800) − 2,000 = 9,800.","en":{"q":"How many units must be produced in February?","unit":"units","why":"10,000 + (20% × 9,000 = 1,800) − 2,000 = 9,800."}},{"type":"num","q":"كم كجم خامات لازم تشتريها الشركة في يناير؟","ans":17400,"tol":0,"unit":"كجم","why":"احتياجات يناير 8,400 × 2 = 16,800 + آخر المدة 25% × (9,800 × 2) = 4,900 − أول المدة 4,300 = 17,400.","en":{"q":"How many kg of material must be purchased in January?","unit":"kg","why":"January needs 8,400 × 2 = 16,800 + ending 25% × (9,800 × 2) = 4,900 − beginning 4,300 = 17,400."}},{"type":"single","q":"انحراف سعر الخامات في فبراير (محسوب عند الشراء):","opts":["2,100 ملائم","2,100 غير ملائم","2,010 ملائم","1,050 ملائم"],"ans":0,"why":"السعر الفعلي 81,900 ÷ 21,000 = 3.90. الانحراف = 21,000 × (3.90 − 4) = 2,100 ملائم.","en":{"q":"February materials price variance (computed at purchase):","opts":["2,100 favorable","2,100 unfavorable","2,010 favorable","1,050 favorable"],"why":"Actual price 81,900 ÷ 21,000 = 3.90. Variance = 21,000 × (3.90 − 4) = 2,100 favorable."}},{"type":"num","q":"انحراف كمية الخامات في فبراير (اكتب الرقم بدون إشارة):","ans":2000,"tol":0,"unit":"غير ملائم","why":"الكمية المعيارية = 9,800 × 2 = 19,600. الانحرا
