ف = (20,100 − 19,600) × 4 = 2,000 غير ملائم.","en":{"q":"February materials quantity variance (enter the amount without a sign):","unit":"unfavorable","why":"Standard quantity = 9,800 × 2 = 19,600. Variance = (20,100 − 19,600) × 4 = 2,000 unfavorable."}},{"type":"multi","q":"اختار كل التفسيرات المنطقية للانحرافين مع بعض:","opts":["شراء خامات أقل جودة بسعر أرخص فزاد الهالك","عمال أقل خبرة استهلكوا خامات أكتر من المعيار","ارتفاع أسعار الخامات عالميًا","الموازنة الثابتة كانت أعلى من الإنتاج الفعلي"],"ans":[0,1],"why":"السعر ملائم والكمية غير ملائمة، وده نمط كلاسيكي لخامات أرخص وأقل جودة، أو لعمالة أقل كفاءة. ارتفاع الأسعار كان هيدي انحراف سعر غير ملائم، والإنتاج كان زي الموازنة.","en":{"q":"Select all reasonable explanations for the two variances together:","opts":["Buying cheaper, lower-quality material that increased waste","Less experienced workers using more material than standard","A global increase in material prices","The static budget was higher than actual production"],"why":"A favorable price with an unfavorable quantity is the classic pattern of cheaper, lower-quality material, or less efficient labor. Rising prices would give an unfavorable price variance, and production matched the budget."}}],"en":{"title":"Nile Industries: Production and Purchases Budgets and Materials Variances","caseText":["Nile Industries makes a single product. Budgeted unit sales: January 8,000, February 10,000, March 9,000, April 11,000.","Finished goods policy: ending inventory each month = 20% of the following month’s sales. Finished goods on January 1 were 1,600 units.","Each unit requires 2 kg of material at a standard price of 4 per kg. Materials policy: ending inventory each month = 25% of the following month’s production needs. Materials on January 1 were 4,300 kg.","Actual for February: production was exactly as budgeted. The company purchased 21,000 kg for a total of 81,900 and used 20,100 kg in production."]}},{"part":1,"title":"شركة الدلتا: التكاليف الكلية والمتغيرة و ABC","domains":["1D"],"caseText":["شركة الدلتا بدأت السنة بدون مخزون. أنتجت 20,000 وحدة وباعت 18,000 بسعر 50 للوحدة.","التكاليف المتغيرة للوحدة: مواد 12، أجور 8، غ.م.ص متغيرة 5، مصروفات بيع متغيرة 3.","التكاليف الصناعية الثابتة 160,000 (تتحمل على أساس الإنتاج الفعلي)، والمصروفات البيعية والإدارية الثابتة 90,000.","الشركة بتدرس تطبيق ABC على خط منتج جديد اسمه Deluxe (1,000 وحدة): تكلفة التجهيز 120,000 لإجمالي 60 مرة تجهيز، وتكلفة الفحص 80,000 لإجمالي 400 فحص. منتج Deluxe احتاج 20 مرة تجهيز و 100 فحص. بالنظام التقليدي (ساعات الآلات) كانت Deluxe بتتحمل 10 للوحدة من التكلفتين دول."],"tasks":[{"type":"num","q":"تكلفة الوحدة بطريقة التكاليف الكلية (Absorption):","ans":33,"tol":0,"unit":"للوحدة","why":"12 + 8 + 5 + (160,000 ÷ 20,000 = 8) = 33. مصروفات البيع مش جزء من تكلفة المنتج.","en":{"q":"Unit product cost under absorption costing:","unit":"per unit","why":"12 + 8 + 5 + (160,000 ÷ 20,000 = 8) = 33. Selling costs are not product costs."}},{"type":"num","q":"الربح التشغيلي بطريقة التكاليف المتغيرة:","ans":146000,"tol":0,"unit":"","why":"هامش المساهمة = 18,000 × (50 − 28) = 396,000 − 160,000 − 90,000 = 146,000.","en":{"q":"Operating income under variable costing:","unit":"","why":"Contribution margin = 18,000 × (50 − 28) = 396,000 − 160,000 − 90,000 = 146,000."}},{"type":"num","q":"الربح التشغيلي بطريقة التكاليف الكلية:","ans":162000,"tol":0,"unit":"","why":"146,000 + (2,000 وحدة زيادة مخزون × 8) = 162,000.","en":{"q":"Operating income under absorption costing:","unit":"","why":"146,000 + (2,000 units inventory increase × 8) = 162,000."}},{"type":"single","q":"سبب الفرق بين الربحين:","opts":["16,000 من التكاليف الثابتة اتأجلت في مخزون آخر المدة","مصروفات البيع المتغيرة اتعالجت بشكل مختلف","الكلية بتحمّل المصروفات الإدارية على المنتج","خطأ في الحساب، المفروض يتساووا"],"ans":0,"why":"في التكاليف الكلية، 2,000 وحدة × 8 من الثابتة فضلت في المخزون.","en":{"q":"The reason for the difference between the two incomes:","opts":["16,000 of fixed costs were deferred in ending inventory","Variable selling costs were treated differently","Absorption charges administrative costs to the product","A calculation error; they should be equal"],"why":"Under absorption costing, 2,000 units × 8 of fixed cost remained in inventory."}},{"type":"num","q":"تكلفة التجهيز والفحص للوحدة من Deluxe بنظام ABC:","ans":60,"tol":0,"unit":"للوحدة","why":"تجهيز 2,000 × 20 = 40,000 + فحص 200 × 100 = 20,000 = 60,000 ÷ 1,000 = 60.","en":{"q":"Setup and inspection cost per unit of Deluxe under ABC:","unit":"per unit","why":"Setup 2,000 × 20 = 40,000 + inspection 200 × 100 = 20,000 = 60,000 ÷ 1,000 = 60."}},{"type":"single","q":"النتيجة بالنسبة لمنتج Deluxe:","opts":["النظام التقليدي كان بيقلل تكلفته بـ 50 للوحدة، وممكن يكون مسعّر بأقل من اللازم","النظام التقليدي كان بيبالغ في تكلفته","مفيش فرق جوهري","ABC غلط لأنه بيتجاهل ساعات الآلات"],"ans":0,"why":"60 مقابل 10. المنتجات الصغيرة المعقدة غالبًا بتبان أرخص في النظام التقليدي.","en":{"q":"The conclusion for Deluxe:","opts":["The traditional system undercosted it by 50 per unit, so it may be underpriced","The traditional system overcosted it","No significant difference","ABC is wrong because it ignores machine hours"],"why":"60 vs 10. Small, complex products often look cheaper under traditional systems."}}],"en":{"title":"Delta Company: Absorption vs Variable Costing and ABC","caseText":["Delta Company began the year with no inventory. It produced 20,000 units and sold 18,000 at 50 per unit.","Variable costs per unit: materials 12, labor 8, variable overhead 5, variable selling 3.","Fixed manufacturing overhead is 160,000 (applied based on actual production), and fixed selling and administrative expenses are 90,000.","The company is considering ABC for a new product line called Deluxe (1,000 units): setup cost 120,000 for 60 total setups, and inspection cost 80,000 for 400 total inspections. Deluxe required 20 setups and 100 inspections. Under the traditional system (machine hours), Deluxe was charged 10 per unit for these two costs."]}},{"part":2,"title":"شركة الفرات: التعادل وطلبية خاصة","domains":["2C"],"caseText":["شركة الفرات بتبيع منتج بسعر 120. التكاليف المتغيرة للوحدة: مواد 40، أجور 20، غ.م.ص متغيرة 8، عمولة بيع 4. التكاليف الثابتة السنوية 1,440,000.","الطاقة القصوى 50,000 وحدة، والمبيعات الحالية 40,000 وحدة. معدل الضريبة 25%.","عميل جديد عرض يشتري 8,000 وحدة بسعر 85 للوحدة. الطلبية دي مش عليها عمولة بيع، لكنها محتاجة تغليف خاص بتكلفة إجمالية 20,000 مرة واحدة."],"tasks":[{"type":"num","q":"نقطة التعادل بالوحدات:","ans":30000,"tol":0,"unit":"وحدة","why":"هامش الوحدة = 120 − 72 = 48. التعادل = 1,440,000 ÷ 48 = 30,000.","en":{"q":"Breakeven point in units:","unit":"units","why":"Unit CM = 120 − 72 = 48. Breakeven = 1,440,000 ÷ 48 = 30,000."}},{"type":"num","q":"عدد الوحدات اللازم لتحقيق ربح بعد الضريبة 450,000:","ans":42500,"tol":0,"unit":"وحدة","why":"قبل الضريبة = 450,000 ÷ 0.75 = 600,000. الوحدات = (1,440,000 + 600,000) ÷ 48 = 42,500.","en":{"q":"Units required for an after-tax profit of 450,000:","unit":"units","why":"Pre-tax = 450,000 ÷ 0.75 = 600,000. Units = (1,440,000 + 600,000) ÷ 48 = 42,500."}},{"type":"num","q":"هامش الأمان عند المبيعات الحالية كنسبة مئوية:","ans":25,"tol":0,"unit":"%","why":"(40,000 − 30,000) ÷ 40,000 = 25%.","en":{"q":"Margin of safety at current sales, as a percentage:","unit":"%","why":"(40,000 − 30,000) ÷ 40,000 = 25%."}},{"type":"num","q":"درجة الرفع التشغيلي عند المبيعات الحالية:","ans":4,"tol":0.01,"unit":"","why":"هامش المساهمة 1,920,000 ÷ الربح التشغيلي 480,000 = 4.","en":{"q":"Degree of operating leverage at current sales:","unit":"","why":"Contribution margin 1,920,000 ÷ operating income 480,000 = 4."}},{"type":"num","q":"أثر قبول الطلبية الخاصة (8,000 وحدة) على الربح التشغيلي:","ans":116000,"tol":0,"unit":"زيادة","why":"التكلفة المتغيرة بدون عمولة = 68. 8,000 × (85 − 68) = 136,000 − 20,000 تغليف = 116,000 زيادة. الثابتة مش ملائمة لأن فيه طاقة عاطلة 10,000.","en":{"q":"Effect of accepting the special order (8,000 units) on operating income:","unit":"increase","why":"Variable cost without commission = 68. 8,000 × (85 − 68) = 136,000 − 20,000 packaging = 116,000 increase. Fixed costs are irrelevant because there is idle capacity of 10,000."}},{"type":"single","q":"لو العميل طلب 15,000 وحدة بنفس الشروط، القرار:","opts":["ارفض، لأن الأثر خسارة 5,000","اقبل، لأن الأثر ربح 235,000","اقبل، لأن الأثر ربح 116,000","لا فرق"],"ans":0,"why":"الربح من الطلبية = 15,000 × 17 − 20,000 = 235,000. لكن هنضحي بـ 5,000 وحدة عادية بهامش 48 = 240,000. الصافي خسارة 5,000.","en":{"q":"If the customer ordered 15,000 units on the same terms, the decision is:","opts":["Reject, because the effect is a 5,000 loss","Accept, because the effect is a 235,000 gain","Accept, because the effect is a 116,000 gain","Indifferent"],"why":"Gain from the order = 15,000 × 17 − 20,000 = 235,000. But 5,000 regular units at a CM of 48 are given up = 240,000. Net loss of 5,000."}}],"en":{"title":"Euphrates Company: Breakeven and a Special Order","caseText":["Euphrates Company sells a product at 120. Variable costs per unit: materials 40, labor 20, variable overhead 8, sales commission 4. Annual fixed costs are 1,440,000.","Maximum capacity is 50,000 units, and current sales are 40,000 units. The tax rate is 25%.","A new customer offers to buy 8,000 units at 85 per unit. This order carries no sales commission but requires special packaging with a one-time total cost of 20,000."]}},{"part":2,"title":"شركة الأهرام: قرار استثمار في آلة جديدة","domains":["2E"],"caseText":["شركة الأهرام بتدرس شراء آلة بـ 500,000 وتكاليف تركيب 20,000. المشروع محتاج زيادة في رأس المال العامل 30,000 تسترد بالكامل في آخر المشروع.","عمر المشروع 4 سنين، والإهلاك بالقسط الثابت لصفر على أساس التكلفة الكلية. الإيرادات السنوية 400,000، والتكاليف النقدية السنوية 180,000.","في آخر السنة الرابعة هتتباع الآلة بـ 40,000. معدل الضريبة 25%، وتكلفة رأس المال 12% (معامل القيمة الحالية للدفعات 4 سنين = 3.0373، ومعامل السنة الرابعة = 0.6355)."],"tasks":[{"type":"num","q":"الاستثمار المبدئي في سنة 0:","ans":550000,"tol":0,"unit":"","why":"500,000 + 20,000 + 30,000 رأس مال عامل = 550,000.","en":{"q":"Initial investment at year 0:","unit":"","why":"500,000 + 20,000 + 30,000 working capital = 550,000."}},{"type":"num","q":"التدفق النقدي التشغيلي السنوي بعد الضريبة:","ans":197500,"tol":0,"unit":"","why":"الإهلاك = 520,000 ÷ 4 = 130,000. التدفق = 220,000 × 0.75 + 130,000 × 0.25 = 165,000 + 32,500 = 197,500.","en":{"q":"Annual after-tax operating cash flow:","unit":"","why":"Depreciation = 520,000 ÷ 4 = 130,000. Cash flow = 220,000 × 0.75 + 130,000 × 0.25 = 165,000 + 32,500 = 197,500."}},{"type":"num","q":"التدفق النهائي الإضافي في السنة الرابعة (التخريد بعد الضريبة + رأس المال العامل):","ans":60000,"tol":0,"unit":"","why":"القيمة الدفترية صفر، فالربح 40,000 وعليه ضريبة 10,000 ← 30,000 + 30,000 رأس مال عامل = 60,000.","en":{"q":"Additional terminal cash flow in year 4 (after-tax salvage + working capital):","unit":"","why":"Book value is zero, so the gain of 40,000 is taxed 10,000 → 30,000 + 30,000 working capital = 60,000."}},{"type":"num","q":"صافي القيمة الحالية NPV (تقريبًا):","ans":88000,"tol":1500,"unit":"","why":"197,500 × 3.0373 = 599,867 + 60,000 × 0.6355 = 38,130 − 550,000 ≈ 87,997.","en":{"q":"Net present value (approximately):","unit":"","why":"197,500 × 3.0373 = 599,867 + 60,000 × 0.6355 = 38,130 − 550,000 ≈ 87,997."}},{"type":"num","q":"فترة الاسترداد بالسنين (لأقرب رقمين عشريين):","ans":2.78,"tol":0.01,"unit":"سنة","why":"550,000 ÷ 197,500 = 2.78 سنة.","en":{"q":"Payback period in years (to two decimals):","unit":"years","why":"550,000 ÷ 197,500 = 2.78 years."}},{"type":"multi","q":"أي التغييرات دي هتزود NPV؟","opts":["استخدام إهلاك ضريبي معجل بدل القسط الثابت","ارتفاع تكلفة رأس المال لـ 14%","تقليل رأس المال العامل المطلوب","ارتفاع معدل الضريبة"],"ans":[0,2],"why":"الإهلاك المعجل بيقدّم الوفر الضريبي، وتقليل رأس المال العامل بيقلل الاستثمار المبدئي. ارتفاع معدل الخصم أو الضريبة بيقلل NPV هنا.","en":{"q":"Which of these changes would increase NPV?","opts":["Using accelerated tax depreciation instead of straight-line","An increase in the cost of capital to 14%","Reducing the required working capital","An increase in the tax rate"],"why":"Accelerated depreciation brings the tax shield forward, and lower working capital reduces the initial investment. A higher discount rate or tax rate lowers NPV here."}}],"en":{"title":"Pyramids Company: Investing in a New Machine","caseText":["Pyramids Company is considering buying a machine for 500,000 plus installation of 20,000. The project requires an increase in working capital of 30,000, fully recovered at the end.","Project life is 4 years, with straight-line depreciation to zero on the total cost. Annual revenue is 400,000 and annual cash costs are 180,000.","At the end of year 4 the machine will be sold for 40,000. Tax rate 25%, cost of capital 12% (4-year annuity factor = 3.0373, year-4 factor = 0.6355)."]}},{"part":2,"title":"شركة سيناء: تحليل النسب وموقف أخلاقي","domains":["2A","2F"],"caseText":["بيانات شركة سيناء (بالألف): نقدية 60، مدينون 140، مخزون 200، التزامات متداولة 250. إجمالي الأصول 1,000، إجمالي الالتزامات 550، حقوق الملكية 450.","المبيعات (كلها آجلة) 1,500، تكلفة المبيعات 900، الربح قبل الفوائد والضرائب 150، الفوائد 30، صافي الدخل 90. متوسط المدينين 125 ومتوسط المخزون 180. عدد الأسهم 30 ألف سهم وسعر السهم 36.","قرض من البنك فيه شرط إن نسبة التداول ماتقلش عن 1.5. الأرقام اللي فوق معمولة على أساس طلب المدير المالي: إنه يصنف قسط قرض قيمته 40 ومستحق بعد 6 شهور كالتزام طويل الأجل (يعني الـ 40 مش داخلين في الـ 250). احسب النسب على الأرقام زي ما هي، إلا لو السؤال قال غير كده."],"tasks":[{"type":"num","q":"نسبة التداول:","ans":1.6,"tol":0.01,"unit":"","why":"400 ÷ 250 = 1.6.","en":{"q":"Current ratio:","unit":"","why":"400 ÷ 250 = 1.6."}},{"type":"num","q":"النسبة السريعة:","ans":0.8,"tol":0.01,"unit":"","why":"(60 + 140) ÷ 250 = 0.8.","en":{"q":"Quick ratio:","unit":"","why":"(60 + 140) ÷ 250 = 0.8."}},{"type":"num","q":"متوسط فترة التحصيل بالأيام (365 يوم، أقرب رقم عشري):","ans":30.4,"tol":0.1,"unit":"يوم","why":"الدوران = 1,500 ÷ 125 = 12 ← 365 ÷ 12 = 30.4 يوم.","en":{"q":"Days sales outstanding (365 days, one decimal):","unit":"days","why":"Turnover = 1,500 ÷ 125 = 12 → 365 ÷ 12 = 30.4 days."}},{"type":"num","q":"معدل دوران المخزون:","ans":5,"tol":0,"unit":"مرة","why":"900 ÷ 180 = 5.","en":{"q":"Inventory turnover:","unit":"times","why":"900 ÷ 180 = 5."}},{"type":"num","q":"مضاعف الربحية P/E:","ans":12,"tol":0,"unit":"مرة","why":"EPS = 90,000 ÷ 30,000 = 3 ← 36 ÷ 3 = 12.","en":{"q":"Price/earnings (P/E) ratio:","unit":"times","why":"EPS = 90,000 ÷ 30,000 = 3 → 36 ÷ 3 = 12."}},{"type":"num","q":"نسبة التداول الصحيحة لو القسط اتصنف متداول زي ما المفروض (رقمين عشريين):","ans":1.38,"tol":0.01,"unit":"","why":"400 ÷ (250 + 40) = 1.38، وده أقل من شرط البنك 1.5. ده سبب طلب المدير المالي.","en":{"q":"The correct current ratio if the installment is properly classified as current (two decimals):","unit":"","why":"400 ÷ (250 + 40) = 1.38, below the bank’s 1.5 requirement. That is why the CFO made the request."}},{"type":"single","q":"طلب المدير المالي ينتهك أساسًا معيار:","opts":["المصداقية","السرية","الكفاءة فقط","لا ينتهك أي معيار"],"ans":0,"why":"التصنيف الخاطئ بيقدم معلومات غير عادلة ومضللة للبنك، وده ضد المصداقية (وكمان الكفاءة لمخالفة المعايير المحاسبية).","en":{"q":"The CFO’s request primarily violates the standard of:","opts":["Credibility","Confidentiality","Competence only","It violates no standard"],"why":"Misclassification gives the bank unfair and misleading information, which violates credibility (and competence, for breaching accounting standards)."}}],"en":{"title":"Sinai Company: Ratio Analysis and an Ethical Situation","caseText":["Sinai Company data (in thousands): cash 60, receivables 140, inventory 200, current liabilities 250. Total assets 1,000, total liabilities 550, equity 450.","Sales (all on credit) 1,500, COGS 900, EBIT 150, interest 30, net income 90. Average receivables 125 and average inventory 180. 30 thousand shares outstanding; share price 36.","A bank loan requires a current ratio of at least 1.5. The figures above reflect the CFO’s request to classify a loan installment of 40, due in 6 months, as long-term (so the 40 is not included in the 250). Compute ratios on the figures as given unless the question says otherwise."]}}],"plan":[["h3","شكل الامتحان من دورة سبتمبر/أكتوبر 2026"],["t",["البند","التفاصيل"],[["الأجزاء","جزئين مستقلين، تقدر تبدأ بأي واحد فيهم. لازم تنجح في الاتنين خلال 3 سنين من التسجيل."],["القسم الأول","100 سؤال اختيار من متعدد في 3 ساعات (حوالي 1.8 دقيقة للسؤال)."],["القسم الثاني","حالتين (CBQ) في ساعة: كل حالة حوالي 250 كلمة وبعدها لحد 7 أسئلة (إدخال رقم، اختيار، اختيار متعدد، سحب وإفلات). **الحالات دي حلت محل المقالات.**"],["شرط المرور للقسم التاني","لازم تجيب 50% على الأقل في أسئلة الاختيار."],["الوزن","الاختيار 75% والحالات 25% من الدرجة."],["النجاح","360 من 500 (درجة موزونة)."],["نوافذ الامتحان","يناير/فبراير، مايو/يونيو، سبتمبر/أكتوبر."],["المحتوى","المنهج (CSO) وأهداف التعلم (LOS) **ماتغيروش** مع تغيير شكل الامتحان في 2026، فأي كتاب حديث (2024 وبعده) لسه صالح."]],[2600,7038]],["h3","خطة مذاكرة مقترحة لكل جزء (12 أسبوع)"],["t",["الأسابيع","المذاكرة"],[["1–2","المحاور الأكبر وزنًا: الجزء الأول (الموازنات 20% + إدارة الأداء 20%) / الجزء التاني (تحليل القرارات 25%)."],["3–4","الجزء الأول: إدارة التكاليف / الجزء التاني: تحليل القوائم + تمويل الشركات."],["5–6","الجزء الأول: التقرير الخارجي / الجزء التاني: قرارات الاستثمار + المخاطر."],["7–8","الجزء الأول: الرقابة الداخلية + التكنولوجيا / الجزء التاني: الأخلاقيات."],["9–10","بنوك أسئلة بالمحور، والتركيز على الأسئلة اللي غلطت فيها."],["11–12","امتحانات كاملة بتوقيت (100 سؤال في 3 ساعات + حالات)، ومراجعة المعادلات."]],[1400,8238]],["h3","نصايح للامتحان"],["b","**ماتصرفش وقت كتير على سؤال واحد:** 1.8 دقيقة للسؤال. علّم على الصعب وارجعله."],["b","**أي وقت فاضل من الاختيار بيتنقل للحالات**، فالسرعة في الاختيار بتديك وقت أكتر للحالات."],["b","**في الحالات:** اقرا الأسئلة الأول وبعدين الحالة علشان تعرف بتدور على إيه، واكتب الأرقام بالظبط زي ما مطلوب (وحدات، نسبة، تقريب)."],["b","**احفظ المعادلات** وتدرب عليها بالآلة الحاسبة اللي في الامتحان."],["b","**الأخلاقيات 15% من الجزء التاني** ودي من أسهل الدرجات: احفظ المبادئ الأربعة والمعايير الأربعة وخطوات الحل."],["b","**مصادر رسمية:** موقع IMA (imanet.org) فيه الـ Content Specification Outline وأمثلة رسمية للحالات، وPrometric عندها محاكاة مجانية للواجهة."],["h3","الوقت المطلوب"],["p","IMA وجهات التحضير بتنصح بحوالي 150–170 ساعة لكل جزء لو عندك خلفية محاسبية، وأكتر من 200 ساعة لو المادة جديدة عليك. نسب النجاح العالمية بتتراوح حوالي 45–50% لكل جزء."]],"planEn":[["h3","Exam format from the September/October 2026 window"],["t",["Item","Details"],[["Parts","Two independent parts; you can take either first. You must pass both within 3 years of entering the program."],["Section 1","100 multiple-choice questions in 3 hours (about 1.8 minutes per question)."],["Section 2","Two case-based questions (CBQs) in 1 hour: each case is about 250 words followed by up to 7 questions (numeric entry, single choice, multiple select, drag-and-drop). **CBQs replace the essays.**"],["Gate to Section 2","You must score at least 50% on the multiple-choice section."],["Weighting","MCQs 75% and CBQs 25% of the score."],["Passing","360 out of 500 (scaled score)."],["Testing windows","January/February, May/June, September/October."],["Content","The Content Specification Outline (CSO) and Learning Outcome Statements (LOS) **did not change** with the 2026 format change, so any recent book (2024 or later) is still valid."]]],["h3","Suggested study plan per part (12 weeks)"],["t",["Weeks","Study"],[["1–2","Highest-weight domains: Part 1 (budgeting 20% + performance management 20%) / Part 2 (decision analysis 25%)."],["3–4","Part 1: cost management / Part 2: financial statement analysis + corporate finance."],["5–6","Part 1: external financial reporting / Part 2: investment decisions + risk management."],["7–8","Part 1: internal controls + technology / Part 2: professional ethics."],["9–10","Question banks by domain, focusing on questions you got wrong."],["11–12","Full timed mock exams (100 MCQs in 3 hours + cases) and formula review."]]],["h3","Exam tips"],["b","**Don’t spend too long on one question:** about 1.8 minutes each. Flag hard ones and come back."],["b","**Unused MCQ time carries over to the CBQ section**, so speed in MCQs gives you more time for cases."],["b","**In CBQs:** read the questions first, then the case, so you know what to look for; enter numbers exactly as required (units, percentages, rounding)."],["b","**Memorize the formulas** and practice them with the exam calculator."],["b","**Ethics is 15% of Part 2** and among the easiest points: memorize the four principles, the four standards, and the resolution steps."],["b","**Official resources:** IMA’s website (imanet.org) has the Content Specification Outline and official sample CBQs, and Prometric offers a free interface simulation."],["h3","Time needed"],["p","IMA and review providers recommend about 150–170 hours per part with an accounting background, and more than 200 hours if the material is new to you. Global pass rates are roughly 45–50% per part."]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const main = $('#main');
const AR = 'أبجد', ABC = 'ABCD';
const store = {
  get(k, d){ try{ const v = localStorage.getItem('cma.'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('cma.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- data ---------- */
const lessons = [], mcqs = [], domains = {};
D.parts.forEach(p => p.domains.forEach(d => {
  d.part = p.id; domains[d.code] = d; d.lessonIds = [];
  d.lessons.forEach(l => { l.id = lessons.length; l.dom = d.code; l.part = p.id; d.lessonIds.push(l.id); lessons.push(l); });
  d.mcqs.forEach((m, i) => { m.id = d.code + '-' + i; m.dom = d.code; m.part = p.id; mcqs.push(m); });
}));
D.cbqs.forEach((c, i) => c.id = i);
let part = +store.get('part', 1);
let lang = store.get('lang', 'both');

/* ---------- text helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmt = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const nf = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
const dirAttr = () => lang === 'ar' ? 'rtl' : 'ltr';
// one bilingual text slot
function T(ar, en){
  if (lang === 'ar' || en == null) return fmt(ar);
  if (lang === 'en') return fmt(en);
  if (String(en).trim() === String(ar).trim()) return fmt(en);
  return `<span class="bi"><span class="e" dir="ltr">${fmt(en)}</span><span class="a" dir="rtl">${fmt(ar)}</span></span>`;
}
const one = (ar, en) => lang === 'ar' ? ar : (en ?? ar);   // plain single string for short labels
const key = i => lang === 'ar' ? AR[i] : ABC[i];

function renderBlocks(arB, enB){
  let h = '', list = null;
  const close = () => { if (list){ h += `</${list}>`; list = null; } };
  arB.forEach((b, bi) => {
    const [k, ...a] = b; const e = enB ? enB[bi].slice(1) : null;
    if (k === 'b' || k === 'n'){ const t = k === 'b' ? 'ul' : 'ol'; if (list !== t){ close(); h += `<${t}>`; list = t; } h += `<li>${T(a[0], e && e[0])}</li>`; return; }
    close();
    if (k === 'h3') h += `<h3>${T(a[0], e && e[0])}</h3>`;
    else if (k === 'p') h += `<p>${T(a[0], e && e[0])}</p>`;
    else if (k === 't') h += `<div class="tbl"><table><thead><tr>${a[0].map((x, i) => `<th>${T(x, e && e[0][i])}</th>`).join('')}</tr></thead><tbody>${a[1].map((r, ri) => `<tr>${r.map((c, ci) => `<td>${T(c, e && e[1][ri][ci])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    else if (['ex','exam','note'].includes(k)) h += `<div class="box ${k}"><div class="bt">${T(a[0], e && e[0])}</div>${a[1].map((x, i) => `<p>${T(x, e && e[1][i])}</p>`).join('')}</div>`;
  });
  close(); return h;
}
function blocksToText(blocks){
  return blocks.map(([k, ...a]) => {
    if (k === 't') return [a[0].join(' | '), ...a[1].map(r => r.join(' | '))].join('\n');
    if (['ex','exam','note'].includes(k)) return a[0] + ':\n' + a[1].join('\n');
    return String(a[0] ?? '');
  }).join('\n').replace(/\*\*/g, '');
}
const lessonText = l => (l.en ? 'ENGLISH:\n' + blocksToText(l.en.blocks) + '\n\n' : '') + 'ARABIC:\n' + blocksToText(l.blocks);
function md(src){
  const lines = esc(src).split('\n'); let h = '', list = null, tbl = null;
  const close = () => { if (list){ h += `</${list}>`; list = null; } if (tbl){ h += '</tbody></table></div>'; tbl = null; } };
  const inline = s => s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<b>$1</b>');
  for (const ln of lines){
    const t = ln.trim(); let m;
    if (/^\|.*\|$/.test(t)){
      if (/^\|[\s:|-]+\|$/.test(t)) continue;
      const cells = t.slice(1, -1).split('|').map(c => inline(c.trim()));
      if (!tbl){ close(); h += `<div class="tbl"><table><thead><tr>${cells.map(c => `<th dir="auto">${c}</th>`).join('')}</tr></thead><tbody>`; tbl = 1; }
      else h += `<tr>${cells.map(c => `<td dir="auto">${c}</td>`).join('')}</tr>`;
      continue;
    }
    if ((m = t.match(/^[-*•]\s+(.*)/))){ if (list !== 'ul'){ close(); h += '<ul>'; list = 'ul'; } h += `<li dir="auto">${inline(m[1])}</li>`; continue; }
    if ((m = t.match(/^\d+[.)]\s+(.*)/))){ if (list !== 'ol'){ close(); h += '<ol>'; list = 'ol'; } h += `<li dir="auto">${inline(m[1])}</li>`; continue; }
    close();
    if ((m = t.match(/^#{1,4}\s+(.*)/))) h += `<h4 dir="auto">${inline(m[1])}</h4>`;
    else if (t) h += `<p dir="auto">${inline(t)}</p>`;
  }
  close(); return h;
}

/* ---------- progress ---------- */
let done = new Set(store.get('done', []));
let answered = store.get('mcq', {});
let cbqState = store.get('cbqs', {});
function toggleDone(id){ done.has(id) ? done.delete(id) : done.add(id); store.set('done', [...done]); buildToc(); }

/* ---------- part, language & TOC ---------- */
const domainsOf = p => D.parts[p-1].domains;
function setPart(p, rerender = true){
  part = p; store.set('part', p); document.body.dataset.part = p;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.part === p)));
  buildToc();
  if (rerender){
    const t = current.token || 'home';
    if (/^l\d+$/.test(t) && lessons[+t.slice(1)].part !== p) go('l' + domainsOf(p)[0].lessonIds[0]);
    else if (/^c\d+$/.test(t) && D.cbqs[+t.slice(1)].part !== p) go('cbq');
    else go(t);
  }
}
function setLang(l, rerender = true){
  lang = l; store.set('lang', l);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  buildToc();
  if (rerender){ const y = window.scrollY; if (run && current.view === 'practice' && run.i < run.pool.length) { /* keep quiz running */ } else go(current.token, false); window.scrollTo(0, current.view === 'lesson' ? y : 0); }
}
function buildToc(){
  const P = D.parts[part-1];
  const doneN = lessons.filter(l => l.part === part && done.has(l.id)).length, tot = lessons.filter(l => l.part === part).length;
  let h = `<div class="ph">${esc(P.title)}: ${esc(P.ar)}<br><span dir="ltr">${esc(P.enT)}: ${esc(P.en)}</span><br><span class="num">خلصت ${doneN} من ${tot} درس</span></div>`;
  P.domains.forEach(d => {
    h += `<div class="dom"><div class="dt"><span>${d.code} ${esc(lang === 'en' ? d.en : d.title)}</span><span class="num">${d.weight}%</span></div>${lang === 'both' ? `<div dir="ltr" style="font-size:12.5px;color:var(--muted);text-align:right">${esc(d.en)}</div>` : ''}<div class="wt"><i style="width:${d.weight*4}%"></i></div></div>`;
    d.lessons.forEach(l => {
      const t = lang === 'ar' ? esc(l.title) : lang === 'en' ? `<span dir="ltr">${esc(l.en.title)}</span>` : `<span dir="ltr">${esc(l.en.title)}</span><small>${esc(l.title)}</small>`;
      h += `<div class="${done.has(l.id) ? 'done' : ''}"><button class="ls" data-go="l${l.id}"><span class="tick" aria-hidden="true"></span><span class="tt">${t}</span></button></div>`;
    });
  });
  $('#toc').innerHTML = h;
  document.querySelectorAll('.toc .ls').forEach(b => b.classList.toggle('on', b.dataset.go === current.token));
}

/* ---------- views ---------- */
let current = { view: 'home', token: 'home' };
function viewHome(){
  const last = store.get('last', null);
  const ans = Object.entries(answered).filter(([k]) => mcqs.find(m => m.id === k));
  const right = ans.filter(([, v]) => v).length;
  const strip = P => `<div class="bp"><div class="bph"><b style="color:var(--p${P.id})">${esc(P.title)}: ${esc(P.ar)}</b><span dir="ltr">${esc(P.en)}</span></div>
    <div class="strip">${P.domains.map((d, i) => `<button data-go="l${d.lessonIds[0]}" data-setpart="${P.id}" style="flex:${d.weight} 1 0;background:var(--p${P.id});opacity:${1 - i * 0.1}" title="${esc(d.en)}"><span class="c">${d.code}</span><span class="w num">${d.weight}%</span></button>`).join('')}</div>
    <div class="legend">${P.domains.map(d => `<button data-go="l${d.lessonIds[0]}" data-setpart="${P.id}"><b style="color:var(--p${P.id})">${d.code}</b><span>${esc(d.title)}${lang !== 'ar' ? `<br><small dir="ltr" style="color:var(--muted)">${esc(d.en)}</small>` : ''}</span></button>`).join('')}</div></div>`;
  main.innerHTML = `<div class="col">
    <section class="hero">
      <h1>شهادة CMA بجزئيها: افهم كل محور بوزنه في الامتحان، واتدرب بنفس الشكل الجديد</h1>
      <p>${lessons.length} درس بشرح وأمثلة محلولة، و${mcqs.length} سؤال اختيار من متعدد، و${D.cbqs.length} حالات تفاعلية على نظام CBQ اللي بدأ من سبتمبر 2026. الشرح والأسئلة متاحين <b>بالإنجليزي والعربي</b>: اختار من فوق English أو عربي أو الاتنين مع بعض.</p>
    </section>
    ${D.parts.map(strip).join('')}
    <div class="fmt">
      <div><b class="num">100 سؤال · 3 ساعات</b><span>اختيار من متعدد، 75% من الدرجة</span></div>
      <div><b class="num">2 CBQ · ساعة</b><span>حالات، 25%</span></div>
      <div class="gate">لازم تجيب 50% في الاختيار علشان يفتحلك قسم الحالات. النجاح 360 من 500. المحتوى (CSO) مااتغيرش في 2026، اللي اتغير بس إن الحالات حلت محل المقالات. الامتحان نفسه بالإنجليزي، فالأفضل تذاكر بوضع "الاتنين" في الأول، وبعدين بالإنجليزي بس قبل الامتحان.</div>
    </div>
    <div class="stats">
      <div><b class="num">${done.size}</b>درس خلصته</div>
      <div><b class="num">${ans.length ? Math.round(100 * right / ans.length) + '%' : '–'}</b>نسبة إجاباتك الصح</div>
      <div><b class="num">${Object.values(cbqState).filter(s => s && s.done).length} / ${D.cbqs.length}</b>حالة خلصتها</div>
    </div>
    <div class="row">
      <button class="btn primary" data-go="l${last ?? 0}" data-setpart="${last != null ? lessons[last].part : 1}">${last != null ? 'كمّل: ' + esc(lessons[last].title) : 'ابدأ أول درس'}</button>
      <button class="btn" data-go="practice">أسئلة اختيار</button>
      <button class="btn" data-go="cbq">حالات CBQ</button>
    </div>
    <div class="box note" style="margin-top:28px"><div class="bt">عن الأسئلة</div><p>الأسئلة والحالات هنا مكتوبة بنفس أسلوب ومستوى امتحان CMA، مش منقولة من امتحانات حقيقية (IMA مش بتنشر أسئلتها). الأمثلة الرسمية للحالات موجودة على موقع IMA، وPrometric عندها محاكاة مجانية لواجهة الامتحان.</p></div>
  </div>`;
}

function viewLesson(id){
  const l = lessons[id]; if (!l) return viewHome();
  const d = domains[l.dom]; store.set('last', id);
  const title = lang === 'ar' ? esc(l.title) : lang === 'en' ? esc(l.en.title) : `${esc(l.en.title)}<span class="sub">${esc(l.title)}</span>`;
  main.innerHTML = `<article class="col">
    <div class="crumb">${d.code} ${esc(d.title)} · <span dir="ltr">${esc(d.en)}</span> · وزنه ${d.weight}%</div>
    <div dir="${dirAttr()}"><h1 class="lesson-title">${title}</h1></div>
    <div class="row ai-only" hidden style="margin-bottom:18px">
      <button class="btn" data-ai="simple">اشرحهولي أبسط</button>
      <button class="btn" data-ai="example">اديني مثال محلول جديد</button>
      <button class="btn" data-ai="formulas">لخّصلي المعادلات والمصطلحات</button>
    </div>
    <div id="aiLesson"></div>
    <div dir="${dirAttr()}" lang="${lang === 'ar' ? 'ar' : 'en'}">${renderBlocks(l.blocks, l.en.blocks)}</div>
    <h3>اختبر نفسك</h3>
    <div class="row">
      <button class="btn primary" data-quiz="${d.code}">حل أسئلة المحور ${d.code} (${d.mcqs.length} سؤال)</button>
      <button class="btn ai-only" hidden id="genQ">ولّد سؤال جديد على الدرس ده</button>
    </div>
    <div id="lessonQs" style="margin-top:14px"></div>
    <div class="row" style="margin-top:34px;padding-top:18px;border-top:1px solid var(--rule)">
      <button class="btn ${done.has(id) ? '' : 'good'}" id="doneBtn">${done.has(id) ? 'شيل علامة "خلصته"' : 'خلصت الدرس ده'}</button>
      <span style="margin-inline-start:auto"></span>
      ${lessons[id-1] && lessons[id-1].part === l.part ? `<button class="btn" data-go="l${id-1}">الدرس اللي فات</button>` : ''}
      ${lessons[id+1] && lessons[id+1].part === l.part ? `<button class="btn primary" data-go="l${id+1}">الدرس اللي بعده</button>` : ''}

function qHtml(m, k){

function whyHtml(m, ok){
  const e = m.en || {};

}
function bindQ(card, m, onDone){
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => {

}

function startRun({ dom, n, wrong }){
  let pool = mcqs.filter(m => m.part === part && (!dom || m.dom === dom) && (!wrong || answered[m.id] === false));
  if (!pool.length){ alert(wrong ? 'مفيش أسئلة غلطت فيها في الاختيار ده.' : 'مفيش أسئلة.'); return; }
  pool = pool.sort(() => Math.random() - .5).slice(0, n);
  run = { dom, pool, i: 0, res: [], t0: Date.now() };
  setActive('practice', 'practice'); current.view = 'practice'; current.token = 'practice';
  if (location.hash !== '#practice') history.replaceState(null, '', '#practice');
  stepRun();
}
function stepRun(){
  clearInterval(clockT);
  const r = run, m = r.pool[r.i];
  if (!m){
    const s = r.res.filter(Boolean).length, n = r.pool.length, avg = Math.round((Date.now() - r.t0) / 1000 / n);
    const hist = store.get('runs', []); hist.push({ p: part, d: new Date().toLocaleDateString('ar-EG'), t: r.dom ? r.dom + ' ' + domains[r.dom].title : '', s, n, avg }); store.set('runs', hist.slice(-40));
    const wrong = r.pool.filter((_, i) => !r.res[i]);
    run = null;
    main.innerHTML = `<div class="col"><h1 class="lesson-title">النتيجة</h1><div class="score num">${s} / ${n}</div>
      <p>متوسط وقتك <b class="num">${avg} ثانية</b> للسؤال ${avg <= 108 ? '(في حدود وقت الامتحان).' : '(أبطأ من وقت الامتحان، حوالي 108 ثانية).'} ${s === n ? 'ومفيش ولا غلطة.' : s / n >= .7 ? 'نتيجة كويسة. راجع الأسئلة اللي تحت.' : 'محتاج تراجع الدروس دي قبل ما تعيد.'}</p>
      ${wrong.length ? `<h3>راجع الأسئلة دي</h3>${wrong.map(m => `<div class="q" dir="${dirAttr()}"><div class="qt">${T(m.q, m.en.q)}</div><div class="why"><b class="ok">(${key(m.ans)})</b> ${T(m.opts[m.ans], m.en.opts[m.ans])}<br>${T(m.why, m.en.why)}</div><div class="row" style="margin-top:8px"><button class="btn" data-go="l${domains[m.dom].lessonIds[0]}">راجع المحور ${m.dom}</button></div></div>`).join('')}` : ''}
      <div class="row"><button class="btn primary" data-go="practice">تدريب جديد</button></div></div>`;
    return;
  }
  main.innerHTML = `<div class="col"><div class="runner-head"><span class="num">سؤال ${r.i+1} من ${r.pool.length} · ${m.dom}</span><span class="clock num" id="clock">0:00</span><span class="dots">${r.pool.map((_, i) => `<i class="${i < r.i ? (r.res[i] ? 'r' : 'w') : i === r.i ? 'c' : ''}"></i>`).join('')}</span></div>
    <div id="runQ">${qHtml(m, m.id)}</div><div class="row" id="runNext" hidden><button class="btn primary">${r.i === r.pool.length-1 ? 'شوف النتيجة' : 'السؤال اللي بعده'}</button></div></div>`;
  const t1 = Date.now(), ck = $('#clock');
  clockT = setInterval(() => { const s = Math.floor((Date.now() - t1) / 1000); ck.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); ck.classList.toggle('slow', s > 108); }, 1000);
  bindQ(main.querySelector('.q'), m, ok => { clearInterval(clockT); r.res[r.i] = ok; $('#runNext').hidden = false; $('#runNext button').focus(); });
  $('#runNext button').onclick = () => { r.i++; stepRun(); window.scrollTo(0, 0); };
}

function parseNum(v){ return parseFloat(String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s%]/g, '')); }
function checkTask(t, v){
  if (t.type === 'num'){ const x = parseNum(v); return !isNaN(x) && Math.abs(x - t.ans) <= (t.tol || 0) + 1e-9; }
  if (t.type === 'single') return v === t.ans;
  if (t.type === 'multi'){ return [...v].sort().join(',') === [...t.ans].sort().join(','); }
}
function taskHtml(t, i){
  const e = t.en || {};
  let body = '';
  if (t.type === 'num') body = `<div class="numrow"><input inputmode="decimal" aria-label="إجابتك" placeholder="${lang === 'ar' ? 'اكتب الرقم' : 'Enter a number'}"><span style="color:var(--muted)">${esc(one(t.unit || '', e.unit))}</span><button class="btn primary chk">${lang === 'ar' ? 'تحقق' : 'Check'}</button></div>`;
  else body = `<div class="opts ${t.type === 'multi' ? 'multi' : ''}">${t.opts.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${t.type === 'multi' ? '' : key(j)}</span><span>${T(o, e.opts && e.opts[j])}</span></button>`).join('')}</div>${t.type === 'multi' ? `<div class="row" style="margin-top:8px"><span style="color:var(--muted);font-size:14px">${lang === 'ar' ? 'اختار كل الإجابات الصحيحة' : 'Select all that apply'}</span><button class="btn primary chk">${lang === 'ar' ? 'تحقق' : 'Check'}</button></div>` : ''}`;
  return `<div class="q task" data-t="${i}"><div class="qt"><span class="n num">${i+1}.</span>${T(t.q, e.q)}</div>${body}</div>`;
}
function bindTasks(root, c, onScore){
  const st = { ok: {} };
  const finish = (card, t, i, ok) => {
    st.ok[i] = ok; const e = t.en || {};
    const head = ok ? one('صح.', 'Correct.') : one('مش صح.', 'Incorrect.');
    card.insertAdjacentHTML('beforeend', `<div class="why"><b class="${ok ? 'ok' : 'no'}">${head}</b> ${t.type === 'num' && !ok ? `${one('الإجابة', 'Answer')}: <b class="num">${nf(t.ans)}</b>. ` : ''}${T(t.why, e.why)}</div>`);
    card.querySelectorAll('button,input').forEach(x => x.disabled = true);
    if (Object.keys(st.ok).length === c.tasks.length) onScore(Object.values(st.ok).filter(Boolean).length);
  };
  c.tasks.forEach((t, i) => {
    const card = root.querySelector(`[data-t="${i}"]`);
    if (t.type === 'num'){
      const inp = card.querySelector('input'), go = () => { if (!inp.value.trim()) return; const ok = checkTask(t, inp.value); inp.classList.add(ok ? 'right' : 'wrong'); finish(card, t, i, ok); };
      card.querySelector('.chk').onclick = go; inp.onkeydown = ev => { if (ev.key === 'Enter') go(); };
    } else if (t.type === 'single'){
      card.querySelectorAll('.opt').forEach(b => b.onclick = () => { const j = +b.dataset.j; const btns = card.querySelectorAll('.opt'); btns[t.ans].classList.add('right'); if (j !== t.ans) b.classList.add('wrong'); finish(card, t, i, j === t.ans); });
    } else {
      const sel = new Set();
      card.querySelectorAll('.opt').forEach(b => b.onclick = () => { const j = +b.dataset.j; sel.has(j) ? sel.delete(j) : sel.add(j); b.classList.toggle('sel'); b.querySelector('.k').textContent = sel.has(j) ? '✓' : ''; });
      card.querySelector('.chk').onclick = () => { if (!sel.size) return; card.querySelectorAll('.opt').forEach((b, j) => { b.classList.remove('sel'); if (t.ans.includes(j)) b.classList.add('right'); else if (sel.has(j)) b.classList.add('wrong'); }); finish(card, t, i, checkTask(t, sel)); };
    }
  });
}

/* ---------- routing ---------- */
function setActive(view, token){
  document.querySelectorAll('nav.tabs button').forEach(b => {
    const g = b.dataset.go, on = g === view || (g === 'lessons' && view === 'lesson') || (g === 'cbq' && view === 'case');
    on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
  document.querySelectorAll('.toc .ls').forEach(b => b.classList.toggle('on', b.dataset.go === token));
}
function go(token, push = true){
  clearInterval(clockT);
  token = token || 'home';
  if (token === 'lessons'){ const last = store.get('last', null); token = 'l' + (last != null && lessons[last].part === part ? last : domainsOf(part)[0].lessonIds[0]); }
  let view = token;
  if (/^l\d+$/.test(token) && lessons[+token.slice(1)]){ const l = lessons[+token.slice(1)]; if (l.part !== part) setPart(l.part, false); view = 'lesson'; current.token = token; viewLesson(l.id); }
  else if (/^c\d+$/.test(token) && D.cbqs[+token.slice(1)]){ view = 'case'; current.token = token; viewCbq(+token.slice(1)); }
  else if (token === 'practice'){ run = null; viewPractice(); }
  else if (token === 'cbq') viewCbqList();
  else if (token === 'plan') viewPlan();
  else { token = 'home'; view = 'home'; viewHome(); }
  current.view = view; current.token = token;
  setActive(view, token); updateTutorCtx();
  if (push && location.hash.slice(1) !== token) history.replaceState(null, '', '#' + token);
  $('#toc').classList.remove('open');
  if (push) window.scrollTo(0, 0);
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-go]'); if (!b) return;
  ev.preventDefault();
  if (b.dataset.setpart && +b.dataset.setpart !== part) setPart(+b.dataset.setpart, false);
  go(b.dataset.go);
});

  streamInto($('#aiLesson'), `${persona()}\n\nالمحور: ${domains[l.dom].code} ${domains[l.dom].en}\nنص الدرس:\n"""\n${lessonText(l).slice(0, 10000)}\n"""\n\nطلب الطالب: ${ask}`, btn.textContent);
}
const pair = v => (v && typeof v === 'object') ? { en: String(v.en ?? ''), ar: String(v.ar ?? v.en ?? '') } : { en: String(v ?? ''), ar: String(v ?? '') };
async function genQuestion(title, ctx, container, btn){
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'بيكتب السؤال…';
  try{
    const m = await sample.json(`${persona()}\n\nاكتب سؤال اختيار من متعدد واحد جديد على نمط امتحان CMA عن: ${title}.\nالمرجع:\n"""\n${ctx.slice(0, 7000)}\n"""\nيكون تطبيقي (فيه أرقام أو حالة)، و4 اختيارات واحد بس صح والباقي مقنعين. اكتب كل نص بالإنجليزي (بأسلوب الامتحان) وبالعربي.\nرجّع JSON بس:\n{"q":{"en":"","ar":""},"opts":[{"en":"","ar":""},{"en":"","ar":""},{"en":"","ar":""},{"en":"","ar":""}],"ans":0,"why":{"en":"","ar":""}}`, { cache: false });
    if (!m || !Array.isArray(m.opts) || m.opts.length !== 4 || !(m.ans >= 0 && m.ans < 4) || !m.q) throw { code: 'bad' };
    const q = pair(m.q), w = pair(m.why), os = m.opts.map(pair);
    const qq = { q: q.ar, opts: os.map(o => o.ar), ans: +m.ans, why: w.ar, en: { q: q.en, opts: os.map(o => o.en), why: w.en }, tag: 'سؤال مولّد بالذكاء الاصطناعي، راجعه مع الدرس لو حسيت إن فيه حاجة غريبة.' };
    const wr = document.createElement('div'); wr.innerHTML = qHtml(qq, 'ai'); const card = wr.firstElementChild; bindQ(card, qq);
    container.appendChild(card); card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch(e){ const p = document.createElement('p'); p.style.color = 'var(--no)'; p.textContent = e?.code === 'bad' ? 'السؤال اللي اتولد مكانش بالشكل الصح. جرب تاني.' : errMsg(e); container.appendChild(p); handleErr(e); }
  btn.disabled = false; btn.textContent = old;
}
async function genCase(c){
  const btn = $('#genCase'), out = $('#newCase'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'بيكتب الحالة… (ممكن تاخد دقيقة)';
  const ctx = c.domains.map(x => domains[x].lessons.map(l => l.en.title + ':\n' + blocksToText(l.en.blocks)).join('\n')).join('\n').slice(0, 9000);
  try{
    const r = await sample.json(`${persona()}\n\nاكتب حالة CBQ جديدة على نمط امتحان CMA 2026 على المحاور: ${c.domains.map(x => domains[x].en).join(' + ')}.\nالمرجع:\n"""\n${ctx}\n"""\nالحالة: شركة مصرية خيالية، نص حوالي 200 كلمة فيه كل الأرقام المطلوبة، وبعده 6 أسئلة مترابطة: 3 أو 4 إدخال رقم (type "num" بإجابة رقمية و tol للتقريب)، والباقي "single" (4 اختيارات و ans رقم) أو "multi" (4 اختيارات و ans مصفوفة أرقام). اتأكد إن كل الأرقام محسوبة صح. كل نص يكون بالإنجليزي (بأسلوب الامتحان) وبالعربي.\nرجّع JSON بس:\n{"title":{"en":"","ar":""},"caseText":[{"en":"","ar":""}],"tasks":[{"type":"num","q":{"en":"","ar":""},"ans":0,"tol":0,"unit":{"en":"","ar":""},"why":{"en":"","ar":""}},{"type":"single","q":{"en":"","ar":""},"opts":[{"en":"","ar":""}],"ans":0,"why":{"en":"","ar":""}},{"type":"multi","q":{"en":"","ar":""},"opts":[{"en":"","ar":""}],"ans":[0,2],"why":{"en":"","ar":""}}]}`, { cache: false, modelTier: 'complex' });
    if (!r || !Array.isArray(r.caseText) || !Array.isArray(r.tasks) || !r.tasks.length) throw { code: 'bad' };
    const tasks = r.tasks.filter(t => ['num','single','multi'].includes(t.type) && (t.type === 'num' ? typeof t.ans === 'number' : Array.isArray(t.opts))).map(t => {
      const q = pair(t.q), w = pair(t.why), u = pair(t.unit), os = t.opts ? t.opts.map(pair) : null;
      return { type: t.type, ans: t.ans, tol: +t.tol || 0, q: q.ar, why: w.ar, unit: u.ar, opts: os && os.map(o => o.ar), en: { q: q.en, why: w.en, unit: u.en, opts: os && os.map(o => o.en) } };
    });
    if (!tasks.length) throw { code: 'bad' };
    const ti = pair(r.title), ct = r.caseText.map(pair);
    const nc = { title: ti.ar, caseText: ct.map(x => x.ar), en: { title: ti.en, caseText: ct.map(x => x.en) }, tasks };
    out.innerHTML = `<h3 dir="auto">${esc(cTitle(nc))}</h3><p style="color:var(--muted);font-size:14px">حالة مولّدة بالذكاء الاصطناعي. لو حسيت إن رقم غريب، راجع خطوات الحل في الشرح.</p><div id="nc"></div>`;
    renderCbq(nc, 'nc'); out.scrollIntoView({ behavior: 'smooth' });
  } catch(e){ out.innerHTML = `<p style="color:var(--no)">${esc(e?.code === 'bad' ? 'الحالة اللي اتولدت مكانتش بالشكل الصح. جرب تاني.' : errMsg(e))}</p>`; handleErr(e); }
  btn.disabled = false; btn.textContent = old;
}

/* tutor */
let chat = [], busy = false;
function updateTutorCtx(){
  const c = current.view === 'lesson' ? lessons[+current.token.slice(1)].title : current.view === 'case' ? D.cbqs[+current.token.slice(1)].title : D.parts[part-1].title;
  $('#tutorCtx').textContent = 'بتسأل عن: ' + c;
  const chips = current.view === 'lesson' ? ['اديني سؤال اختيار على الدرس ده', 'ترجملي المصطلحات المهمة', 'إيه أكتر حاجة بتتسأل هنا؟'] : current.view === 'case' ? ['أبدأ الحالة منين؟', 'اديني تلميح للسؤال الأول', 'ترجملي الحالة بالعربي'] : ['أبدأ بالجزء الأول ولا التاني؟', 'إزاي أتعود على أسئلة الإنجليزي؟', 'إزاي أنظم وقتي في الامتحان؟'];
  $('#chips').innerHTML = chips.map(x => `<button type="button">${esc(x)}</button>`).join('');
  $('#chips').querySelectorAll('button').forEach(b => b.onclick = () => sendChat(b.textContent));
}
function ctxText(){
  if (current.view === 'lesson') return 'الطالب بيذاكر الدرس ده:\n' + lessonText(lessons[+current.token.slice(1)]).slice(0, 9000);
  if (current.view === 'case'){ const c = D.cbqs[+current.token.slice(1)]; return 'الطالب بيحل الحالة دي (اديله تلميحات ومتكشفش الإجابات إلا لو طلب صراحة):\n' + c.en.caseText.join('\n') + '\n' + c.caseText.join('\n') + '\nالأسئلة والحلول للمرجعية:\n' + c.tasks.map((t, i) => `${i+1}. ${t.en.q} / ${t.q} | الإجابة: ${t.type === 'num' ? t.ans : JSON.stringify(t.ans)} | ${t.why}`).join('\n'); }
  return 'الطالب في الصفحة الرئيسية لتطبيق مذاكرة CMA، الجزء المختار: ' + D.parts[part-1].title + ' ' + D.parts[part-1].en;
}
function addMsg(role, html){ const d = document.createElement('div'); d.className = 'msg ' + role; d.innerHTML = html; $('#chat').appendChild(d); $('#chat').scrollTop = 1e9; return d; }
async function sendChat(text){
  text = text.trim(); if (!text || busy) return;
  busy = true; $('#tutorSend').disabled = true; $('#tutorIn').value = '';
  addMsg('u', esc(text)); const a = addMsg('a', '<span class="thinking">بيفكر</span>');
  chat.push({ role: 'user', content: text });
  const turns = chat.slice(-10); while (turns.length && turns[0].role !== 'user') turns.shift();
  const input = turns.map((t, i) => i === 0 ? { role: 'user', content: `${persona()}\n\n${ctxText()}\n\nسؤال الطالب: ${t.content}` } : t);
  try{ const r = await sample(input, { cache: false, onText: ({ text }) => { a.innerHTML = md(text); $('#chat').scrollTop = 1e9; } }); a.innerHTML = md(r.text); chat.push({ role: 'assistant', content: r.text }); }
  catch(e){ a.innerHTML = `<p>${esc(errMsg(e))}</p>`; chat.pop(); handleErr(e); if (!sample) $('#tutor').hidden = true; }
  busy = false; $('#tutorSend').disabled = false;
}
$('#tutorFab').onclick = () => { const t = $('#tutor'); t.hidden = !t.hidden; if (!t.hidden){ if (!$('#chat').children.length) addMsg('a', '<p>أهلًا! اسألني في أي درس أو حالة إنت فاتحها، بالعربي أو بالإنجليزي.</p>'); $('#tutorIn').focus(); } };
$('#tutorClose').onclick = () => $('#tutor').hidden = true;
$('#tutorForm').onsubmit = ev => { ev.preventDefault(); sendChat($('#tutorIn').value); };

/* boot */
setLang(lang, false);
setPart(part, false);
go(location.hash.slice(1) || 'home', false);
(async () => { try{ sample = window.claude ? await window.claude.use('sample') : null; } catch(e){ sample = null; } showAI(); })();
</script>
